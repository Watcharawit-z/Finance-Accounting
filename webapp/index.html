<title>ดุลย์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F9; --panel:#FFFFFF; --side:#FFFFFF; --sunken:#EFF2F5;
  --ink:#14181F; --ink-2:#3A424E; --muted:#6B7480; --faint:#A2ABB6;
  --rule:#E1E6EB; --rule-2:#EDF0F4;
  --accent:#14556F; --accent-d:#0F3A4D; --accent-w:#E4EFF4; --on-accent:#FFFFFF;
  --good:#17694A; --good-w:#E6F2ED;
  --neg:#A32B2B;  --neg-w:#FAEAEA;
  --warn:#8A5A10; --warn-w:#FBF1DE;
  --s1:#1273A8; --s2:#C07A3C; --c-warn:#B07A18; --c-neg:#B23A3A;
  --shadow:0 1px 2px rgba(20,24,31,.06);
  --shadow-2:0 6px 20px rgba(20,24,31,.09);
  --radius:6px;
  --sans:"Sarabun","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1216; --panel:#171B21; --side:#171B21; --sunken:#1D222A;
    --ink:#E9ECF0; --ink-2:#B7BFC9; --muted:#8A939E; --faint:#5E6773;
    --rule:#282E37; --rule-2:#22272F;
    --accent:#6FB0CB; --accent-d:#8FC4DA; --accent-w:#1B2C36; --on-accent:#0F1216;
    --good:#5FBF95; --good-w:#152A22;
    --neg:#E08585;  --neg-w:#2E1B1B;
    --warn:#DCAE62; --warn-w:#2C2417;
    --s1:#2B96C0; --s2:#C68540; --c-warn:#C69A3C; --c-neg:#C96A6A;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 6px 20px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1216; --panel:#171B21; --side:#171B21; --sunken:#1D222A;
  --ink:#E9ECF0; --ink-2:#B7BFC9; --muted:#8A939E; --faint:#5E6773;
  --rule:#282E37; --rule-2:#22272F;
  --accent:#6FB0CB; --accent-d:#8FC4DA; --accent-w:#1B2C36; --on-accent:#0F1216;
  --good:#5FBF95; --good-w:#152A22;
  --neg:#E08585;  --neg-w:#2E1B1B;
  --warn:#DCAE62; --warn-w:#2C2417;
  --s1:#2B96C0; --s2:#C68540; --c-warn:#C69A3C; --c-neg:#C96A6A;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 6px 20px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.62; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h2,h3{margin:0; font-weight:600; text-wrap:balance; letter-spacing:-.015em}
.mono{font-family:var(--mono)}
.num,.mono,input,select{font-variant-numeric:tabular-nums}
.grow{flex:1}
.dim{color:var(--muted)}
.neg{color:var(--neg)}
.ctr,.c{text-align:center}
th.r,td.r,.r{text-align:right}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- แถบบน ---------- */
.top{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:14px;
  height:56px; padding:0 18px; background:var(--panel); border-bottom:1px solid var(--rule);
}
.brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:17px; letter-spacing:.01em}
.brand-mark{
  width:22px; height:22px; border:1.5px solid var(--accent); border-radius:3px; display:grid;
  place-items:center; color:var(--accent); font-size:11px; font-weight:700; font-family:var(--mono);
}
.brand-sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--faint); font-weight:400; text-transform:uppercase}
.co{font-size:14px; color:var(--ink-2); padding-left:14px; border-left:1px solid var(--rule)}
.periodwrap{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
.periodwrap select{
  font:inherit; font-size:13px; color:var(--ink); background:var(--panel);
  border:1px solid var(--rule); border-radius:4px; padding:5px 9px; font-size:14px;
}
.icon-btn{
  display:none; background:var(--panel); border:1px solid var(--rule); border-radius:4px;
  color:var(--ink); font-size:15px; line-height:1; padding:7px 9px; cursor:pointer;
}

/* ---------- โครง ---------- */
.shell{display:flex; align-items:flex-start; min-height:calc(100vh - 56px)}
#nav{
  width:244px; flex:none; position:sticky; top:56px; align-self:flex-start;
  height:calc(100vh - 56px); overflow-y:auto; padding:8px 8px 40px;
  background:var(--side); border-right:1px solid var(--rule);
}
.nav-g{font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); padding:14px 8px 4px}
.nav-i{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:7px 10px; border-radius:4px; font-size:14px; color:var(--ink-2); text-decoration:none;
}
.nav-i:hover{background:var(--sunken); color:var(--ink)}
.nav-i.on{background:var(--accent-w); color:var(--accent-d); font-weight:600}
.badge{
  font-size:11.5px; color:var(--neg); background:var(--neg-w); padding:1px 7px;
  border-radius:10px; font-variant-numeric:tabular-nums;
}
#main{flex:1; min-width:0; padding:20px 22px 60px; max-width:1500px}

/* ---------- การ์ด ---------- */
.card{background:var(--panel); border:1px solid var(--rule); border-radius:var(--radius); margin-bottom:18px; box-shadow:var(--shadow); overflow:hidden}
.card-h{display:flex; align-items:flex-start; gap:12px; padding:13px 16px; border-bottom:1px solid var(--rule)}
.card-h h2{font-size:16.5px; letter-spacing:-.005em}
.card-sub{font-size:13px; color:var(--muted); margin-top:2px; font-weight:400; letter-spacing:0}
.card-f{padding:11px 16px; border-top:1px solid var(--rule); font-size:12.5px; color:var(--muted); line-height:1.55}
.filters{display:flex; gap:8px; padding:9px 16px; border-bottom:1px solid var(--rule); flex-wrap:wrap}
.sub-h{display:flex; align-items:center; gap:10px; padding:15px 16px 6px; font-size:14px; font-weight:600; color:var(--ink-2)}
.note{margin:12px 16px; padding:10px 12px; border-radius:4px; font-size:13px; color:var(--muted); background:var(--sunken)}
.note.warn{border:1px solid var(--warn); background:var(--warn-w); color:var(--warn)}
.prose{padding:14px 16px; max-width:66ch; font-size:15px; line-height:1.75; color:var(--ink-2)}
.prose p{margin:0 0 11px}
.split{display:grid; grid-template-columns:1.15fr 1fr; gap:18px; align-items:start}

/* ---------- ปุ่ม ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 13px;
  border-radius:var(--radius); border:1px solid var(--rule); background:var(--panel); color:var(--ink);
  font:inherit; font-size:13.5px; font-weight:500; cursor:pointer; white-space:nowrap;
}
.btn+.btn{margin-left:7px}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-d); border-color:var(--accent-d)}
.btn.disabled{opacity:.45; cursor:not-allowed}
.chip{
  display:inline-flex; align-items:center; height:28px; padding:0 10px; font:inherit; font-size:12px;
  border:1px solid var(--rule); background:var(--panel); color:var(--ink-2); border-radius:4px; cursor:pointer; font-weight:500;
}
.chip.on{border-color:var(--accent); color:var(--accent-d); background:var(--accent-w)}
.search{
  font:inherit; font-size:14px; height:34px; padding:0 11px; border:1px solid var(--rule);
  border-radius:4px; background:var(--panel); color:var(--ink); min-width:min(320px,100%); flex:1; max-width:420px;
}

/* ---------- ตาราง ---------- */
.scroll{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th{
  text-align:left; font-weight:600; color:var(--muted); font-size:12px; letter-spacing:.01em;
  white-space:nowrap; padding:10px 12px; border-bottom:1px solid var(--rule);
}
td{padding:9px 12px; border-bottom:1px solid var(--rule-2); vertical-align:top; line-height:1.5}
td.num{text-align:right; font-variant-numeric:tabular-nums; letter-spacing:-.01em; white-space:nowrap}
td.mono{font-family:var(--mono); font-size:12.5px; white-space:nowrap}
td.num.bad{color:var(--neg)} td.num.good{color:var(--good)}
tbody tr:last-child td{border-bottom:none}
tfoot td{padding:9px 12px; border-top:1.5px solid var(--rule); border-bottom:none; font-weight:600}
.row-link{cursor:pointer}
.row-link:hover td{background:var(--sunken)}
.empty{padding:44px 16px; text-align:center; color:var(--muted); font-size:14px}
.st{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; white-space:nowrap}
.st::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.st.paid{color:var(--good)} .st.open{color:var(--accent)}
.st.late{color:var(--neg)} .st.draft{color:var(--muted)} .st.wait{color:var(--warn)}

/* ---------- ตัวเลขสรุป ---------- */
.kpis{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  background:var(--panel); border:1px solid var(--rule); border-radius:var(--radius);
  margin-bottom:18px; overflow:hidden; box-shadow:var(--shadow);
}
.kpi{padding:13px 16px; border-inline-end:1px solid var(--rule); display:flex; flex-direction:column}
.kpi:last-child{border-inline-end:0}
.kpi.clickable{cursor:pointer}
.kpi.clickable:hover{background:var(--sunken)}
.kpi-l{font-size:12.5px; color:var(--muted)}
.kpi-v{font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:2px; letter-spacing:-.02em; line-height:1.25}
.kpi-s{font-size:12px; color:var(--muted); margin-top:2px; line-height:1.4}
.kpi.good .kpi-v{color:var(--good)} .kpi.bad .kpi-v{color:var(--neg)} .kpi.warn .kpi-v{color:var(--warn)}

/* ---------- รายการตรวจ ---------- */
.todo,.checks{list-style:none; margin:0; padding:2px 0}
.todo li,.checks li{display:flex; align-items:center; gap:11px; padding:11px 16px; border-bottom:1px solid var(--rule-2); font-size:13.5px}
.todo li:last-child,.checks li:last-child{border-bottom:none}
.todo.big li{padding:13px 16px}
.dot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--faint)}
.dot.good{background:var(--good)} .dot.bad{background:var(--neg)} .dot.warn{background:var(--warn)}
.todo .dim{font-size:12.5px; margin-top:1px}

/* ---------- เอกสาร ---------- */
.docgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; padding:14px 16px; font-size:13.5px}
.docgrid .dim{font-size:11.5px; letter-spacing:.03em; text-transform:uppercase; color:var(--faint); margin-bottom:3px}
.totals{margin-left:auto; width:min(380px,100%); padding:12px 16px; font-size:13.5px}
.totals div{display:flex; justify-content:space-between; padding:4px 0}
.totals b{font-variant-numeric:tabular-nums; font-weight:500}
.totals .gt{border-top:1px solid var(--rule); margin-top:4px; padding-top:8px; font-weight:600; font-size:13.5px}
.reco{padding:13px 16px; font-size:13.5px; max-width:580px}
.reco div{display:flex; justify-content:space-between; gap:20px; padding:5px 0}
.reco b{font-variant-numeric:tabular-nums; font-weight:500}
.reco .gt{border-top:1px solid var(--rule); margin-top:5px; padding-top:9px; font-weight:600; font-size:13.5px}

/* ---------- งบการเงิน ---------- */
table.fs td{border-bottom:none; padding:7px 14px; font-size:14px; white-space:normal}
table.fs td.num,table.fs td:last-child{text-align:right; font-variant-numeric:tabular-nums; letter-spacing:-.01em; white-space:nowrap}
table.fs td[colspan]{text-align:left}
table.fs td.ind{padding-inline-start:30px; color:var(--ink-2)}
table.fs tr.fs-h td{font-weight:600; padding-top:10px; padding-bottom:8px; background:var(--rule-2)}
table.fs tr.fs-h2 td{font-weight:600; color:var(--ink-2); padding-top:12px; font-size:13px}
table.fs tr.fs-s td{font-weight:600; border-top:1px solid var(--rule); padding-top:8px}
table.fs tr.fs-s td:first-child{padding-inline-start:16px}
table.fs tr.fs-t td{font-weight:700; border-top:1.5px solid var(--ink); border-bottom:3px double var(--ink); padding:9px 14px}
table.fs tr.sp td{height:10px}
table.fs thead th{background:transparent}

/* ---------- อื่น ๆ ---------- */
.periods{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; padding:14px 16px}
.pchip{
  font:inherit; text-align:left; padding:9px 12px; border:1px solid var(--rule); background:var(--panel);
  border-radius:4px; cursor:pointer; font-size:13.5px; color:var(--ink);
}
.pchip:hover{background:var(--sunken)}
.pchip span{display:block; font-size:12px; color:var(--muted); margin-top:2px}
.pchip.closed{background:var(--sunken)}
.pchip.on{border-color:var(--accent); background:var(--accent-w); color:var(--accent-d); font-weight:600}
.bar{display:inline-block; width:70px; height:5px; background:var(--rule-2); border-radius:3px; vertical-align:middle; margin-right:7px; overflow:hidden}
.bar i{display:block; height:5px; background:var(--accent)}
.lines th{padding:7px 8px}
.lines td{padding:4px 8px; border-bottom:none}
.lines input,.lines select{
  font:inherit; font-size:13.5px; width:100%; min-width:70px; height:32px; padding:0 8px;
  border:1px solid var(--rule); border-radius:4px; background:var(--panel); color:var(--ink);
}
.lines input.r{text-align:right; font-variant-numeric:tabular-nums}

/* ---------- กราฟ ---------- */
.dash-2{display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start}
.chart-wrap{padding:12px 16px 6px}
.chart{width:100%; height:auto; display:block; overflow:visible}
.chart .grid{stroke:var(--rule-2); stroke-width:1}
.chart .grid.base{stroke:var(--rule)}
.chart .ax{fill:var(--muted); font-size:11.5px; font-family:var(--sans)}
.chart .ax.lbl{fill:var(--ink-2); font-size:12.5px}
.chart .val{fill:var(--ink); font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; font-family:var(--sans)}
.chart .mk{transition:opacity .12s}
.chart:hover .mk{opacity:.55}
.chart .mk:hover{opacity:1; cursor:default}
.chart .track{fill:var(--rule-2)}
.chart .area{fill:var(--s1); opacity:.11; stroke:none}
.chart .line{fill:none; stroke:var(--s1); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.chart .dot{fill:var(--s1); stroke:var(--panel); stroke-width:2}
.legend{display:flex; align-items:center; gap:16px; padding:4px 16px 10px; font-size:12.5px; color:var(--ink-2); flex-wrap:wrap}
.legend span{display:inline-flex; align-items:center; gap:7px}
.legend i{width:10px; height:10px; border-radius:2px; display:block}
.legend .unit{color:var(--muted); font-size:12px}
.spark{width:100%; height:26px; margin-top:auto; padding-top:9px; display:block; overflow:visible}
.spark polyline{fill:none; stroke:var(--s1); stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round; vector-effect:non-scaling-stroke}
.spark circle{fill:var(--s1)}
.kpi-s .up{color:var(--good); font-weight:600} .kpi-s .down{color:var(--neg); font-weight:600}
#tip{
  position:fixed; z-index:90; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--ink); color:var(--panel); font-size:12.5px; padding:6px 10px; border-radius:4px;
  box-shadow:var(--shadow-2); white-space:nowrap; font-variant-numeric:tabular-nums;
}
#tip.show{opacity:1}

/* ---------- ป้ายสถานะการบันทึกขึ้นเซิร์ฟเวอร์ ---------- */
.sync-tag{font-size:12px; color:var(--muted); white-space:nowrap}
.sync-tag.saving{color:var(--warn)}
.sync-tag.saved{color:var(--good)}
.sync-tag.error{color:var(--neg); font-weight:600}
.sync-tag:empty{display:none}
@media (max-width:640px){ .sync-tag{display:none} }

/* ---------- ป้ายบอกว่าเป็นข้อมูลตัวอย่าง ---------- */
.demo-tag{
  margin-left:10px; font:inherit; font-size:11.5px; font-weight:600; cursor:pointer;
  color:var(--warn); background:var(--warn-w); border:1px solid var(--warn);
  border-radius:10px; padding:1px 9px; white-space:nowrap;
}
.demo-tag:hover{filter:brightness(1.05)}
.demo-note{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  background:var(--warn-w); border:1px solid var(--warn); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:18px; font-size:13.5px; color:var(--warn);
}
.demo-note b{display:block; font-size:14.5px; margin-bottom:3px}
.demo-note div div{color:var(--ink-2); line-height:1.55}
@media (max-width:900px){ .demo-note .btn{margin-left:0} }

/* ---------- นำเข้าไฟล์ ---------- */
.drop{margin:16px; border:2px dashed var(--rule); border-radius:var(--radius); background:var(--paper); transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent); background:var(--accent-w)}
.drop-in{padding:38px 20px; text-align:center; font-size:14px}
.drop-in b{display:block; font-size:16px; margin-bottom:8px}
.drop-in .dim{margin:8px 0; font-size:13px; line-height:1.65}
td select{font:inherit; font-size:13px; height:32px; padding:0 8px; border:1px solid var(--rule); border-radius:4px; background:var(--panel); color:var(--ink); max-width:280px}
.reco b.neg{color:var(--neg)}

/* ---------- แจ้งเตือน ---------- */
.toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); z-index:80;
  max-width:min(560px,92vw); padding:12px 16px; border-radius:var(--radius); font-size:13px;
  background:var(--ink); color:var(--panel); box-shadow:var(--shadow-2); line-height:1.5;
  opacity:0; pointer-events:none; transition:opacity .16s,transform .16s;
}
.toast div{font-size:12px; opacity:.78; margin-top:3px}
.toast.show{opacity:1; transform:translate(-50%,0)}
.toast.err{background:var(--neg); color:#fff}

/* ---------- กล่องโต้ตอบ ---------- */
#modal{position:fixed; inset:0; z-index:70; display:none; align-items:flex-start; justify-content:center;
  background:rgba(20,24,31,.45); padding:5vh 16px; overflow-y:auto}
#modal.show{display:flex}
.modal-box{background:var(--panel); border:1px solid var(--rule); border-radius:8px; width:min(760px,100%); box-shadow:var(--shadow-2); overflow:hidden}
.modal-h{display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border-bottom:1px solid var(--rule)}
.modal-h h3{font-size:16.5px}
.modal-h .icon-btn{display:block; border:none; background:none; font-size:14px; color:var(--muted)}
.modal-b{padding:2px 0 12px; max-height:64vh; overflow-y:auto}
.modal-f{display:flex; align-items:center; gap:10px; padding:11px 16px; border-top:1px solid var(--rule); background:var(--sunken); font-size:12.5px}
.flds{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; padding:14px 16px}
.fld-w.wide{grid-column:1/-1}
.fld-w label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px}
.fld-w input,.fld-w select{
  font:inherit; font-size:14px; width:100%; height:34px; padding:0 10px;
  border:1px solid var(--rule); border-radius:4px; background:var(--panel); color:var(--ink);
}
.fld-w input:focus,.fld-w select:focus,.lines input:focus,.lines select:focus,.search:focus{
  outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-w);
}
.fld-hint{font-size:12px; color:var(--muted); margin-top:5px; line-height:1.45}

/* ---------- จอเล็ก ---------- */
@media (max-width:900px){
  .icon-btn{display:block}
  .co{display:none}
  .split,.dash-2{grid-template-columns:1fr}
  #nav{
    position:fixed; top:56px; left:0; z-index:50; width:264px;
    transform:translateX(-100%); transition:transform .18s ease;
  }
  body.nav-open #nav{transform:none; box-shadow:var(--shadow-2)}
  #main{padding:14px 12px 60px}
  .card-h{flex-wrap:wrap}
  .brand-sub{display:none}
  .kpi{border-inline-end:0; border-bottom:1px solid var(--rule)}
}
@media (max-width:520px){
  .top{padding:0 12px; gap:10px}

<script>
/* ===== engine.js ===== */
/* ===================================================================
   DULY — เครื่องบัญชีที่รันในเบราว์เซอร์
   ตรรกะเดียวกับ apps/api แต่เก็บข้อมูลไว้ในเครื่องผู้ใช้

/* ---------- เงิน: จำนวนเต็มสเกล 4 ตำแหน่ง ห้ามใช้ทศนิยมลอยตัว ---------- */
const S = 10000;

function M(v) {
  if (typeof v === 'number') return Math.round(v * S);
  if (typeof v === 'string') {
    const t = v.trim().replace(/,/g, '');
    if (!/^-?\d*(\.\d+)?$/.test(t) || t === '' || t === '-') return 0;
    return Math.round(parseFloat(t) * S);
  }
  return 0;
}
const divRound = (n, d) => {
  const neg = (n < 0) !== (d < 0);
  const a = Math.abs(n), b = Math.abs(d);
  const q = Math.floor(a / b), r = a - q * b;
  const out = r * 2 >= b ? q + 1 : q;
  return neg ? -out : out;
};
const mulQty  = (a, q) => divRound(a * M(q), S);
const pct     = (a, rate) => divRound(a * M(rate), S * 100);
const round2  = (a) => divRound(a, 100) * 100;
const baseFromIncl = (incl, rate) => round2(divRound(incl * 100 * S, 100 * S + M(rate)));

function fmt(a, dec) {
  dec = dec === undefined ? 2 : dec;
  const neg = a < 0, abs = Math.abs(a);
  const unit = Math.pow(10, 4 - dec);
  const r = divRound(abs, unit);
  const p = Math.pow(10, dec);
  const i = Math.floor(r / p);
  const f = String(r - i * p).padStart(dec, '0');
  const g = String(i).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const body = dec > 0 ? g + '.' + f : g;
  return neg ? '(' + body + ')' : body;
}
const fmt0 = (a) => (a === 0 ? '—' : fmt(a));

/* ---------- วันที่แบบไทย ---------- */
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
               'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function thDate(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-').map(Number);
  return d + ' ' + TH_M[m - 1] + ' ' + (y + 543);
}
function thDateNum(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-').map(Number);
  return String(d).padStart(2,'0') + '/' + String(m).padStart(2,'0') + '/' + (y + 543);
}
function thPeriod(p) {           // '2026-07' → 'กรกฎาคม 2569'
  const [y, m] = p.split('-').map(Number);
  return TH_MF[m - 1] + ' ' + (y + 543);
}
const periodOf = (iso) => iso.slice(0, 7);
function addDays(iso, n) {
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function endOfMonth(iso) {
  const [y, m] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
}

/* ---------- เลขประจำตัวผู้เสียภาษี ---------- */
function validTaxId(id) {
  if (!/^\d{13}$/.test(id || '')) return false;
  let sum = 0;
  for (let i = 0; i < 12; i++) sum += Number(id[i]) * (13 - i);
  return ((11 - (sum % 11)) % 10) === Number(id[12]);
}

/* ---------- ข้อผิดพลาดเชิงธุรกิจ ---------- */
class DomainError extends Error {
  constructor(code, message, hint) {
    super(message);
    this.code = code; this.hint = hint;
  }
}

/* ===================================================================

const TAX_DEPRECIATION = {

function inWindow(r, date) {
  return date >= r.from && (!r.to || date <= r.to);
}
/** ★ lookup ด้วยวันที่ของเอกสารเสมอ ไม่ใช่วันที่ปัจจุบัน */
function resolveRate(code, date, cond) {
  cond = cond || {};
  const candidates = TAX_RATES.filter(function (r) {
    if (r.code !== code || !inWindow(r, date)) return false;
    return Object.keys(r.cond).every(function (k) { return cond[k] === r.cond[k]; });
  });
  if (!candidates.length) {
    throw new DomainError('TAX_RATE_NOT_FOUND',
      'ไม่พบอัตราภาษีที่มีผลบังคับ ณ วันที่ ' + thDate(date) + ' สำหรับรหัส ' + code,
      'ตรวจสอบตารางอัตราภาษี อาจมีประกาศใหม่ที่ยังไม่ได้บันทึกเข้าระบบ');
  }
  candidates.sort((a, b) => Object.keys(b.cond).length - Object.keys(a.cond).length);
  return candidates[0];
}
function ssoRate(date) {
  const r = SSO_RATES.find((x) => inWindow(x, date));
  if (!r) throw new DomainError('SSO_RATE_NOT_FOUND', 'ไม่พบอัตราประกันสังคมที่มีผล ณ ' + thDate(date));
  return r;
}

/* ===================================================================
   ผังบัญชี
   =================================================================== */
function acc(code) {
  const a = DB.accounts.find((x) => x.code === code);
  if (!a) throw new DomainError('ACCOUNT_NOT_FOUND', 'ไม่พบบัญชีรหัส ' + code);
  return a;
}
function accBySub(subType) {
  const a = DB.accounts.find((x) => x.subType === subType && x.postable);
  if (!a) {
    throw new DomainError('ACCOUNT_MAPPING_MISSING',
      'ยังไม่ได้ผูกบัญชีสำหรับประเภท "' + subType + '" ในผังบัญชี',
      'เพิ่มบัญชีที่มี sub_type นี้ในผังบัญชีก่อน');
  }
  return a.code;
}

/* ===================================================================
   งวดบัญชี
   =================================================================== */
function periodFor(date) {
  const p = DB.periods.find((x) => date >= x.start && date <= x.end);
  if (!p) {
    throw new DomainError('PERIOD_NOT_FOUND',
      'ยังไม่ได้สร้างงวดบัญชีที่ครอบคลุมวันที่ ' + thDate(date),
      'สร้างรอบบัญชีในหน้าตั้งค่าก่อน');
  }
  return p;
}

/* ===================================================================
   เลขที่เอกสาร — จองตอนลงบัญชีเท่านั้น
   =================================================================== */
const SEQ_PREFIX = {
  invoice:'INV', receipt:'RC', creditNote:'CN', quotation:'QT', salesOrder:'SO',
  purchaseOrder:'PO', bill:'AP', payment:'PV', whtCert:'WT', stockCount:'SC',
  je_sales:'SA', je_purchase:'PU', je_receipt:'RV', je_payment:'PY',
  je_general:'JV', je_adjustment:'JV', je_payroll:'PR', je_asset:'AS',
  je_inventory:'IV', je_opening:'OB', je_closing:'CL',
};
function nextNo(docType, date) {
  const p = periodOf(date).replace('-', '').slice(2);   // 2026-07 → 2607
  const key = docType + '|' + periodOf(date);
  DB.seq[key] = (DB.seq[key] || 0) + 1;
  const prefix = SEQ_PREFIX[docType] || docType.toUpperCase().slice(0, 3);
  return prefix + p + '-' + String(DB.seq[key]).padStart(5, '0');
}

/* ===================================================================
   ★ ประตูเดียวที่เขียนลงบัญชีแยกประเภท
   =================================================================== */
function post(req) {
  const lines = req.lines.filter((l) => (l.dr || 0) !== 0 || (l.cr || 0) !== 0);
  if (lines.length < 2) {
    throw new DomainError('ENTRY_TOO_FEW_LINES', 'รายการบัญชีต้องมีอย่างน้อย 2 บรรทัด');
  }
  const dr = lines.reduce((s, l) => s + (l.dr || 0), 0);
  const cr = lines.reduce((s, l) => s + (l.cr || 0), 0);
  if (dr !== cr) {
    throw new DomainError('ENTRY_UNBALANCED',
      'รายการไม่สมดุล เดบิตรวม ' + fmt(dr) + ' ไม่เท่ากับเครดิตรวม ' + fmt(cr),
      'ตรวจสอบบรรทัดรายการอีกครั้ง');
  }
  if (dr === 0) throw new DomainError('ENTRY_ZERO_AMOUNT', 'ลงบัญชีรายการที่ยอดรวมเป็นศูนย์ไม่ได้');

  const period = periodFor(req.date);
  if (period.status !== 'open') {
    throw new DomainError('PERIOD_CLOSED',
      'งวดบัญชี ' + thPeriod(period.code) + ' ปิดแล้ว ลงรายการไม่ได้',
      'เปลี่ยนวันที่เป็นงวดที่ยังเปิดอยู่ หรือเปิดงวดใหม่ในหน้าปิดงวด');
  }
  if (DB.settings.hardLockDate && req.date <= DB.settings.hardLockDate) {
    throw new DomainError('PERIOD_LOCKED_HARD',
      'วันที่ ' + thDate(req.date) + ' อยู่ก่อนวันล็อกข้อมูล ' + thDate(DB.settings.hardLockDate));
  }

  lines.forEach(function (l) {
    const a = acc(l.acc);
    if (!a.postable) {
      throw new DomainError('ACCOUNT_NOT_POSTABLE',
        'บัญชี ' + a.code + ' ' + a.name + ' เป็นบัญชีหัวข้อ ลงรายการไม่ได้', 'เลือกบัญชีย่อยแทน');
    }
    if (a.requiresPartner && !l.partner) {
      throw new DomainError('PARTNER_REQUIRED',
        'บัญชี ' + a.code + ' ' + a.name + ' ต้องระบุลูกหนี้หรือเจ้าหนี้');
    }
    if ((l.dr || 0) > 0 && (l.cr || 0) > 0) {
      throw new DomainError('LINE_BOTH_SIDES', 'บรรทัดเดียวมีทั้งเดบิตและเครดิตไม่ได้');
    }
  });

  const entry = {
    no: nextNo('je_' + req.type, req.date),
    date: req.date,
    type: req.type,
    desc: req.desc,
    src: req.src || null,
    srcId: req.srcId || null,
    status: 'posted',
    lines: lines.map((l, i) => ({
      n: i + 1, acc: l.acc, dr: l.dr || 0, cr: l.cr || 0,
      partner: l.partner || null, memo: l.memo || null,
    })),
    total: dr,
  };
  DB.entries.push(entry);
  audit('journal_entry', entry.no, 'post', null, { total: fmt(dr), desc: req.desc });
  return entry;
}

function reverse(entryNo, reason, date) {
  const e = DB.entries.find((x) => x.no === entryNo);
  if (!e) throw new DomainError('ENTRY_NOT_FOUND', 'ไม่พบรายการ ' + entryNo);
  if (e.status !== 'posted') {
    throw new DomainError('ALREADY_REVERSED', 'รายการ ' + entryNo + ' ถูกกลับรายการไปแล้ว');
  }
  if (!reason || reason.trim().length < 5) {
    throw new DomainError('REASON_REQUIRED',
      'การกลับรายการต้องระบุเหตุผล เพื่อให้ผู้สอบบัญชีตรวจสอบได้ภายหลัง');
  }
  const rev = post({
    type: 'adjustment',
    date: date || e.date,
    desc: 'กลับรายการ ' + e.no + ': ' + reason.trim(),
    src: 'reversal', srcId: e.no,
    lines: e.lines.map((l) => ({ acc: l.acc, dr: l.cr, cr: l.dr, partner: l.partner, memo: l.memo })),
  });
  e.status = 'reversed';
  e.reversedBy = rev.no;
  e.reason = reason.trim();
  audit('journal_entry', e.no, 'reverse', { status: 'posted' }, { status: 'reversed', by: rev.no }, reason);
  return rev;
}

function audit(entity, id, action, before, after, reason) {
  DB.audit.unshift({
    at: new Date().toISOString(),
    user: 'ผู้ใช้ตัวอย่าง',
    entity, id, action,
    before: before || null, after: after || null, reason: reason || null,
  });
  if (DB.audit.length > 500) DB.audit.length = 500;
}

/* ===================================================================
   ยอดคงเหลือและรายงาน
   =================================================================== */
const LIVE = (e) => e.status === 'posted' || e.status === 'reversed';

function balanceOf(codeOrFilter, upto, from, entryFilter) {
  let dr = 0, cr = 0;
  DB.entries.forEach(function (e) {
    if (!LIVE(e)) return;
    if (upto && e.date > upto) return;
    if (from && e.date < from) return;
    if (entryFilter && !entryFilter(e)) return;
    e.lines.forEach(function (l) {
      const ok = typeof codeOrFilter === 'function' ? codeOrFilter(acc(l.acc)) : l.acc === codeOrFilter;
      if (ok) { dr += l.dr; cr += l.cr; }
    });
  });
  return dr - cr;
}
const balBySub = (subTypes, upto, from, entryFilter) =>
  balanceOf((a) => subTypes.indexOf(a.subType) >= 0, upto, from, entryFilter);

function trialBalance(from, to) {
  const rows = [];
  DB.accounts.filter((a) => a.postable).forEach(function (a) {
    let od = 0, dr = 0, cr = 0;
    DB.entries.forEach(function (e) {
      if (!LIVE(e)) return;
      e.lines.forEach(function (l) {
        if (l.acc !== a.code) return;
        if (e.date < from) od += l.dr - l.cr;
        else if (e.date <= to) { dr += l.dr; cr += l.cr; }
      });
    });
    if (od || dr || cr) rows.push({ code:a.code, name:a.name, sub:a.subType, opening:od, dr, cr, closing:od + dr - cr });
  });
  const td = rows.reduce((s, r) => s + r.dr, 0);
  const tc = rows.reduce((s, r) => s + r.cr, 0);
  return { rows, totalDr: td, totalCr: tc, balanced: td === tc };
}

/* โครงงบการเงิน — อ้าง subType ไม่ใช่รหัสบัญชี */
const BS_LINES = [
  { k:'h',  label:'สินทรัพย์' },
  { k:'h2', label:'สินทรัพย์หมุนเวียน' },

function balanceSheet(asOf) {
  const out = [];
  let running = 0, assetTotal = 0, leTotal = 0, leSub = 0, liabTotal = 0;
  BS_LINES.forEach(function (L) {
    if (L.k === 'd') {
      let v = balBySub(L.sub, asOf) * L.sign;
      if (L.plNet) {
        // กำไรของงวดที่ยังไม่ปิดบัญชีต้องเข้าส่วนของผู้ถือหุ้น ไม่งั้นงบไม่สมดุล
        v += balanceOf((a) => a.type === 'revenue' || a.type === 'expense', asOf) * L.sign;
      }
      running += v;
      out.push({ ...L, value: v });
    } else if (L.k === 's') {
      // ★ "รวมหนี้สิน" ไม่ใช่ผลรวมของบรรทัดที่ค้างอยู่ แต่เป็นผลรวมของยอดรวมย่อยก่อนหน้า
      if (L.section === 'le_sub') { liabTotal = leSub; out.push({ ...L, value: leSub }); return; }
      out.push({ ...L, value: running });
      if (L.section === 'asset') assetTotal += running;
      if (L.section === 'le') { leTotal += running; leSub += running; }
      running = 0;
    } else if (L.k === 't') {
      const v = L.section === 'asset_total' ? assetTotal : leTotal;
      out.push({ ...L, value: v });
    } else {
      out.push({ ...L });
    }
  });
  return { lines: out, assets: assetTotal, liabEquity: leTotal, diff: assetTotal - leTotal,
    liabilities: liabTotal, equity: leTotal - liabTotal };
}

function incomeStatement(from, to) {
  const vals = {};
  const out = [];
  PL_LINES.forEach(function (L) {
    if (L.k === 'd') {
      const v = balBySub(L.sub, to, from) * L.sign;
      vals[L.label] = v;
      out.push({ ...L, value: v });
    } else out.push({ ...L });
  });
  const rev   = vals['รายได้จากการขายและบริการ'] || 0;
  const cogs  = vals['ต้นทุนขายและต้นทุนบริการ'] || 0;
  const other = vals['รายได้อื่น'] || 0;
  const sell  = vals['ค่าใช้จ่ายในการขาย'] || 0;
  const admin = vals['ค่าใช้จ่ายในการบริหาร'] || 0;
  const fin   = vals['ต้นทุนทางการเงิน'] || 0;
  const tax   = vals['ภาษีเงินได้นิติบุคคล'] || 0;
  const gross = rev - cogs, ebit = gross + other - sell - admin, ebt = ebit - fin, net = ebt - tax;
  const calc = { gross, ebit, ebt, net };
  out.forEach(function (L) { if (L.calc) L.value = calc[L.calc]; });
  return { lines: out, revenue: rev, gross, ebit, ebt, net };
}

/**
 * งบกระแสเงินสด — จำแนกจากบัญชีคู่ของทุกรายการที่กระทบเงินสดจริง
 * วิธีนี้ทำให้ ต้นงวด + ดำเนินงาน + ลงทุน + จัดหาเงิน = ปลายงวด เสมอ
 * ไม่มีทางเหลือส่วนที่อธิบายไม่ได้
 */
const CASH_SUB = ['cash','bank','cash_in_transit'];
const INVESTING_SUB = ['ppe','ppe_land','cip','intangible','long_term_investment','accum_depreciation','accum_amortization'];
const FINANCING_SUB = ['long_term_loan','paid_up_capital','legal_reserve','dividend','share_premium'];

function cashFlow(from, to) {
  const isCash = (code) => CASH_SUB.indexOf(acc(code).subType) >= 0;
  const opening = balBySub(CASH_SUB, addDays(from, -1));
  const closing = balBySub(CASH_SUB, to);
  const buckets = { operating: 0, investing: 0, financing: 0 };
  const detail = { operating: {}, investing: {}, financing: {} };

  DB.entries.forEach(function (e) {
    if (!LIVE(e) || e.date < from || e.date > to) return;
    const cashLines = e.lines.filter((l) => isCash(l.acc));
    if (!cashLines.length) return;
    const delta = cashLines.reduce((s, l) => s + l.dr - l.cr, 0);
    if (delta === 0) return;

    const others = e.lines.filter((l) => !isCash(l.acc));
    const subs = others.map((l) => acc(l.acc).subType);
    const bucket = subs.some((x) => INVESTING_SUB.indexOf(x) >= 0) ? 'investing'
                 : subs.some((x) => FINANCING_SUB.indexOf(x) >= 0) ? 'financing'
                 : 'operating';
    buckets[bucket] += delta;

    // แยกรายละเอียดตามบัญชีคู่ เพื่อให้คลิกดูที่มาได้
    const total = others.reduce((s, l) => s + Math.abs(l.dr - l.cr), 0) || 1;
    others.forEach(function (l) {
      const a = acc(l.acc);
      const share = divRound(delta * Math.abs(l.dr - l.cr), total);
      detail[bucket][a.name] = (detail[bucket][a.name] || 0) + share;
    });
  });

  const net = buckets.operating + buckets.investing + buckets.financing;
  return {
    opening, closing, net,
    operating: buckets.operating, investing: buckets.investing, financing: buckets.financing,
    detail,
    unexplained: (opening + net) - closing,
  };
}

/* ---------- ยอดคงค้างของเอกสาร ณ วันที่ที่กำหนด ----------
   ★ ต้องคิดจากใบเสร็จ/ใบสำคัญจ่ายที่เกิดก่อนวันนั้น ไม่ใช่ยอดชำระสะสมล่าสุด
   ไม่งั้นรายงานย้อนหลังจะหักเงินที่รับหลังวันที่รายงานออกไปด้วย */
function settledUpto(kind, docNo, asOf) {
  if (kind === 'ar') {
    let v = 0;
    DB.docs.receipt.forEach((r) => { if (r.invoiceNo === docNo && r.date <= asOf) v += r.gross; });
    DB.docs.creditNote.forEach((c) => { if (c.invoiceNo === docNo && c.date <= asOf) v += c.total; });
    return v;
  }
  let v = 0;
  DB.docs.payment.forEach((p) => { if (p.billNo === docNo && p.date <= asOf) v += p.gross; });
  return v;
}
/* bfPaid = ยอดที่ชำระไปแล้วก่อนวันตัดยอด ตอนย้ายข้อมูลเข้ามา
   ในระบบเราไม่มีใบเสร็จรองรับส่วนนั้น จึงต้องหักแยกจากใบเสร็จที่เกิดหลังย้าย
   ไม่งั้นถ้าใช้ d.paid ตรง ๆ จะถูกนับซ้ำเมื่อมีการรับชำระเพิ่มภายหลัง */
const outstandingAsOf = (kind, d, asOf) =>
  d.total - (d.bfPaid || 0) - settledUpto(kind, d.no, asOf);

/* ---------- อายุหนี้ ---------- */
function aging(kind, asOf) {
  const docs = kind === 'ar' ? DB.docs.invoice : DB.docs.bill;
  const map = {};
  docs.forEach(function (d) {
    if (d.status === 'draft' || d.status === 'void') return;
    if (d.date > asOf) return;
    const out = outstandingAsOf(kind, d, asOf);
    if (out <= 0) return;
    const days = Math.floor((new Date(asOf) - new Date(d.due)) / 86400000);
    const b = days <= 0 ? 'notDue' : days <= 30 ? 'b30' : days <= 60 ? 'b60' : days <= 90 ? 'b90' : 'over';
    const key = d.partnerCode;
    if (!map[key]) map[key] = { name: d.partnerName, notDue:0, b30:0, b60:0, b90:0, over:0, total:0 };
    map[key][b] += out;
    map[key].total += out;
  });
  const rows = Object.keys(map).map((k) => ({ code:k, ...map[k] })).sort((a,b) => b.total - a.total);
  const sum = (f) => rows.reduce((s, r) => s + r[f], 0);
  return { rows, totals: { notDue:sum('notDue'), b30:sum('b30'), b60:sum('b60'), b90:sum('b90'), over:sum('over'), total:sum('total') } };
}

/* ---------- ตรวจยอดคุม ---------- */
function reconciliationChecks(asOf) {
  const checks = [];
  const arControl = balBySub(['trade_receivable'], asOf);
  const arSub = DB.docs.invoice.filter((d) => d.status !== 'draft' && d.status !== 'void' && d.date <= asOf)
    .reduce((s, d) => s + outstandingAsOf('ar', d, asOf), 0);
  checks.push({ code:'AR_SUBLEDGER', label:'ลูกหนี้รายรายรวม = บัญชีคุมลูกหนี้', control:arControl, sub:arSub, ok:arControl === arSub });

  const apControl = -balBySub(['trade_payable'], asOf);
  const apSub = DB.docs.bill.filter((d) => d.status !== 'draft' && d.status !== 'void' && d.date <= asOf)
    .reduce((s, d) => s + outstandingAsOf('ap', d, asOf), 0);
  checks.push({ code:'AP_SUBLEDGER', label:'เจ้าหนี้รายรายรวม = บัญชีคุมเจ้าหนี้', control:apControl, sub:apSub, ok:apControl === apSub });

  const glDiff = balanceOf(() => true, asOf);
  checks.push({ code:'GL_BALANCED', label:'เดบิตรวม = เครดิตรวม ทั้งฐานข้อมูล', control:glDiff, sub:0, ok:glDiff === 0 });

  // ★ เทียบเฉพาะรายการที่มาจากเอกสารของงวดนี้จริง ๆ
  //   - ไม่รวมใบสำคัญปิดภาษีสิ้นเดือน ไม่งั้นหลังยื่นแบบบัญชีจะถูกเคลียร์เป็นศูนย์ แล้วการเทียบไม่มีความหมาย
  //   - ไม่รวมยอดยกมาจากระบบเดิม เพราะเป็นยอดสะสมก่อนเริ่มใช้ระบบ ไม่มีเอกสารในทะเบียนภาษีรองรับ
  const period = periodOf(asOf);
  const start = period + '-01', end = endOfMonth(start);
  const notFiling = (e) => e.src !== 'filing' && e.type !== 'opening';

  const vatOutReport = DB.taxTx.filter((t) => t.kind === 'vat_output' && t.period === period)
    .reduce((s, t) => s + t.tax, 0);
  const vatOutGl = -balBySub(['output_vat'], end, start, notFiling);
  checks.push({ code:'OUTPUT_VAT', label:'ภาษีขายในทะเบียน = ที่ลงบัญชีจากเอกสาร (งวดนี้)',
    control:vatOutGl, sub:vatOutReport, ok:vatOutGl === vatOutReport });

  const vatInReport = DB.taxTx.filter((t) => t.kind === 'vat_input' && t.period === period)
    .reduce((s, t) => s + t.tax, 0);
  const vatInGl = balBySub(['input_vat'], end, start, notFiling);
  checks.push({ code:'INPUT_VAT', label:'ภาษีซื้อในทะเบียน = ที่ลงบัญชีจากเอกสาร (งวดนี้)',
    control:vatInGl, sub:vatInReport, ok:vatInGl === vatInReport });

  const suspense = balBySub(['suspense'], asOf);
  checks.push({ code:'SUSPENSE_ZERO', label:'บัญชีพักต้องเป็นศูนย์ก่อนปิดงวด', control:suspense, sub:0, ok:suspense === 0 });

  const bs = balanceSheet(asOf);
  checks.push({ code:'BS_BALANCED', label:'รวมสินทรัพย์ = รวมหนี้สินและส่วนของผู้ถือหุ้น', control:bs.assets, sub:bs.liabEquity, ok:bs.diff === 0 });

  return { checks, allPassed: checks.every((c) => c.ok) };
}


/* ===== operations.js ===== */
/* ===================================================================
   ธุรกรรมทางธุรกิจ — ทุกตัวจบใน "หนึ่งชุด" เหมือน transaction เดียว
   ถ้าขั้นตอนใดล้มเหลว ต้องไม่มีอะไรค้างครึ่ง ๆ กลาง ๆ
   =================================================================== */

function partnerByCode(code) {
  const p = DB.partners.find((x) => x.code === code);
  if (!p) throw new DomainError('PARTNER_NOT_FOUND', 'ไม่พบคู่ค้ารหัส ' + code);
  return p;
}

function snapshotPartner(p) {
  return {
    code: p.code, name: p.name, taxId: p.taxId, branch: p.branch,
    entityType: p.entityType, address: p.address, capturedAt: new Date().toISOString(),
  };
}

/* ---------- คำนวณ VAT ระดับเอกสาร (ปัดเศษครั้งเดียว) ---------- */
function computeVat(lines, date) {
  let std = 0, zero = 0, exempt = 0, rateUsed = '0';
  lines.forEach(function (l) {
    const amt = round2(mulQty(M(l.price), l.qty));
    const code = l.taxCode || 'VAT7';
    if (code === 'VAT7') { std += amt; rateUsed = resolveRate('VAT7', date).rate; }
    else if (code === 'VAT0') zero += amt;
    else exempt += amt;
  });
  const vat = round2(pct(std, rateUsed));
  return { std, zero, exempt, vat, total: std + zero + exempt + vat, rate: rateUsed };
}

/* ---------- ตรวจตาม ม.86/4 ก่อนออกเลข ---------- */
function assertTaxInvoiceComplete(snap, lines) {
  const missing = [];
  if (!snap.name) missing.push('ชื่อผู้ซื้อ');
  if (!snap.address) missing.push('ที่อยู่ผู้ซื้อ');
  if (!snap.branch) missing.push('สำนักงานใหญ่หรือสาขาของผู้ซื้อ');
  if (!snap.taxId) missing.push('เลขประจำตัวผู้เสียภาษีของผู้ซื้อ');
  else if (!validTaxId(snap.taxId)) {
    throw new DomainError('TAX_ID_INVALID',
      'เลขประจำตัวผู้เสียภาษีของผู้ซื้อ (' + snap.taxId + ') ไม่ผ่านการตรวจสอบหลักที่ 13',
      'ตรวจสอบเลขกับหนังสือรับรองของลูกค้า');
  }
  if (!lines.length) missing.push('รายการสินค้าหรือบริการ');
  lines.forEach(function (l, i) {
    if (!String(l.desc || '').trim()) missing.push('คำบรรยายบรรทัดที่ ' + (i + 1));
  });
  if (missing.length) {
    throw new DomainError('TAX_INVOICE_INCOMPLETE',
      'ออกใบกำกับภาษีไม่ได้เพราะข้อมูลไม่ครบตามมาตรา 86/4: ' + missing.join(', '),
      'แก้ไขข้อมูลให้ครบแล้วลองใหม่');
  }
}

/* ---------- ขาย: ออกใบกำกับภาษี ---------- */
function issueInvoice(input) {
  const p = partnerByCode(input.partnerCode);
  const snap = snapshotPartner(p);
  const lines = input.lines.filter((l) => String(l.desc || '').trim() && M(l.price) !== 0);
  assertTaxInvoiceComplete(snap, lines);

  const v = computeVat(lines, input.date);
  const no = nextNo('invoice', input.date);
  const due = addDays(input.date, p.termDays || 0);

  const revLines = {};
  lines.forEach(function (l) {
    const a = accBySub(l.revenueSub || 'sales_revenue');
    revLines[a] = (revLines[a] || 0) + round2(mulQty(M(l.price), l.qty));
  });

  const je = post({
    type: 'sales', date: input.date,
    desc: 'ขายสินค้า/บริการ ' + snap.name + ' (' + no + ')',
    src: 'invoice', srcId: no,
    lines: [
      { acc: accBySub('trade_receivable'), dr: v.total, partner: p.code },
    ].concat(Object.keys(revLines).map((a) => ({ acc: a, cr: revLines[a] })))
     .concat(v.vat ? [{ acc: accBySub('output_vat'), cr: v.vat }] : []),
  });

  // ตัดต้นทุนขายถ้าเป็นสินค้า
  let cogs = 0;
  lines.forEach(function (l) {
    if (!l.itemCode) return;
    const it = DB.items.find((x) => x.code === l.itemCode);
    if (!it || it.type !== 'stock') return;
    const c = round2(mulQty(it.avgCost, l.qty));
    cogs += c;
    it.qty -= Number(l.qty);
    it.value -= c;
    DB.docs.stockMove.push({ date: input.date, item: it.code, dir: 'out', qty: Number(l.qty), cost: c, src: no, balance: it.qty });
  });
  let cogsJe = null;
  if (cogs > 0) {
    cogsJe = post({
      type: 'inventory', date: input.date, desc: 'ตัดต้นทุนขาย ' + no,
      src: 'invoice', srcId: no,
      lines: [{ acc: accBySub('cogs'), dr: cogs }, { acc: accBySub('inventory'), cr: cogs }],
    });
  }

  DB.taxTx.push({
    kind: 'vat_output', period: periodOf(input.date), date: input.date,
    docNo: no, docType: 'tax_invoice',
    partnerName: snap.name, taxId: snap.taxId, branch: snap.branch,
    base: v.std, zero: v.zero, exempt: v.exempt, tax: v.vat,
    entryNo: je.no, filingId: null,
  });

  const doc = {
    no, date: input.date, due, partnerCode: p.code, partnerName: snap.name,
    snap, lines: lines.map((l) => ({
      desc: l.desc, qty: Number(l.qty), price: M(l.price), uom: l.uom || '',
      taxCode: l.taxCode || 'VAT7', itemCode: l.itemCode || null,
      amount: round2(mulQty(M(l.price), l.qty)),
    })),
    base: v.std + v.zero + v.exempt, vat: v.vat, total: v.total,
    paid: 0, credited: 0, status: 'issued',
    entryNo: je.no, cogsEntryNo: cogsJe ? cogsJe.no : null,
    etax: 'accepted',
  };
  DB.docs.invoice.unshift(doc);
  audit('invoice', no, 'issue', null, { total: fmt(v.total), partner: snap.name });
  return doc;
}

/* ---------- ขาย: รับชำระเงิน ---------- */
function receivePayment(input) {
  const inv = DB.docs.invoice.find((d) => d.no === input.invoiceNo);
  if (!inv) throw new DomainError('INVOICE_NOT_FOUND', 'ไม่พบใบกำกับภาษี ' + input.invoiceNo);
  const outstanding = inv.total - inv.paid - inv.credited;
  if (outstanding <= 0) throw new DomainError('ALREADY_PAID', 'ใบกำกับภาษีนี้ชำระครบแล้ว');

  const gross = input.amount ? M(input.amount) : outstanding;
  if (gross > outstanding) {
    throw new DomainError('OVER_PAYMENT',
      'ยอดรับชำระ ' + fmt(gross) + ' เกินยอดคงค้าง ' + fmt(outstanding),
      'ถ้าลูกค้าจ่ายเกิน ให้บันทึกส่วนเกินเป็นเงินรับล่วงหน้าแทน');
  }
  // ภาษีที่ลูกค้าหักไว้ คำนวณจากฐานก่อน VAT ตามสัดส่วนที่รับชำระ
  let wht = 0, whtRate = null;
  if (input.whtCode) {
    const r = resolveRate(input.whtCode, input.date, { channel: 'manual' });
    const ratio = gross / inv.total;
    wht = round2(pct(round2(inv.base * ratio), r.rate));
    whtRate = r.rate;
  }
  const net = gross - wht;
  const no = nextNo('receipt', input.date);
  const bankAcc = input.bankAccount || accBySub('bank');

  const je = post({
    type: 'receipt', date: input.date,
    desc: 'รับชำระจาก ' + inv.partnerName + ' (' + inv.no + ')',
    src: 'receipt', srcId: no,
    lines: [
      { acc: bankAcc, dr: net },
    ].concat(wht ? [{ acc: accBySub('wht_asset'), dr: wht }] : [])
     .concat([{ acc: accBySub('trade_receivable'), cr: gross, partner: inv.partnerCode }]),
  });

  inv.paid += gross;
  if (inv.paid + inv.credited >= inv.total) inv.status = 'paid';
  else inv.status = 'partially_paid';

  const doc = {
    no, date: input.date, invoiceNo: inv.no, partnerCode: inv.partnerCode,
    partnerName: inv.partnerName, method: input.method || 'transfer',
    gross, wht, whtRate, net, entryNo: je.no, whtCertReceived: !!input.whtCode,
  };
  DB.docs.receipt.unshift(doc);
  audit('receipt', no, 'create', null, { invoice: inv.no, net: fmt(net) });
  return doc;
}

/* ---------- ขาย: ใบลดหนี้ ---------- */
const CN_REASONS = {
  RETURN_DEFECT: 'รับคืนสินค้าชำรุด บกพร่อง ไม่ตรงตามที่ตกลง',
  RETURN_SHORT: 'ส่งมอบสินค้าขาดจำนวน',
  PRICE_REDUCE: 'ลดราคาสินค้าหรือค่าบริการหลังออกใบกำกับ',
  SERVICE_INCOMPLETE: 'ให้บริการไม่ครบตามที่ตกลง',
  CANCEL_CONTRACT: 'บอกเลิกสัญญาหรือคืนสินค้า',
  CALC_ERROR: 'คำนวณราคาสูงกว่าที่เป็นจริง',
};
function issueCreditNote(input) {
  const inv = DB.docs.invoice.find((d) => d.no === input.invoiceNo);
  if (!inv) {
    throw new DomainError('CREDIT_NOTE_NO_ORIGIN',
      'ใบลดหนี้ต้องอ้างอิงใบกำกับภาษีเดิมเสมอ (มาตรา 86/10)',
      'เลือกใบกำกับภาษีที่ต้องการลดหนี้');
  }
  if (!CN_REASONS[input.reason]) {
    throw new DomainError('CREDIT_NOTE_REASON_INVALID',
      'เหตุผลไม่อยู่ในเหตุที่กฎหมายกำหนดตามมาตรา 86/10');
  }
  const base = M(input.base);
  const remaining = inv.base - inv.credited;
  if (base > remaining) {
    throw new DomainError('CREDIT_NOTE_EXCEEDS',
      'มูลค่าใบลดหนี้ ' + fmt(base) + ' เกินมูลค่าคงเหลือของใบกำกับเดิม ' + fmt(remaining));
  }
  const r = resolveRate('VAT7', input.date);
  const vat = round2(pct(base, r.rate));
  const total = base + vat;
  const no = nextNo('creditNote', input.date);

  const je = post({
    type: 'sales', date: input.date,
    desc: 'ใบลดหนี้ ' + no + ' อ้าง ' + inv.no + ' — ' + CN_REASONS[input.reason],
    src: 'creditNote', srcId: no,
    lines: [
      { acc: accBySub('sales_return'), dr: base },
      { acc: accBySub('output_vat'), dr: vat },
      { acc: accBySub('trade_receivable'), cr: total, partner: inv.partnerCode },
    ],
  });

  DB.taxTx.push({
    kind: 'vat_output', period: periodOf(input.date), date: input.date,
    docNo: no, docType: 'credit_note', refDoc: inv.no,
    partnerName: inv.partnerName, taxId: inv.snap.taxId, branch: inv.snap.branch,
    base: -base, zero: 0, exempt: 0, tax: -vat, entryNo: je.no, filingId: null,
  });

  inv.credited += total;
  if (inv.paid + inv.credited >= inv.total) inv.status = 'paid';

  const doc = { no, date: input.date, invoiceNo: inv.no, partnerCode: inv.partnerCode,
    partnerName: inv.partnerName, reason: input.reason, reasonText: CN_REASONS[input.reason],
    base, vat, total, entryNo: je.no };
  DB.docs.creditNote.unshift(doc);
  audit('creditNote', no, 'issue', null, { ref: inv.no, total: fmt(total), reason: CN_REASONS[input.reason] });
  return doc;
}

/* ---------- ซื้อ: ตั้งหนี้ผู้ขาย ---------- */
function recordBill(input) {
  const p = partnerByCode(input.partnerCode);
  const dup = DB.docs.bill.find((b) => b.partnerCode === p.code && b.vendorNo === input.vendorNo && b.status !== 'void');
  if (dup) {
    throw new DomainError('DUPLICATE_VENDOR_INVOICE',
      'บันทึกใบกำกับภาษีซื้อเลขที่ ' + input.vendorNo + ' ของผู้ขายรายนี้ไปแล้ว (' + dup.no + ')',
      'ตรวจสอบรายการเดิม หรือแก้เลขที่ใบกำกับให้ถูกต้อง');
  }
  const lines = input.lines.filter((l) => String(l.desc || '').trim() && M(l.price) !== 0);
  if (!lines.length) throw new DomainError('NO_LINES', 'ต้องมีรายการอย่างน้อย 1 บรรทัด');

  const v = computeVat(lines, input.date);
  const no = nextNo('bill', input.date);
  const claimable = !input.nonClaimableVat;

  const expLines = {};
  lines.forEach(function (l) {
    const a = accBySub(l.expenseSub || 'admin_expense');
    expLines[a] = (expLines[a] || 0) + round2(mulQty(M(l.price), l.qty));
  });
  // ภาษีซื้อต้องห้ามเข้าเป็นค่าใช้จ่าย ไม่ใช่สินทรัพย์ภาษี
  if (!claimable && v.vat) {
    const a = accBySub('non_claimable_vat_expense');
    expLines[a] = (expLines[a] || 0) + v.vat;
  }

  const je = post({
    type: 'purchase', date: input.date,
    desc: 'ตั้งหนี้ ' + p.name + ' (' + input.vendorNo + ')',
    src: 'bill', srcId: no,
    lines: Object.keys(expLines).map((a) => ({ acc: a, dr: expLines[a] }))
      .concat(claimable && v.vat ? [{ acc: accBySub('input_vat'), dr: v.vat }] : [])
      .concat([{ acc: accBySub('trade_payable'), cr: v.total, partner: p.code }]),
  });

  lines.forEach(function (l) {
    if (!l.itemCode) return;
    const it = DB.items.find((x) => x.code === l.itemCode);
    if (!it || it.type !== 'stock') return;
    const c = round2(mulQty(M(l.price), l.qty));
    it.qty += Number(l.qty);
    it.value += c;
    it.avgCost = it.qty > 0 ? divRound(it.value, it.qty) : 0;
    DB.docs.stockMove.push({ date: input.date, item: it.code, dir: 'in', qty: Number(l.qty), cost: c, src: no, balance: it.qty });
  });

  DB.taxTx.push({
    kind: 'vat_input', period: periodOf(input.date), date: input.date,
    docNo: input.vendorNo, docType: 'tax_invoice',
    partnerName: p.name, taxId: p.taxId, branch: p.branch,
    base: v.std, zero: v.zero, exempt: v.exempt, tax: claimable ? v.vat : 0,
    nonClaimable: claimable ? 0 : v.vat,
    entryNo: je.no, filingId: null,
  });

  const doc = {
    no, date: input.date, due: addDays(input.date, p.termDays || 0),
    vendorNo: input.vendorNo, partnerCode: p.code, partnerName: p.name,
    lines: lines.map((l) => ({ desc: l.desc, qty: Number(l.qty), price: M(l.price),
      amount: round2(mulQty(M(l.price), l.qty)), itemCode: l.itemCode || null })),
    base: v.std + v.zero + v.exempt, vat: v.vat, total: v.total,
    claimable, paid: 0, status: 'issued', entryNo: je.no,
    whtCode: input.whtCode || null,
  };
  DB.docs.bill.unshift(doc);
  audit('bill', no, 'create', null, { vendor: p.name, total: fmt(v.total) });
  return doc;
}

/* ---------- ซื้อ: จ่ายชำระพร้อมหักภาษี ณ ที่จ่าย ---------- */
function payBill(input) {
  const bill = DB.docs.bill.find((b) => b.no === input.billNo);
  if (!bill) throw new DomainError('BILL_NOT_FOUND', 'ไม่พบรายการตั้งหนี้ ' + input.billNo);
  const outstanding = bill.total - bill.paid;
  if (outstanding <= 0) throw new DomainError('ALREADY_PAID', 'รายการนี้จ่ายครบแล้ว');

  const p = partnerByCode(bill.partnerCode);
  const gross = input.amount ? M(input.amount) : outstanding;
  if (gross > outstanding) {
    throw new DomainError('OVER_PAYMENT', 'ยอดจ่าย ' + fmt(gross) + ' เกินยอดคงค้าง ' + fmt(outstanding));
  }
  const channel = input.channel || 'manual';
  let wht = 0, whtRate = null, whtCode = input.whtCode || bill.whtCode;
  const baseForWht = round2(bill.base * (gross / bill.total));

  if (whtCode && baseForWht >= M('1000')) {
    const r = resolveRate(whtCode, input.date, { channel });
    wht = round2(pct(baseForWht, r.rate));
    whtRate = r.rate;
  }
  const net = gross - wht;
  const no = nextNo('payment', input.date);
  const whtAccount = p.entityType === 'individual' ? 'wht_payable_pnd3' : 'wht_payable_pnd53';

  const je = post({
    type: 'payment', date: input.date,
    desc: 'จ่ายชำระ ' + p.name + ' (' + bill.no + ')',
    src: 'payment', srcId: no,
    lines: [{ acc: accBySub('trade_payable'), dr: gross, partner: p.code }]
      .concat(wht ? [{ acc: accBySub(whtAccount), cr: wht }] : [])
      .concat([{ acc: input.bankAccount || accBySub('bank'), cr: net }]),
  });

  bill.paid += gross;
  bill.status = bill.paid >= bill.total ? 'paid' : 'partially_paid';

  let certNo = null;
  if (wht > 0) {
    // ★ e-WHT: ธนาคารนำส่งและออกหลักฐานให้ ไม่ต้องออก 50 ทวิ เอง
    //   และต้องกันออกจากแบบ ภ.ง.ด.3/53 ไม่งั้นนำส่งซ้ำ
    if (channel === 'manual') {
      certNo = nextNo('whtCert', input.date);
      DB.docs.whtCert.unshift({
        no: certNo, date: input.date, partnerCode: p.code, partnerName: p.name,
        taxId: p.taxId, form: p.entityType === 'individual' ? 'ภ.ง.ด.3' : 'ภ.ง.ด.53',
        incomeType: resolveRate(whtCode, input.date, { channel }).label,
        base: baseForWht, wht, rate: whtRate, sent: false, paymentNo: no,
      });
    }
    DB.taxTx.push({
      kind: 'wht', period: periodOf(input.date), date: input.date,
      docNo: no, docType: 'payment',
      partnerName: p.name, taxId: p.taxId, branch: p.branch,
      entityType: p.entityType,
      base: baseForWht, tax: wht, rate: whtRate, channel,
      incomeType: resolveRate(whtCode, input.date, { channel }).label,
      form: p.entityType === 'individual' ? 'PND3' : 'PND53',
      certNo, entryNo: je.no, filingId: null,
    });
  }

  const doc = { no, date: input.date, billNo: bill.no, partnerCode: p.code, partnerName: p.name,
    gross, wht, whtRate, net, channel, certNo, entryNo: je.no,
    method: input.method || 'transfer' };
  DB.docs.payment.unshift(doc);
  audit('payment', no, 'create', null, { bill: bill.no, net: fmt(net), channel });
  return doc;
}

/* ---------- ค่าเสื่อมราคาประจำงวด ---------- */
function runDepreciation(period) {
  const already = DB.docs.depreciation.find((d) => d.period === period);
  if (already) {
    throw new DomainError('DEPRECIATION_ALREADY_RUN',
      'ตั้งค่าเสื่อมราคางวด ' + thPeriod(period) + ' ไปแล้ว (' + already.entryNo + ')',
      'กลับรายการเดิมก่อนถ้าต้องการคำนวณใหม่');
  }
  const endDate = endOfMonth(period + '-01');
  let bookTotal = 0, taxTotal = 0;
  const rows = [];

  DB.assets.forEach(function (a) {
    if (a.class === 'LAND' || a.status !== 'in_use') return;
    if (a.inService > endDate) return;
    const bookRemaining = a.cost - a.accumBook;
    if (bookRemaining <= 0) return;
    const bookMonthly = Math.min(divRound(divRound(a.cost, a.bookYears), 12), bookRemaining);

    const t = TAX_DEPRECIATION[a.class];
    const taxBase = t.costCap ? Math.min(a.cost, t.costCap) : a.cost;
    const taxRemaining = taxBase - a.accumTax;
    const taxMonthly = Math.max(0, Math.min(divRound(pct(taxBase, t.rate), 12), taxRemaining));

    a.accumBook += bookMonthly;
    a.accumTax += taxMonthly;
    bookTotal += bookMonthly;
    taxTotal += taxMonthly;
    rows.push({ code: a.code, name: a.name, class: a.class, cost: a.cost,
      book: bookMonthly, tax: taxMonthly, diff: bookMonthly - taxMonthly,
      nbvBook: a.cost - a.accumBook, nbvTax: taxBase - a.accumTax });
  });

  if (bookTotal === 0) {
    throw new DomainError('NO_DEPRECIABLE_ASSETS', 'ไม่มีทรัพย์สินที่ต้องคิดค่าเสื่อมในงวดนี้');
  }
  const je = post({
    type: 'asset', date: endDate, desc: 'ค่าเสื่อมราคาประจำงวด ' + thPeriod(period),
    src: 'depreciation', srcId: period,
    lines: [
      { acc: accBySub('depreciation'), dr: bookTotal },
      { acc: accBySub('accum_depreciation'), cr: bookTotal },
    ],
  });
  const run = { period, date: endDate, bookTotal, taxTotal, diff: bookTotal - taxTotal, rows, entryNo: je.no };
  DB.docs.depreciation.unshift(run);
  audit('depreciation', period, 'run', null, { book: fmt(bookTotal), tax: fmt(taxTotal) });
  return run;
}

/* ---------- เงินเดือน ---------- */
function computePit(annualIncome, deductions) {
  const expense = Math.min(pct(annualIncome, 50), M('100000'));
  const net = Math.max(0, annualIncome - expense - deductions);
  let tax = 0;
  PIT_BRACKETS.forEach(function (b) {
    if (net <= b.lo) return;
    const top = b.hi === null ? net : Math.min(net, b.hi);
    tax += pct(top - b.lo, b.rate);
  });
  return { expense, net, tax: round2(tax) };
}

function runPayroll(period) {
  const already = DB.docs.payRun.find((r) => r.period === period);
  if (already) {
    throw new DomainError('PAYROLL_ALREADY_RUN',
      'ทำเงินเดือนงวด ' + thPeriod(period) + ' ไปแล้ว (' + already.entryNo + ')');
  }
  const payDate = endOfMonth(period + '-01');
  const sso = ssoRate(payDate);
  const slips = [];
  let gross = 0, pit = 0, ssoEmp = 0, ssoEr = 0, pvdEmp = 0, pvdEr = 0, net = 0;

  DB.employees.filter((e) => e.active).forEach(function (e) {
    const salary = e.salary;
    const ot = e.otHours ? round2(mulQty(divRound(divRound(salary, 30), 8), e.otHours * 1.5)) : 0;
    const g = salary + ot;

    const wageBase = Math.min(Math.max(salary, sso.floor), sso.ceiling);
    const s = Math.min(round2(pct(wageBase, sso.pct)), sso.max);
    const pv = e.pvdRate ? round2(pct(salary, e.pvdRate)) : 0;

    const annual = salary * 12 + ot * 12;
    const ded = M('60000') + (e.deductions || 0) + Math.min(s * 12, sso.max * 12);
    const p = computePit(annual, ded);
    const monthlyPit = round2(divRound(p.tax, 12));

    const n = g - monthlyPit - s - pv;
    slips.push({ code: e.code, name: e.name, dept: e.dept, salary, ot, gross: g,
      pit: monthlyPit, sso: s, ssoBase: wageBase, pvd: pv, net: n });

    gross += g; pit += monthlyPit; ssoEmp += s; ssoEr += s; pvdEmp += pv;
    pvdEr += pv; net += n;
  });

  if (!slips.length) throw new DomainError('NO_EMPLOYEES', 'ไม่มีพนักงานที่ยังทำงานอยู่');

  const je = post({
    type: 'payroll', date: payDate, desc: 'เงินเดือนงวด ' + thPeriod(period),
    src: 'payroll', srcId: period,
    lines: [
      { acc: accBySub('admin_expense'), dr: gross, memo: 'เงินเดือนและค่าล่วงเวลา' },
      { acc: accBySub('sso_expense'), dr: ssoEr, memo: 'เงินสมทบประกันสังคมส่วนนายจ้าง' },
      { acc: accBySub('pvd_expense'), dr: pvdEr, memo: 'เงินสมทบกองทุนสำรองฯ ส่วนนายจ้าง' },
      { acc: accBySub('wht_payable_pnd1'), cr: pit },
      { acc: accBySub('sso_payable'), cr: ssoEmp + ssoEr },
      { acc: accBySub('pvd_payable'), cr: pvdEmp + pvdEr },
      { acc: accBySub('bank'), cr: net },
    ],
  });

  const run = { period, date: payDate, count: slips.length, gross, pit,
    ssoEmp, ssoEr, pvdEmp, pvdEr, net, slips, entryNo: je.no,
    ssoCeiling: sso.ceiling, ssoMax: sso.max };
  DB.docs.payRun.unshift(run);
  DB.taxTx.push({
    kind: 'wht', period, date: payDate, docNo: je.no, docType: 'payroll',
    partnerName: 'พนักงาน ' + slips.length + ' คน', taxId: null, branch: '00000',
    base: gross, tax: pit, rate: null, channel: 'manual',
    incomeType: 'เงินเดือน ม.40(1)', form: 'PND1', entryNo: je.no, filingId: null,
  });
  audit('payroll', period, 'run', null, { count: slips.length, net: fmt(net) });
  return run;
}

/* ---------- ปิดภาษีมูลค่าเพิ่มรายเดือน (ภ.พ.30) ---------- */
function fileVat(period) {
  const existing = DB.docs.filing.find((f) => f.form === 'PP30' && f.period === period);
  if (existing) {
    throw new DomainError('ALREADY_FILED',
      'ยื่น ภ.พ.30 งวด ' + thPeriod(period) + ' ไปแล้วเมื่อ ' + thDate(existing.filedDate));
  }
  const out = DB.taxTx.filter((t) => t.kind === 'vat_output' && t.period === period);
  const inn = DB.taxTx.filter((t) => t.kind === 'vat_input' && t.period === period);
  const outTax = out.reduce((s, t) => s + t.tax, 0);
  const inTax = inn.reduce((s, t) => s + t.tax, 0);
  const payable = outTax - inTax;
  const endDate = endOfMonth(period + '-01');

  const je = payable !== 0 ? post({
    type: 'adjustment', date: endDate,
    desc: 'ปิดภาษีมูลค่าเพิ่มงวด ' + thPeriod(period),
    src: 'filing', srcId: 'PP30|' + period,
    lines: payable > 0 ? [
      { acc: accBySub('output_vat'), dr: outTax },
      { acc: accBySub('input_vat'), cr: inTax },
      { acc: accBySub('vat_payable'), cr: payable },
    ] : [
      { acc: accBySub('output_vat'), dr: outTax },
      { acc: accBySub('vat_receivable'), dr: -payable },
      { acc: accBySub('input_vat'), cr: inTax },
    ],
  }) : null;

  const filing = {
    form: 'PP30', period, filedDate: endDate,
    dueDate: addDays(endOfMonth(period + '-01'), 15),
    outBase: out.reduce((s, t) => s + t.base, 0),
    outZero: out.reduce((s, t) => s + (t.zero || 0), 0),
    outTax, inBase: inn.reduce((s, t) => s + t.base, 0), inTax,
    payable, entryNo: je ? je.no : null, count: out.length + inn.length,
  };
  DB.docs.filing.unshift(filing);
  out.concat(inn).forEach((t) => { t.filingId = 'PP30|' + period; });
  audit('filing', 'PP30|' + period, 'file', null, { payable: fmt(payable) });
  return filing;
}

/* ---------- ยื่นภาษีหัก ณ ที่จ่าย ---------- */
function fileWht(period, form) {
  const key = form + '|' + period;
  if (DB.docs.filing.find((f) => f.form === form && f.period === period)) {
    throw new DomainError('ALREADY_FILED', 'ยื่น ' + form + ' งวด ' + thPeriod(period) + ' ไปแล้ว');
  }
  // ★ กันรายการที่ธนาคารนำส่งแทน (e-WHT) ออก ไม่งั้นนำส่งซ้ำ
  const rows = DB.taxTx.filter((t) => t.kind === 'wht' && t.period === period
    && t.form === form && t.channel === 'manual');
  if (!rows.length) {
    throw new DomainError('NOTHING_TO_FILE',
      'ไม่มีรายการที่ต้องยื่นใน ' + form + ' งวด ' + thPeriod(period),
      'รายการที่นำส่งผ่าน e-Withholding Tax ธนาคารนำส่งให้แล้ว ไม่ต้องยื่นซ้ำ');
  }
  const total = rows.reduce((s, t) => s + t.tax, 0);
  const endDate = endOfMonth(period + '-01');
  const acctSub = form === 'PND1' ? 'wht_payable_pnd1' : form === 'PND3' ? 'wht_payable_pnd3' : 'wht_payable_pnd53';

  const je = post({
    type: 'payment', date: addDays(endDate, 7),
    desc: 'นำส่งภาษีหัก ณ ที่จ่าย ' + form + ' งวด ' + thPeriod(period),
    src: 'filing', srcId: key,
    lines: [{ acc: accBySub(acctSub), dr: total }, { acc: accBySub('bank'), cr: total }],
  });
  const filing = { form, period, filedDate: addDays(endDate, 7), dueDate: addDays(endDate, 7),
    count: rows.length, total, entryNo: je.no,
    excluded: DB.taxTx.filter((t) => t.kind === 'wht' && t.period === period && t.channel === 'e_wht').length };
  DB.docs.filing.unshift(filing);
  rows.forEach((t) => { t.filingId = key; });
  audit('filing', key, 'file', null, { count: rows.length, total: fmt(total) });
  return filing;
}

/* ---------- ปิดงวด ---------- */
function closeChecklist(period) {
  const endDate = endOfMonth(period + '-01');
  const items = [];
  const rec = reconciliationChecks(endDate);
  rec.checks.forEach((c) => items.push({
    label: c.label, ok: c.ok,
    detail: c.ok ? 'ตรงกัน' : 'ต่างกัน ' + fmt(c.control - c.sub) + ' บาท', blocking: true,
  }));
  const dep = DB.docs.depreciation.find((d) => d.period === period);
  items.push({ label: 'ตั้งค่าเสื่อมราคาประจำงวด', ok: !!dep,
    detail: dep ? fmt(dep.bookTotal) + ' บาท' : 'ยังไม่ได้ทำ', blocking: true, action: 'depreciation' });
  const pay = DB.docs.payRun.find((r) => r.period === period);
  items.push({ label: 'ทำเงินเดือนประจำงวด', ok: !!pay,
    detail: pay ? pay.count + ' คน ' + fmt(pay.net) + ' บาท' : 'ยังไม่ได้ทำ', blocking: false, action: 'payroll' });
  const vat = DB.docs.filing.find((f) => f.form === 'PP30' && f.period === period);
  items.push({ label: 'ยื่นแบบ ภ.พ.30', ok: !!vat,
    detail: vat ? 'ชำระ ' + fmt(vat.payable) + ' บาท' : 'ยังไม่ได้ยื่น', blocking: true, action: 'vat' });
  const unmatched = DB.bankTxns.filter((t) => !t.matched && periodOf(t.date) <= period).length;
  items.push({ label: 'รายการธนาคารกระทบยอดครบ', ok: unmatched === 0,
    detail: unmatched === 0 ? 'ครบ' : 'ค้าง ' + unmatched + ' รายการ', blocking: false, action: 'bank' });

  return { period, items, canClose: items.filter((i) => i.blocking).every((i) => i.ok) };
}

function closePeriod(period) {
  const chk = closeChecklist(period);
  if (!chk.canClose) {
    throw new DomainError('CLOSE_BLOCKED',
      'ปิดงวดไม่ได้ เพราะยังมีรายการที่ต้องเคลียร์: '
        + chk.items.filter((i) => i.blocking && !i.ok).map((i) => i.label).join(', '));
  }
  const p = DB.periods.find((x) => x.code === period);
  if (!p) throw new DomainError('PERIOD_NOT_FOUND', 'ไม่พบงวด ' + period);
  p.status = 'closed';
  audit('period', period, 'close', { status: 'open' }, { status: 'closed' });
  return p;
}
function reopenPeriod(period, reason) {
  if (!reason || reason.trim().length < 5) {
    throw new DomainError('REASON_REQUIRED', 'การเปิดงวดที่ปิดแล้วต้องระบุเหตุผล');
  }
  const p = DB.periods.find((x) => x.code === period);
  if (!p) throw new DomainError('PERIOD_NOT_FOUND', 'ไม่พบงวด ' + period);
  p.status = 'open';
  audit('period', period, 'reopen', { status: 'closed' }, { status: 'open' }, reason.trim());
  return p;
}

/* ---------- กระทบยอดธนาคาร ---------- */
function matchBankTxn(id, entryNo) {
  const t = DB.bankTxns.find((x) => x.id === id);
  if (!t) throw new DomainError('TXN_NOT_FOUND', 'ไม่พบรายการเดินบัญชีนี้');
  t.matched = true;
  t.matchedTo = entryNo || 'จับคู่ด้วยตนเอง';
  audit('bank_txn', String(id), 'match', null, { to: t.matchedTo });
  return t;
}
function bookBankTxn(id, accountCode, desc) {
  const t = DB.bankTxns.find((x) => x.id === id);
  if (!t) throw new DomainError('TXN_NOT_FOUND', 'ไม่พบรายการเดินบัญชีนี้');
  if (t.matched) throw new DomainError('ALREADY_MATCHED', 'รายการนี้จับคู่แล้ว');
  const je = post({
    type: 'general', date: t.date, desc: desc || t.desc,
    src: 'bank', srcId: String(id),
    lines: t.credit > 0
      ? [{ acc: accBySub('bank'), dr: t.credit }, { acc: accountCode, cr: t.credit }]
      : [{ acc: accountCode, dr: t.debit }, { acc: accBySub('bank'), cr: t.debit }],
  });
  t.matched = true;
  t.matchedTo = je.no;
  return je;
}

function loadChart() {
  DB.accounts = COA.map(function (r) {
    return {
      code: r[0], name: r[1], type: r[2], subType: r[3],
      postable: !!r[4], requiresPartner: r[5] === 'partner',
      level: r[0].endsWith('000') ? 1 : r[0].endsWith('00') ? 2 : 3,
    };
  });
}

function loadPeriods(year) {
  DB.periods = [];
  for (let m = 1; m <= 12; m++) {
    const mm = String(m).padStart(2, '0');
    DB.periods.push({
      code: year + '-' + mm, start: year + '-' + mm + '-01',
      end: endOfMonth(year + '-' + mm + '-01'), status: 'open',
    });
  }
}

function buildBlank(o) {
  o = o || {};
  /* ★ ตรวจให้ครบก่อนแตะข้อมูลเดิมแม้แต่ฟิลด์เดียว
     ถ้าตรวจหลังจากเขียนทับไปแล้ว การกรอกผิดครั้งเดียวจะลบข้อมูลบริษัทเดิมทิ้ง */
  const taxId = String(o.taxId || '').trim();
  if (taxId && !validTaxId(taxId)) {
    throw new DomainError('TAX_ID_INVALID',
      'เลขประจำตัวผู้เสียภาษี ' + taxId + ' ไม่ผ่านการตรวจหลักที่ 13',
      'ตรวจเลขกับหนังสือรับรองของบริษัท หรือเว้นว่างไว้ก่อนแล้วมาแก้ทีหลัง');
  }
  const year = Number(o.year);
  if (!Number.isInteger(year) || year < 2000 || year > 2100) {
    throw new DomainError('FISCAL_YEAR_INVALID',
      'ปีของรอบบัญชีต้องเป็น ค.ศ. ระหว่าง 2000 ถึง 2100 (ได้รับ "' + o.year + '")',
      'ปี พ.ศ. 2569 คือ ค.ศ. 2026');
  }

  DB.company = {
    name: String(o.name || '').trim() || 'บริษัทของฉัน จำกัด',
    nameEn: '',
    taxId: taxId,
    regNo: taxId,
    address: String(o.address || '').trim(),
    branch: '00000', branchName: 'สำนักงานใหญ่', phone: '',
    fiscalYear: String(year + 543),
    standard: 'TFRS for NPAEs',
    bookkeeper: '', auditor: '',

  loadChart();
  loadPeriods(year);
  DB.partners = []; DB.items = []; DB.employees = []; DB.assets = [];
  DB.entries = []; DB.taxTx = [];
  DB.docs = {
    quotation: [], salesOrder: [], invoice: [], receipt: [], creditNote: [],
    purchaseOrder: [], bill: [], payment: [], whtCert: [],
    stockMove: [], payRun: [], depreciation: [], filing: [],

  DB.seq = {}; DB.budget = []; DB.projects = []; DB.bankTxns = [];
  DB.audit = []; DB.settings = { hardLockDate: null };
  DB.isDemo = false;
  audit('company', 'blank', 'create', null, { name: DB.company.name, year: DB.company.fiscalYear });
  return DB.company;
}

function monthsBetween(a, b) {
  const [ay, am] = a.split('-').map(Number);
  const [by, bm] = b.split('-').map(Number);
  return Math.max(0, (by - ay) * 12 + (bm - am) + 1);
}

/* ---------- สุ่มแบบกำหนดผลได้ (ผลลัพธ์เหมือนเดิมทุกครั้ง) ---------- */
let _seed = 20260731;
function rnd() { _seed = (_seed * 1103515245 + 12345) & 0x7fffffff; return _seed / 0x7fffffff; }
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const rint = (a, b) => a + Math.floor(rnd() * (b - a + 1));

/* ---------- สร้างธุรกรรม ม.ค.–มิ.ย. 2569 ---------- */
function generateTransactions() {
  // ม.ค.–มิ.ย. ปิดงวดครบแล้ว · ก.ค. เปิดอยู่ ยังไม่ได้ทำเงินเดือน ค่าเสื่อม และยื่นภาษี
  // เพื่อให้มีงานค้างจริงให้ผู้ใช้ทดลองทำ
  const months = ['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07'];
  const CLOSED_THROUGH = '2026-06';
  const stockItems = DB.items.filter((i) => i.type === 'stock');
  const svcItems = DB.items.filter((i) => i.type === 'service');
  const customers = DB.partners.filter((p) => p.kind === 'customer');
  const vendors = DB.partners.filter((p) => p.kind === 'vendor');

  months.forEach(function (mo, mi) {
    const last = Number(endOfMonth(mo + '-01').slice(-2));

    // ---- ขาย ----
    const salesCount = 12 + (mi % 3);
    for (let k = 0; k < salesCount; k++) {
      const c = customers[(mi * 3 + k) % customers.length];
      const lines = [];
      const nItems = rint(1, 3);
      for (let j = 0; j < nItems; j++) {
        const it = stockItems[(mi + k + j) % stockItems.length];
        if (it.qty < 3) continue;
        const qty = Math.max(1, Math.min(Math.floor(it.qty / 3), rint(1, 6)));
        lines.push({ desc: it.name, qty, price: String(divRound(it.price, S)),
                     uom: it.uom, itemCode: it.code, revenueSub: 'sales_revenue' });
      }
      if (rnd() > 0.5) {
        const sv = pick(svcItems);
        lines.push({ desc: sv.name, qty: 1, price: String(rint(25, 120) * 1000),
                     uom: 'งาน', revenueSub: 'service_revenue' });
      }
      if (!lines.length) continue;
      issueInvoice({ date: mo + '-' + String(rint(2, Math.min(28, last))).padStart(2, '0'),
                     partnerCode: c.code, lines });
    }

    // ---- เติมสต๊อกตามที่ขายไปจริง (นโยบายจุดสั่งซื้อ) ----
    let poSeq = 0;
    stockItems.forEach(function (it, idx) {
      if (it.qty > it.reorder) return;
      const target = it.reorder * 3;
      const qty = target - it.qty;
      if (qty <= 0) return;
      poSeq += 1;
      const v = vendors[idx % 2 === 0 ? 0 : 1];
      recordBill({
        date: mo + '-' + String(Math.min(last, 4 + poSeq * 2)).padStart(2, '0'),
        partnerCode: v.code,
        vendorNo: (v.code === 'VEN-0001' ? 'ASI-69-' : 'TPS-69-') + (1000 + mi * 20 + poSeq),
        lines: [{ desc: 'สั่งซื้อเติมสต๊อก ' + it.name, qty,
                  price: String(divRound(it.avgCost, S)),
                  expenseSub: 'inventory', itemCode: it.code }],
      });
    });

    // ---- ค่าใช้จ่ายประจำเดือน ----
    const recurring = [
      { v:'VEN-0012', no:'TNP-69-', desc:'ค่าเช่าอาคารสำนักงานและโกดัง', amt:'120000', sub:'admin_expense', wht:'WHT_RENT', day:1 },
      { v:'VEN-0009', no:'SBN-69-', desc:'ค่าขนส่งสินค้าประจำเดือน', amt:String(rint(60, 95) * 1000), sub:'selling_expense', wht:'WHT_TRANSPORT', day:25 },
      { v:'VEN-0025', no:'OFM-69-', desc:'วัสดุสิ้นเปลืองสำนักงาน', amt:String(rint(12, 28) * 1000), sub:'admin_expense', wht:null, day:12 },
      { v:'VEN-0030', no:'ENG-69-', desc:'ค่าน้ำมันรถยนต์นั่งผู้บริหาร', amt:String(rint(14, 22) * 1000), sub:'admin_expense', wht:null, day:20, nonClaim:true },
    ];
    if (mi % 2 === 0) {
      recurring.push({ v:'VEN-0015', no:'MDP-69-', desc:'ค่าโฆษณาออนไลน์', amt:'200000', sub:'selling_expense', wht:'WHT_ADVERT', day:18 });
    }
    if (mi % 3 === 1) {
      recurring.push({ v:'VEN-0021', no:'MAL-69-', desc:'ค่าที่ปรึกษาระบบบัญชี', amt:'50000', sub:'admin_expense', wht:'WHT_PROF', day:15 });
    }
    recurring.forEach(function (r, ri) {
      recordBill({
        date: mo + '-' + String(r.day).padStart(2, '0'),
        partnerCode: r.v, vendorNo: r.no + (mi * 10 + ri + 100),
        lines: [{ desc: r.desc, qty: 1, price: r.amt, expenseSub: r.sub }],
        whtCode: r.wht, nonClaimableVat: !!r.nonClaim,
      });
    });

    // ---- ใบลดหนี้เดือนละไม่เกิน 1 ใบ ----
    if (mi >= 1 && rnd() > 0.5) {
      const target = DB.docs.invoice.find((d) => periodOf(d.date) === mo && d.base > M('50000') && !d.credited);
      if (target) {
        try {
          issueCreditNote({ date: mo + '-' + String(Math.min(28, last)).padStart(2, '0'),
            invoiceNo: target.no, base: String(divRound(round2(divRound(target.base, 12)), S)),
            reason: pick(['RETURN_DEFECT','PRICE_REDUCE','CALC_ERROR']) });
        } catch (e) { /* ข้ามถ้าเงื่อนไขไม่ผ่าน */ }
      }
    }

    // ---- รับชำระใบที่ครบกำหนดแล้ว ----
    DB.docs.invoice.filter((d) => d.status === 'issued' && !d.broughtForward
        && d.due <= endOfMonth(mo + '-01') && d.due >= '2026-01-01')
      .forEach(function (inv) {
        const hasService = inv.lines.some((l) => l.desc.indexOf('ค่า') === 0);
        try {
          receivePayment({ date: inv.due, invoiceNo: inv.no,
            method: pick(['transfer','transfer','cheque','promptpay']),
            whtCode: hasService ? 'WHT_SERVICE' : null });
        } catch (e) { /* ข้าม */ }
      });

    // ---- จ่ายชำระเจ้าหนี้ที่ครบกำหนด ----
    DB.docs.bill.filter((b) => b.status === 'issued' && !b.broughtForward
        && b.due <= endOfMonth(mo + '-01'))
      .forEach(function (bill) {
        try {
          payBill({ date: bill.due, billNo: bill.no,
            channel: bill.whtCode && rnd() > 0.5 ? 'e_wht' : 'manual',
            whtCode: bill.whtCode });
        } catch (e) { /* ข้าม */ }
      });

    // ---- ดอกเบี้ยเงินกู้และค่าธรรมเนียมธนาคาร ----
    const finCost = M(String(rint(18, 26) * 1000));
    post({
      type: 'general', date: endOfMonth(mo + '-01'),

/* ===== sync.js ===== */
/* ===================================================================
   ซิงก์ข้อมูลกับเซิร์ฟเวอร์
   ถ้าเซิร์ฟเวอร์ต่อฐานข้อมูลไว้ ทุกเครื่องจะเห็นข้อมูลชุดเดียวกัน
   ถ้าไม่ได้ต่อ ก็กลับไปเก็บในเบราว์เซอร์เหมือนเดิม ไม่ต้องแก้อะไร
   =================================================================== */
const SYNC = {
  mode: 'browser',        // 'browser' | 'server'
  version: 0,
  needsPasscode: false,
  passcode: '',
  status: 'idle',         // idle | saving | saved | error | conflict | locked
  message: '',
  pending: false,
  timer: null,
  retry: null,
};
const PASS_KEY = 'duly.passcode';

/** ส่วนหัวของ HTTP รับได้แค่ ASCII รหัสผ่านภาษาไทยจึงต้องแปลงเป็น base64 ก่อนส่ง */
function encodePass(s) {
  const bytes = new TextEncoder().encode(String(s));
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
const syncHeaders = () => {
  const h = { 'content-type': 'application/json' };
  if (SYNC.passcode) h['x-passcode'] = encodePass(SYNC.passcode);
  return h;
};

function setStatus(s, msg) {
  SYNC.status = s;
  SYNC.message = msg || '';
  const el = document.getElementById('syncTag');
  if (!el) return;
  const map = {
    idle:     ['', ''],
    saving:   ['saving', 'กำลังบันทึก…'],
    saved:    ['saved', 'บันทึกขึ้นเซิร์ฟเวอร์แล้ว'],
    error:    ['error', 'บันทึกไม่สำเร็จ'],
    conflict: ['error', 'มีการแก้จากอีกเครื่อง'],
    locked:   ['error', 'ต้องใส่รหัสผ่าน'],
  };
  const m = map[s] || ['', ''];
  el.className = 'sync-tag ' + m[0];
  el.textContent = SYNC.mode === 'server' ? m[1] : '';
  el.title = SYNC.message;
}

async function syncConfig() {
  /* เปิดไฟล์ตรง ๆ จากเครื่อง ไม่มีเซิร์ฟเวอร์ให้ถาม และการเรียก fetch จะพ่นข้อผิดพลาดเปล่า ๆ */
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return false;
  try {
    const r = await fetch('/api/config');
    if (!r.ok) return false;
    const c = await r.json();
    SYNC.mode = c.storage === 'server' ? 'server' : 'browser';
    SYNC.needsPasscode = Boolean(c.needsPasscode);
    return SYNC.mode === 'server';
  } catch (e) {
    return false;                       // เปิดจากไฟล์ในเครื่อง ไม่มีเซิร์ฟเวอร์
  }
}

/** ดึงข้อมูลจากเซิร์ฟเวอร์ — คืน 'ok' | 'empty' | 'locked' | 'error' */
async function syncPull() {
  try {
    const r = await fetch('/api/state', { headers: syncHeaders() });
    if (r.status === 401) { setStatus('locked'); return 'locked'; }
    if (!r.ok) { setStatus('error', 'อ่านข้อมูลจากเซิร์ฟเวอร์ไม่ได้'); return 'error'; }
    const s = await r.json();
    SYNC.version = s.version || 0;
    if (!s.data) return 'empty';
    Object.keys(s.data).forEach(function (k) { DB[k] = s.data[k]; });
    if (DB.isDemo === undefined) DB.isDemo = DB.company.name === 'บริษัท ศรีวัฒนาการค้า จำกัด';
    setStatus('saved', 'ดึงข้อมูลรุ่นที่ ' + SYNC.version + ' มาแล้ว');
    return 'ok';
  } catch (e) {
    setStatus('error', e.message);
    return 'error';
  }
}

async function syncPush() {
  if (SYNC.mode !== 'server') return;
  SYNC.pending = false;
  setStatus('saving');
  try {
    const r = await fetch('/api/state', {
      method: 'PUT',
      headers: syncHeaders(),
      body: JSON.stringify({ version: SYNC.version, data: DB }),
    });
    if (r.status === 401) { setStatus('locked'); return; }
    if (r.status === 409) {
      /* อีกเครื่องบันทึกแทรกเข้ามา — ไม่เขียนทับ ให้ดึงของใหม่มาแทน
         ข้อมูลบัญชีหายเงียบ ๆ ไม่ได้ ต้องบอกให้รู้ทุกครั้ง */
      const s = await r.json();
      SYNC.version = s.version || 0;
      if (s.data) Object.keys(s.data).forEach(function (k) { DB[k] = s.data[k]; });
      setStatus('conflict');
      toast('มีการบันทึกจากอีกเครื่อง', 'err',
        'ระบบดึงข้อมูลล่าสุดมาแสดงแทนแล้ว สิ่งที่เพิ่งทำอาจต้องทำซ้ำ');
      render();
      return;
    }
    if (!r.ok) {
      const b = await r.json().catch(() => null);
      setStatus('error', (b && b.error && b.error.message) || ('HTTP ' + r.status));
      scheduleRetry();
      return;
    }
    const b = await r.json();
    SYNC.version = b.version;
    setStatus('saved', 'รุ่นที่ ' + SYNC.version);
  } catch (e) {
    setStatus('error', e.message);
    scheduleRetry();
  }
}

function scheduleRetry() {
  clearTimeout(SYNC.retry);
  SYNC.retry = setTimeout(function () { if (SYNC.pending || SYNC.status === 'error') syncPush(); }, 5000);
}

/** รวบการบันทึกหลายครั้งติดกันให้ยิงครั้งเดียว */
function syncSave() {
  SYNC.pending = true;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(syncPush, 500);
}

  return card({

      + '</div>',

async function syncUnlock(code) {
  SYNC.passcode = code;
  const r = await syncPull();
  if (r === 'locked') { SYNC.passcode = ''; return false; }
  try { localStorage.setItem(PASS_KEY, code); } catch (e) { /* ปิดการเก็บข้อมูลไว้ */ }
  if (r === 'empty') { buildSeed(); await syncPush(); }
  return true;
}
