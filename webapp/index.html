/* subType ที่โครงงบการเงินรองรับแล้ว แต่ผังบัญชีตั้งต้นของเรายังไม่มีบัญชีใช้
   ต้องบอกประเภทไว้ตรงนี้ ไม่งั้นบัญชีที่นำเข้ามาจะไม่มีประเภทแล้วสร้างไม่ได้ */
const EXTRA_SUBTYPE_TYPE = {
  salary_expense: 'expense',
  short_term_investment: 'asset',
  other_current_asset: 'asset',
};

/** ประเภทบัญชีของ subType หนึ่ง ๆ อ้างจากผังบัญชีของระบบเราก่อน */
function subTypeType(sub) {
  const a = DB.accounts.find((x) => x.subType === sub);
  return a ? a.type : (EXTRA_SUBTYPE_TYPE[sub] || null);
}

/** เดาว่าบัญชีรหัสนี้ควรไปอยู่บรรทัดไหนของงบการเงิน */
function inferSubType(code) {
  const c = String(code || '').trim().replace(/[^0-9]/g, '');
  if (!c) return null;
  let best = null, len = 0;
  DBD_SUBTYPE.forEach(function (p) {
    if (c.indexOf(p[0]) === 0 && p[0].length > len) { len = p[0].length; best = p[1]; }
  });
  return best || DBD_BY_LEAD[c[0]] || null;
}

/** บัญชีที่จะสร้างใหม่จากรหัสในงบทดลองของระบบเดิม */
function proposeAccount(code, name) {
  const sub = inferSubType(code);
  if (!sub) return null;
  const type = subTypeType(sub);
  if (!type) return null;
  return {
    code: String(code).trim(),
    name: String(name || '').trim() || ('บัญชี ' + String(code).trim()),
    type, subType: sub, postable: true, requiresPartner: false,
    level: 3, imported: true,
  };
}

function matchAccount(code, name) {
  const byCode = DB.accounts.find((a) => a.postable && a.code === String(code).trim());
  if (byCode) return byCode.code;
  const n = norm(name);
  if (!n) return null;
  const byName = DB.accounts.find((a) => a.postable && norm(a.name) === n);
  return byName ? byName.code : null;
}

const EXTRA_SUBTYPE_LABEL = {
  short_term_investment: 'เงินลงทุนชั่วคราว',
  other_current_asset: 'สินทรัพย์หมุนเวียนอื่น',
};
/** ชื่อไทยของ subType — ยืมชื่อบัญชีตัวแรกในผังของเราที่ใช้ subType นั้น */
function subTypeLabel(sub) {
  const a = DB.accounts.find((x) => x.subType === sub);
  return a ? a.name : (EXTRA_SUBTYPE_LABEL[sub] || sub);
}
/** บัญชี subType นี้ไปโผล่บรรทัดไหนของงบการเงิน */
function fsLineOf(sub) {
  let label = null;
  BS_LINES.concat(PL_LINES).forEach(function (L) {
    if (!label && L.k === 'd' && (L.sub || []).indexOf(sub) >= 0) label = L.label;
  });
  return label;
}
/** ตัวเลือกทั้งหมดสำหรับ "บัญชีใหม่นี้ควรอยู่บรรทัดไหนของงบ" */
function fsChoices() {
  const out = [];
  BS_LINES.concat(PL_LINES).forEach(function (L) {
    if (L.k !== 'd') return;
    (L.sub || []).forEach(function (sub) {
      if (subTypeType(sub)) out.push({ sub, group: L.label, label: subTypeLabel(sub) });
    });
  });
  return out;
}

/**
 * ตรวจก่อนนำเข้า — บอกให้ครบว่าจะเกิดอะไรขึ้น ก่อนแตะบัญชีจริง
 * overrides: { 'รหัสเดิม': 'รหัสในผังบัญชีเรา' } หรือ { 'รหัสเดิม': '+subType' }
 *   '+subType' = ให้สร้างบัญชีใหม่ด้วยรหัสและชื่อเดิม แล้ววางไว้บรรทัดนั้นของงบ
 */
function previewOpening(tbRows, overrides) {
  overrides = overrides || {};
  const matched = [], creating = [], unmatched = [];
  let totalDr = 0, totalCr = 0;
  tbRows.forEach(function (r) {
    const key = r.code || r.name;
    const ov = overrides[key];
    totalDr += r.debit; totalCr += r.credit;

    /* ผู้ใช้สั่งให้สร้างบัญชีใหม่ในบรรทัดงบที่เลือกเอง */
    if (ov && ov.charAt(0) === '+') {
      const sub = ov.slice(1);
      const t = subTypeType(sub);
      if (t) {
        creating.push({ ...r, subType: sub, type: t, fsLine: fsLineOf(sub) });
        return;
      }
    }
    const target = (ov && ov.charAt(0) !== '+' ? ov : null) || matchAccount(r.code, r.name);
    if (target && acc(target)) {
      matched.push({ ...r, target, targetName: acc(target).name });
      return;
    }
    /* ไม่มีในผังของเรา แต่รหัสเป็นผังมาตรฐานกรมพัฒน์ เดาบรรทัดงบให้แล้วสร้างใหม่
       ดีกว่าบังคับให้ผู้ใช้จับคู่บัญชีเองเป็นร้อยบรรทัด และเก็บรหัสเดิมไว้ได้ด้วย */
    const p = proposeAccount(r.code, r.name);
    if (p) {
      creating.push({ ...r, subType: p.subType, type: p.type, fsLine: fsLineOf(p.subType) });
      return;
    }
    unmatched.push(r);
  });
  return {
    matched, creating, unmatched, totalDr, totalCr,
    diff: totalDr - totalCr,
    balanced: totalDr === totalCr,
    ready: totalDr === totalCr && unmatched.length === 0 && (matched.length + creating.length) > 0,
  };
}

/* ===================================================================
   นำตัวเลขจากงบทดลองเข้าระบบ — มีสองแบบ อย่าสับกัน
   1. ยอดยกมา (opening)  ใช้คอลัมน์ยอดคงเหลือ/ยอดสะสม ลงใบสำคัญใบเดียว ณ วันตัดยอด
      เหมาะกับการเริ่มใช้ระบบ ไม่สนใจว่ารายได้ค่าใช้จ่ายเกิดเดือนไหน
   2. ยอดเคลื่อนไหวรายเดือน (movement)  ใช้คอลัมน์ยอดประจำงวด ลงใบสำคัญเดือนละใบ
      เหมาะกับการย้ายปีปัจจุบันเข้ามาให้งบกำไรขาดทุนรายเดือนถูกต้อง
      ต้องโหลดงบทดลองแยกเดือนละไฟล์ ไม่ใช่ไฟล์รายปีไฟล์เดียว
   =================================================================== */
function importedEntry(srcId) {
  return DB.entries.find((e) => e.src === 'import' && e.srcId === srcId && e.status === 'posted');
}

function runImport(tbRows, overrides, o) {
  const p = previewOpening(tbRows, overrides);
  if (!p.matched.length && !p.creating.length && !p.unmatched.length) {
    throw new DomainError('NOTHING_TO_IMPORT', 'ไม่พบบรรทัดที่มียอดในไฟล์นี้');
  }
  if (!p.balanced) {
    throw new DomainError('IMPORT_UNBALANCED',
      'ตัวเลขในไฟล์ไม่สมดุล เดบิตรวม ' + fmt(p.totalDr) + ' เครดิตรวม ' + fmt(p.totalCr)
        + ' ต่างกัน ' + fmt(p.diff),
      'ตรวจว่าเลือกชุดตัวเลขถูกชุด — งบทดลองมักมีทั้งยอดยกมา ยอดประจำงวด และยอดสะสม');
  }
  if (p.unmatched.length) {
    throw new DomainError('ACCOUNT_UNMATCHED',
      'ยังจับคู่บัญชีไม่ครบ เหลือ ' + p.unmatched.length + ' บัญชี',
      'เลือกบัญชีปลายทางให้ครบทุกบรรทัดก่อนนำเข้า');
  }
  /* ใบที่กลับรายการไปแล้วไม่นับว่าซ้ำ ไม่งั้นยกเลิกแล้วนำเข้าใหม่ไม่ได้ */
  if (importedEntry(o.srcId)) {
    throw new DomainError('ALREADY_IMPORTED', o.dupMessage,
      'ถ้าต้องการนำเข้าใหม่ ให้กดยกเลิกการนำเข้าครั้งนั้นก่อน');
  }

  /* สร้างบัญชีที่ยังไม่มีในผังก่อน โดยใช้รหัสและชื่อเดิมของระบบเก่า
     ทำหลังผ่านการตรวจทุกข้อแล้วเท่านั้น จะได้ไม่ทิ้งบัญชีค้างไว้เวลานำเข้าไม่ผ่าน */
  const created = [];
  p.creating.forEach(function (r) {
    const code = String(r.code || '').trim() || r.name;
    if (DB.accounts.find((a) => a.code === code)) return;
    const a = { code, name: r.name || ('บัญชี ' + code), type: r.type, subType: r.subType,
      postable: true, requiresPartner: false, level: 3, imported: true };
    DB.accounts.push(a);
    created.push(a);
  });
  DB.accounts.sort((a, b) => (a.code < b.code ? -1 : a.code > b.code ? 1 : 0));

  // รวมบรรทัดที่ชี้ไปบัญชีเดียวกัน แล้วสุทธิเป็นด้านเดียว
  const net = {};
  p.matched.forEach(function (r) { net[r.target] = (net[r.target] || 0) + r.debit - r.credit; });
  p.creating.forEach(function (r) {
    const code = String(r.code || '').trim() || r.name;
    net[code] = (net[code] || 0) + r.debit - r.credit;
  });
  const lines = Object.keys(net).filter((c) => net[c] !== 0).map(function (c) {
    const a = acc(c);
    const l = net[c] > 0 ? { acc: c, dr: net[c] } : { acc: c, cr: -net[c] };
    if (a.requiresPartner) l.partner = 'OPENING';
    return l;
  });
  if (!DB.partners.find((x) => x.code === 'OPENING')) {
    DB.partners.push({ code:'OPENING', name:'ยอดยกมาจากระบบเดิม', taxId:null, address:'',
      branch:'00000', entityType:'juristic', kind:'customer', termDays:0, active:false });
  }
  const je = post({
    type: o.type, date: o.date, desc: o.desc,
    src: 'import', srcId: o.srcId,
    lines: lines,
  });
  audit('import', o.srcId, 'run', null,
    { accounts: lines.length, created: created.length, total: fmt(p.totalDr) });
  return { entry: je, accounts: lines.length, created: created.length, total: p.totalDr };
}

/** ยอดยกมา — ใบสำคัญใบเดียว ณ วันตัดยอด */
function importOpeningBalances(tbRows, date, overrides) {
  return runImport(tbRows, overrides, {
    date: date, type: 'opening', srcId: 'opening|' + date,
    desc: 'ยอดยกมาจากระบบเดิม ณ ' + thDate(date),
    dupMessage: 'นำเข้ายอดยกมา ณ ' + thDate(date) + ' ไปแล้ว',
  });
}

/** ยอดเคลื่อนไหวของเดือนหนึ่ง — ใบสำคัญเดือนละใบ ลงวันสิ้นเดือน */
function importPeriodMovement(tbRows, period, overrides) {
  if (!/^\d{4}-\d{2}$/.test(String(period || ''))) {
    throw new DomainError('PERIOD_REQUIRED', 'ต้องเลือกเดือนของยอดเคลื่อนไหวก่อน');
  }
  const date = endOfMonth(period + '-01');
  return runImport(tbRows, overrides, {
    date: date, type: 'general', srcId: 'movement|' + period,
    desc: 'ยอดเคลื่อนไหวจากระบบเดิม งวด ' + thPeriod(period),
    dupMessage: 'นำเข้ายอดเคลื่อนไหวงวด ' + thPeriod(period) + ' ไปแล้ว',
  });
}

/** รายการนำเข้าทั้งหมดที่เคยทำ พร้อมสถานะ เพื่อให้ย้อนกลับได้ */
function listImports() {
  return DB.entries.filter((e) => e.src === 'import').map(function (e) {
    const kind = String(e.srcId || '').split('|')[0];
    return {
      no: e.no, date: e.date, desc: e.desc, status: e.status,
      kind: kind === 'movement' ? 'movement' : 'opening',
      key: String(e.srcId || '').split('|')[1] || '',
      lines: e.lines.length,
      total: e.lines.reduce((s, l) => s + (l.dr || 0), 0),
      reversedBy: e.reversedBy || null,
    };
  });
}

/** ยกเลิกการนำเข้า — กลับรายการตามกฎหมาย ไม่ลบทิ้ง แล้วนำเข้าใหม่ได้ */
function reverseImport(entryNo, reason) {
  const e = DB.entries.find((x) => x.no === entryNo);
  if (!e || e.src !== 'import') {
    throw new DomainError('NOT_AN_IMPORT', 'ใบสำคัญ ' + entryNo + ' ไม่ใช่รายการที่มาจากการนำเข้า');
  }
  return reverse(entryNo, reason || 'ยกเลิกการนำเข้าเพื่อนำเข้าใหม่ให้ถูกต้อง', e.date, { fromSource: true });
}

/* ===================================================================
   แฟ้มข้อมูลจากตัวดึง FlowAccount (financii-import/1 — รับของเดิม duly-import/1 ด้วย)
   =================================================================== */
const PACKAGE_FORMATS = ['financii-import/1', 'duly-import/1'];   // รับของเดิมด้วย
function validatePackage(pkg) {
  if (!pkg || PACKAGE_FORMATS.indexOf(pkg.format) < 0) {
    throw new DomainError('BAD_PACKAGE',
      'ไฟล์นี้ไม่ใช่แฟ้มข้อมูลของระบบ (ต้องเป็น financii-import/1)',
      'ใช้ไฟล์ที่ได้จากคำสั่ง flowaccount-import convert');
  }
  if (!pkg.cutoff || !/^\d{4}-\d{2}-\d{2}$/.test(pkg.cutoff)) {
    throw new DomainError('BAD_CUTOFF', 'แฟ้มข้อมูลไม่ได้ระบุวันตัดยอดที่ถูกต้อง');
  }
  return pkg;
}

function upsertPartner(p) {
  const kind = p.kind === 'vendor' ? 'vendor' : 'customer';
  const rec = {
    code: p.code, name: p.name, taxId: p.taxId || null, address: p.address || '',
    branch: p.branch || (p.entityType === 'individual' ? null : '00000'),
    entityType: p.entityType === 'individual' ? 'individual' : 'juristic',
    kind: kind, termDays: Number(p.termDays || 0), whtCode: p.whtCode || null,
    creditLimit: M(p.creditLimit || '0'), active: true,
  };
  const at = DB.partners.findIndex((x) => x.code === rec.code);
  if (at >= 0) { DB.partners[at] = { ...DB.partners[at], ...rec }; return 0; }
  DB.partners.push(rec);
  return 1;
}

function upsertItem(i) {
  const rec = {
    code: i.code, name: i.name, category: i.category || 'ทั่วไป', uom: i.uom || 'หน่วย',
    type: i.type === 'service' ? 'service' : 'stock',
    avgCost: M(i.avgCost || '0'), price: M(i.price || '0'),
    qty: Number(i.qty || 0), reorder: Number(i.reorder || 0),
  };
  rec.value = rec.avgCost * rec.qty;
  const at = DB.items.findIndex((x) => x.code === rec.code);
  if (at >= 0) { DB.items[at] = { ...DB.items[at], ...rec }; return 0; }
  DB.items.push(rec);
  return 1;
}

function upsertEmployee(e) {
  const rec = {
    code: e.code, name: e.name, dept: e.dept || 'ไม่ระบุ',
    salary: M(e.salary || '0'), otHours: Number(e.otHours || 0),
    pvdRate: Number(e.pvdRate || 0), deductions: M(e.deductions || '0'),
    active: e.active !== false, hired: e.hired || null,
    nationalId: e.nationalId || null, ssoNumber: e.ssoNumber || null,
  };
  const at = DB.employees.findIndex((x) => x.code === rec.code);
  if (at >= 0) { DB.employees[at] = { ...DB.employees[at], ...rec }; return 0; }
  DB.employees.push(rec);
  return 1;
}

/** เอกสารค้างยกมา — เป็นบัญชีย่อยเท่านั้น ไม่ลงบัญชีซ้ำ เพราะยอดอยู่ในงบทดลองแล้ว */
function importOpenDocs(pkg, entryNo) {
  let inv = 0, bill = 0;
  (pkg.openInvoices || []).forEach(function (d) {
    if (DB.docs.invoice.find((x) => x.no === d.no)) return;
    const base = M(d.base || '0'), vat = M(d.vat || '0');
    const total = d.total !== undefined ? M(d.total) : base + vat;
    DB.docs.invoice.push({
      no: d.no, legacyNo: d.legacyNo || d.no, date: d.date, due: d.due || d.date,
      partnerCode: d.partnerCode, partnerName: d.partnerName,
      snap: { name:d.partnerName, taxId:d.taxId || null, branch:d.branch || '00000', address:d.address || '' },
      lines: [{ desc:'ยอดค้างยกมาจากระบบเดิม', qty:1, price:base, amount:base, taxCode:'EXEMPT', uom:'', itemCode:null }],
      base: base, vat: vat, total: total,
      paid: M(d.paid || '0'), credited: M(d.credited || '0'),
      bfPaid: M(d.paid || '0') + M(d.credited || '0'),
      status: 'issued', entryNo: entryNo, etax: 'not_applicable', broughtForward: true,
    });
    inv++;
  });
  (pkg.openBills || []).forEach(function (d) {
    if (DB.docs.bill.find((x) => x.no === d.no)) return;
    const base = M(d.base || '0'), vat = M(d.vat || '0');
    const total = d.total !== undefined ? M(d.total) : base + vat;
    DB.docs.bill.push({
      no: d.no, legacyNo: d.legacyNo || d.no, date: d.date, due: d.due || d.date,
      vendorNo: d.vendorNo || d.no, partnerCode: d.partnerCode, partnerName: d.partnerName,
      lines: [{ desc:'ยอดค้างยกมาจากระบบเดิม', qty:1, price:base, amount:base, itemCode:null }],
      base: base, vat: vat, total: total, claimable: true,
      paid: M(d.paid || '0'), bfPaid: M(d.paid || '0'), status: 'issued', entryNo: entryNo,
      whtCode: d.whtCode || null, broughtForward: true,
    });
    bill++;
  });
  return { inv, bill };
}

function importPackage(pkg, overrides) {
  validatePackage(pkg);
  const before = { partners: DB.partners.length, items: DB.items.length,
    employees: DB.employees.length };
  let newPartners = 0, newItems = 0, newEmployees = 0;
  (pkg.partners || []).forEach((p) => { newPartners += upsertPartner(p); });
  (pkg.items || []).forEach((i) => { newItems += upsertItem(i); });
  (pkg.employees || []).forEach((e) => { newEmployees += upsertEmployee(e); });

  let opening = null;
  if (pkg.trialBalance && pkg.trialBalance.length) {
    const tb = pkg.trialBalance.map((r) => ({
      code: String(r.code || ''), name: String(r.name || ''),
      debit: M(r.debit || '0'), credit: M(r.credit || '0'),
    }));
    opening = importOpeningBalances(tb, pkg.cutoff, overrides);
  }
  const docs = importOpenDocs(pkg, opening ? opening.entry.no : null);

  const asOf = pkg.cutoff;
  const rec = reconciliationChecks(asOf);
  audit('import', 'package|' + pkg.cutoff, 'run', null, {
    partners: newPartners, items: newItems, employees: newEmployees,
    invoices: docs.inv, bills: docs.bill,
  });
  return {
    cutoff: pkg.cutoff, source: pkg.source || 'ไม่ระบุ',
    partners: newPartners, partnersSeen: (pkg.partners || []).length,
    items: newItems, itemsSeen: (pkg.items || []).length,
    employees: newEmployees, employeesSeen: (pkg.employees || []).length,
    invoices: docs.inv, bills: docs.bill,
    coverage: pkg.coverage || [],
    opening: opening,
    warnings: pkg.warnings || [],
    checks: rec.checks, allPassed: rec.allPassed,
    before: before,
  };
}


/* ===== ui-charts.js ===== */
/* ===================================================================
   กราฟ — วาดเป็น SVG ตรง ๆ ไม่พึ่งไลบรารีภายนอก
   ทุกสีดึงจากโทเคนธีม จึงถูกต้องทั้งธีมสว่างและธีมมืด
   =================================================================== */

const CH = { w: 720, h: 236, top: 14, right: 14, bottom: 30, left: 62 };
const plotW = () => CH.w - CH.left - CH.right;
const plotH = () => CH.h - CH.top - CH.bottom;

/* ตัวเลขบนแกน — หน่วยล้านบาท อ่านง่ายกว่าเลขเต็ม */
const axisM = (v) => (v / S / 1000000).toFixed(v / S / 1000000 >= 10 ? 0 : 1);
const tip = (label, value) => ' data-tip="' + esc(label + ' · ' + fmt(value) + ' บาท') + '"';

/** ขั้นแกนที่ลงตัว 1 / 2 / 2.5 / 5 × 10^n */
function niceMax(v, ticks) {
  if (v <= 0) return { max: 1, step: 1 };
  const raw = v / ticks;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const mult = [1, 2, 2.5, 5, 10].find((m) => m * mag >= raw) || 10;
  const step = mult * mag;
  return { max: step * ticks, step };
}

function gridY(max, ticks, showZero) {
  let g = '';
  for (let i = 0; i <= ticks; i++) {
    const y = CH.top + plotH() - (plotH() * i) / ticks;
    const v = (max * i) / ticks;
    g += '<line class="grid' + (i === 0 && showZero ? ' base' : '') + '" x1="' + CH.left + '" y1="' + y
      + '" x2="' + (CH.w - CH.right) + '" y2="' + y + '"/>'
      + '<text class="ax" x="' + (CH.left - 9) + '" y="' + (y + 4) + '" text-anchor="end">' + axisM(v) + '</text>';
  }
  return g;
}

/** มุมบนมนตามหลัก ปลายข้อมูลมน 4px ฐานตรงติดเส้นศูนย์ */
function barTop(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h);
  return 'M' + x + ' ' + (y + h) + 'V' + (y + rr) + 'a' + rr + ' ' + rr + ' 0 0 1 ' + rr + ' ' + -rr
    + 'h' + (w - rr * 2) + 'a' + rr + ' ' + rr + ' 0 0 1 ' + rr + ' ' + rr + 'V' + (y + h) + 'Z';
}

/* ---------- แท่งเปรียบเทียบ 2 ชุดข้อมูลรายเดือน ---------- */
function chartGrouped(rows, series, caption) {
  const peak = Math.max(1, ...rows.map((r) => Math.max(...series.map((s) => r[s.key]))));
  const { max } = niceMax(peak, 4);
  const band = plotW() / rows.length;
  const gap = 2;                                   // ช่องว่าง 2px ระหว่างแท่งที่ติดกัน
  const bw = Math.min(26, (band * 0.62 - gap * (series.length - 1)) / series.length);
  let bars = '';
  rows.forEach(function (r, i) {
    const cx = CH.left + band * i + band / 2;
    const total = bw * series.length + gap * (series.length - 1);
    series.forEach(function (s, j) {
      const h = Math.max(0, (r[s.key] / max) * plotH());
      const x = cx - total / 2 + j * (bw + gap);
      const y = CH.top + plotH() - h;
      bars += '<path class="mk" fill="var(' + s.color + ')" d="' + barTop(x, y, bw, h, 4) + '"'
        + tip(r.label + ' — ' + s.name, r[s.key]) + '></path>';
    });
    bars += '<text class="ax" x="' + cx + '" y="' + (CH.h - 10) + '" text-anchor="middle">' + esc(r.label) + '</text>';
  });
  return '<div class="chart-wrap">'
    + '<div class="legend">' + series.map((s) =>
        '<span><i style="background:var(' + s.color + ')"></i>' + esc(s.name) + '</span>').join('')
    + '<span class="grow"></span><span class="unit">' + esc(caption) + '</span></div>'
    + '<svg class="chart" viewBox="0 0 ' + CH.w + ' ' + CH.h + '" role="img">'
    + gridY(max, 4, true) + bars + '</svg></div>';
}

/* ---------- เส้นแนวโน้ม ---------- */
function chartLine(rows, key, name, caption) {
  const peak = Math.max(1, ...rows.map((r) => r[key]));
  const { max } = niceMax(peak, 4);
  const step = rows.length > 1 ? plotW() / (rows.length - 1) : 0;
  const px = (i) => CH.left + step * i;
  const py = (v) => CH.top + plotH() - (v / max) * plotH();
  const pts = rows.map((r, i) => px(i) + ' ' + py(r[key]));
  const line = 'M' + pts.join('L');
  const area = line + 'L' + px(rows.length - 1) + ' ' + (CH.top + plotH())
    + 'L' + px(0) + ' ' + (CH.top + plotH()) + 'Z';
  const last = rows[rows.length - 1];
  let dots = '', labels = '';
  rows.forEach(function (r, i) {
    const isLast = i === rows.length - 1;
    dots += '<circle class="mk dot' + (isLast ? ' end' : '') + '" cx="' + px(i) + '" cy="' + py(r[key])
      + '" r="' + (isLast ? 4.5 : 3.5) + '"' + tip(r.label + ' — ' + name, r[key]) + '></circle>';
    labels += '<text class="ax" x="' + px(i) + '" y="' + (CH.h - 10) + '" text-anchor="middle">' + esc(r.label) + '</text>';
  });
  return '<div class="chart-wrap">'
    + '<div class="legend"><span class="grow"></span><span class="unit">' + esc(caption) + '</span></div>'
    + '<svg class="chart" viewBox="0 0 ' + CH.w + ' ' + CH.h + '" role="img">'
    + gridY(max, 4, true)
    + '<path class="area" d="' + area + '"/><path class="line" d="' + line + '"/>'
    + dots + labels
    + '<text class="val" x="' + (px(rows.length - 1) - 6) + '" y="' + (py(last[key]) - 12)
    + '" text-anchor="end">' + fmt(last[key], 0) + '</text>'
    + '</svg></div>';
}

/* ---------- แท่งแนวนอนพร้อมค่ากำกับทุกแท่ง ---------- */
function chartBarsH(rows, caption) {
  const peak = Math.max(1, ...rows.map((r) => r.value));
  const rowH = 30, padL = 168, padR = 108;
  const h = rows.length * rowH + 10;
  const w = 720, barW = w - padL - padR;
  let body = '';
  rows.forEach(function (r, i) {
    const y = i * rowH + 5;
    const len = Math.max(2, (r.value / peak) * barW);
    body += '<text class="ax lbl" x="' + (padL - 12) + '" y="' + (y + 15) + '" text-anchor="end">' + esc(r.label) + '</text>'
      + '<rect class="track" x="' + padL + '" y="' + (y + 5) + '" width="' + barW + '" height="12" rx="4"/>'
      + '<rect class="mk" x="' + padL + '" y="' + (y + 5) + '" width="' + len + '" height="12" rx="4"'
      + ' fill="var(' + (r.color || '--s1') + ')"' + tip(r.label, r.value) + '></rect>'
      + '<text class="val" x="' + (padL + barW + 10) + '" y="' + (y + 15) + '">' + fmt(r.value, 0) + '</text>';
  });
  return '<div class="chart-wrap">'
    + '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img">' + body + '</svg>'
    + (caption ? '<div class="legend"><span class="grow"></span><span class="unit">' + esc(caption) + '</span></div>' : '')
    + '</div>';
}

/* ---------- เส้นจิ๋วในกล่องตัวเลขสรุป ---------- */
function sparkline(values) {
  if (!values || values.length < 2) return '';
  const lo = Math.min(...values), hi = Math.max(...values);
  const span = hi - lo || 1;
  const w = 108, h = 24, step = w / (values.length - 1);
  const pts = values.map((v, i) => (step * i).toFixed(1) + ' ' + (h - 2 - ((v - lo) / span) * (h - 6)).toFixed(1));
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">'
    + '<polyline points="' + pts.join(' ') + '"/>'
    + '<circle cx="' + (w - 1.5) + '" cy="' + (h - 2 - ((values[values.length - 1] - lo) / span) * (h - 6)).toFixed(1)
    + '" r="2.2"/></svg>';
}

/* ---------- ตัวเลขรายเดือนตั้งแต่ต้นปีถึงงวดที่เลือก ---------- */
function monthlySeries() {
  const yr = STATE.period.slice(0, 4);
  const upto = Number(STATE.period.slice(5, 7));
  const rows = [];
  for (let m = 1; m <= upto; m++) {
    const code = yr + '-' + String(m).padStart(2, '0');
    const from = code + '-01', to = endOfMonth(from);
    const revenue = -balanceOf((a) => a.type === 'revenue', to, from);
    const expense = balanceOf((a) => a.type === 'expense', to, from);
    rows.push({
      code, label: TH_M[m - 1], revenue, expense, net: revenue - expense,
      cash: balBySub(CASH_SUB, to),
      ar: DB.docs.invoice.filter((d) => d.status !== 'draft' && d.status !== 'void' && d.date <= to)
        .reduce((s, d) => s + outstandingAsOf('ar', d, to), 0),
      ap: DB.docs.bill.filter((d) => d.status !== 'draft' && d.status !== 'void' && d.date <= to)
        .reduce((s, d) => s + outstandingAsOf('ap', d, to), 0),
      assets: balanceOf((a) => a.type === 'asset', to),
    });
  }
  return rows;
}

/* ---------- ค่าใช้จ่ายสูงสุดของงวด ---------- */
function topExpenses(from, to, n) {
  const rows = DB.accounts.filter((a) => a.postable && a.type === 'expense')
    .map((a) => ({ label: a.name, code: a.code, value: balanceOf(a.code, to, from) }))
    .filter((r) => r.value > 0)
    .sort((a, b) => b.value - a.value);
  const head = rows.slice(0, n);
  const rest = rows.slice(n).reduce((s, r) => s + r.value, 0);
  if (rest > 0) head.push({ label: 'ค่าใช้จ่ายอื่น ๆ รวม', code: null, value: rest });
  return head;
}

/* บรรทัดของงบการเงิน (ใช้ทั้งงบดุลและงบกำไรขาดทุน) */
function fsRows(lines) {
  let h = '<div class="scroll"><table class="fs"><tbody>';
  lines.forEach(function (L) {
    if (L.k === 'd' && L.value === 0) return;   // งบการเงินไม่แสดงบรรทัดที่ไม่มียอด
    if (L.k === 'sp') { h += '<tr class="sp"><td colspan="3"></td></tr>'; return; }
    if (L.k === 'h')  { h += '<tr class="fs-h"><td colspan="3">' + esc(L.label) + '</td></tr>'; return; }
    if (L.k === 'h2') { h += '<tr class="fs-h2"><td colspan="3">' + esc(L.label) + '</td></tr>'; return; }
    const cls = L.k === 't' ? 'fs-t' : L.k === 's' ? 'fs-s' : '';

      + '<td class="ctr dim">' + (L.note ? String(L.note) : '') + '</td>'

/** ตัวเลขเล็ก ๆ บนแต่ละขั้น — งานที่ยังค้าง หรือเครื่องหมายว่าทำแล้ว */
function flowCount(sc) {
  const per = (k) => (DB.docs[k] || []).filter((d) => periodOf(d.date) === STATE.period).length;
  const live = (k) => (DB.docs[k] || []).filter((d) => tradeDocStatus(k, d) === 'issued').length;
  const done = (ok) => (ok ? '✓' : '!');
  switch (sc) {
    case 'quotations': return live('quotation');
    case 'salesorders': return live('salesOrder');
    case 'purchaseorders': return live('purchaseOrder');
    case 'invoices': return DB.docs.invoice.filter((d) => d.status !== 'void' && invOutstanding(d) > 0).length;
    case 'billingnotes': return DB.docs.billingNote.filter((b) => ['issued', 'partially_paid'].indexOf(billingNoteStatus(b)) >= 0).length;
    case 'receipts': return per('receipt');
    case 'creditnotes': return per('creditNote');
    case 'debitnotes': return per('debitNote');
    case 'goodsreceipts': return DB.docs.goodsReceipt.filter((g) => g.status === 'received').length;
    case 'bills': return DB.docs.bill.filter((b) => billOutstanding(b) > 0).length;
    case 'paymentprep': return DB.docs.paymentBatch.filter(paymentBatchActive).length;
    case 'payments': return per('payment');
    case 'expenses': return per('expense');
    case 'whtcert': return per('whtCert');
    case 'bank': return done(!DB.bankTxns.some((t) => !t.matched && periodOf(t.date) <= STATE.period));
    case 'deprec': return done(DB.docs.depreciation.some((d) => d.period === STATE.period && d.status !== 'void'));
    case 'payroll': return done(DB.docs.payRun.some((r) => r.period === STATE.period && r.status !== 'void'));
    case 'pp30': return done(DB.docs.filing.some((f) => f.form === 'PP30' && f.period === STATE.period));
    case 'pnd': {
      const need = ['PND1', 'PND3', 'PND53'].filter((f) => DB.taxTx.some((t) => t.kind === 'wht'
        && t.period === STATE.period && t.form === f && t.channel === 'manual' && !t.void));
      return done(need.every((f) => DB.docs.filing.some((x) => x.form === f && x.period === STATE.period)));
    }
    case 'close': { const p = DB.periods.find((x) => x.code === STATE.period); return done(p && p.status === 'closed'); }
    default: return '';
  }
}

function pageContext(screen) {
  const info = PAGE_INFO[screen];
  const flow = FLOWS[FLOW_OF[screen]];
  if (!info && !flow) return '';
  const label = (sc) => { const w = navWhere(sc); return w ? w.item[1] : sc; };
  const step = (sc) => {
    let n = '';
    try { n = flowCount(sc); } catch (e) { n = ''; }
    return '<li><a href="#" data-act="go:' + sc + '"' + (sc === screen ? ' class="on" aria-current="step"' : '') + '>'
      + esc(label(sc)) + (n !== '' && n !== 0 ? '<span class="n">' + esc(String(n)) + '</span>' : '') + '</a></li>';
  };
  let h = '<div class="ctx">';
  if (flow) {
    h += '<ol class="flow" aria-label="' + esc(flow.l) + '"><li class="flow-l">' + esc(flow.l) + '</li>'
      + flow.steps.map(step).join('')
      + (flow.alt ? flow.alt.map((sc) => step(sc).replace('<li>', '<li class="alt">')).join('') : '')
      + '</ol>';
  }
  if (info) {
    const book = info.book && info.book.length > 3 ? '<span class="je-book">' + esc(info.book) + '</span>' : '';
    h += '<div class="ctx-row"><div class="ctx-d">' + esc(info.d) + '</div>'
      + (info.je ? '<div class="je-chips" aria-label="ผลทางบัญชี">' + info.je.map((j) =>
          '<span class="je-chip ' + j[0] + '"><b>' + (j[0] === 'dr' ? 'Dr' : j[0] === 'cr' ? 'Cr' : '—') + '</b>'
          + esc(j[1]) + '</span>').join('') + book + '</div>' : '')
      + '</div>';
  }
  return h + '</div>';
}

    pbApproved.length && { tone:'warn', t:'อนุมัติแล้วรอจ่าย ' + pbApproved.length + ' ใบ',

    dueBills.length && { tone:'warn', t:'เจ้าหนี้ครบกำหนดภายใน 7 วัน ' + dueBills.length + ' ราย',
      d:'รวม ' + fmt(sumOf(dueBills, billOutstanding)) + ' บาท', act:['go:paymentprep', 'จัดทำใบเตรียมจ่าย'] },
    grnWait.length && { tone:'warn', t:'รับสินค้าแล้วรอใบกำกับจากผู้ขาย ' + grnWait.length + ' ใบ',

  ].filter(Boolean);

  const li = (tone, t, d, a) => '<li><span class="dot ' + tone + '"></span><div><b>' + esc(t) + '</b>'

  const todoCard = '<section class="card"><div class="card-h"><div><h2>สิ่งที่ต้องทำ</h2>'
    + '<div class="card-sub">' + thPeriod(STATE.period) + ' — ติดตามเงิน ' + follow.length + ' เรื่อง · งานปิดงวด '
    + (todo.length ? todo.length + ' รายการ' : 'เคลียร์ครบแล้ว') + '</div></div></div>'
    + (follow.length ? '<div class="sub-h">ติดตามเงินเข้าออก</div><ul class="todo">'
        + follow.map((f) => li(f.tone, f.t, f.d, f.act)).join('') + '</ul>' : '')
    + '<div class="sub-h">งานปิดงวด</div>'
    + (todo.length
        ? '<ul class="todo">' + todo.map(function (i) {
            const a = i.action && actMap[i.action];
            return li(i.blocking ? 'bad' : 'warn', i.label,
              i.detail + (i.blocking ? ' · ปิดงวดไม่ได้จนกว่าจะเคลียร์' : ' · ไม่บล็อกการปิดงวด'), a);
          }).join('') + '</ul>'
        : '<div class="empty">ทุกอย่างเรียบร้อย พร้อมปิดงวด<div style="margin-top:12px">' + btn('go:close', 'ไปหน้าปิดงวด') + '</div></div>')
    + '</section>';

  const hello = '<div class="hello"><div><h1>ภาพรวม ' + esc(thPeriod(STATE.period)) + '</h1>'
    + '<div class="dim">ข้อมูล ณ ' + thDate(to) + ' · '
    + (todo.length ? 'เหลืองานก่อนปิดงวด ' + todo.length + ' รายการ' : 'พร้อมปิดงวด') + '</div></div>'
    + '<span class="grow"></span><div class="quick">'
    + btn('new:invoice', '+ ออกใบกำกับภาษี') + btn('new:receipt', '+ รับชำระ')
    + btn('new:expense', '+ บันทึกค่าใช้จ่าย') + btn('cmdk', 'ค้นหา…')
    + '</div></div>';

  return demoBanner + hello + '<div class="kpis">' + tiles.map(function (k) {
      return '<div class="kpi' + (k.tone ? ' ' + k.tone : '') + (k.act ? ' clickable" data-act="' + k.act : '') + '">'
        + '<div class="kpi-l">' + (k.icon ? icon(k.icon) : '') + esc(k.label) + '</div>'
        + '<div class="kpi-v">' + esc(k.value) + '</div>'
        + '<div class="kpi-s">' + (k.sub || '') + '</div>'
        + (k.spark ? sparkline(k.spark) : '') + '</div>';
    }).join('') + '</div>'
  + '<div class="dash-2">' + todoCard
  + card({ title:'ตรวจยอดคุมอัตโนมัติ', sub:'ระบบตรวจให้ทุกครั้งที่มีรายการเปลี่ยน · ' + (rec.allPassed ? 'ตรงกันทุกข้อ' : 'มีข้อที่ไม่ตรง'),
      body:'<ul class="checks">' + rec.checks.map((c) =>
        '<li><span class="dot ' + (c.ok ? 'good' : 'bad') + '"></span>' + esc(c.label)
        + '<span class="grow"></span><span class="' + (c.ok ? 'st paid' : 'st late') + '">'
        + (c.ok ? 'ตรงกัน' : 'ต่าง ' + fmt(c.control - c.sub)) + '</span></li>').join('') + '</ul>' })
  + '</div>'
  + '<div class="dash-2">'
  + card({ title:'รายได้และค่าใช้จ่ายรายเดือน',
      sub:'รอบบัญชี ' + DB.company.fiscalYear + ' ถึง ' + thPeriod(STATE.period),
      actions: chip('view:chart', 'กราฟ', STATE.dashView !== 'table')
             + chip('view:table', 'ตาราง', STATE.dashView === 'table'),
      body: STATE.dashView === 'table' ? revTable
        : chartGrouped(S12, [
            { key:'revenue', name:'รายได้รวม', color:'--s1' },
            { key:'expense', name:'ค่าใช้จ่ายรวม', color:'--s2' },
          ], 'หน่วย: ล้านบาท'),
      foot:'ระยะห่างระหว่างสองแท่งในแต่ละเดือนคือกำไรสุทธิของเดือนนั้น' })
  + card({ title:'เงินสดและเงินฝากปลายเดือน', sub:'รวมเงินสดย่อย บัญชีกระแสรายวัน และบัญชีออมทรัพย์',
      body: chartLine(S12, 'cash', 'เงินสดคงเหลือ', 'หน่วย: ล้านบาท'),
      foot:'ตัวเลขดึงจากบัญชีแยกประเภทโดยตรง ไม่ได้กรอกซ้ำ' })
  + '</div>'
  + '<div class="dash-2">'
  + card({ title:'ค่าใช้จ่ายสูงสุดของงวด', sub: thPeriod(STATE.period),
      body: chartBarsH(topExpenses(from, to, 6), 'หน่วย: บาท'),
      foot:'คลิกหัวข้อในผังบัญชีเพื่อเจาะดูรายการที่ประกอบเป็นยอดนี้' })
  + card({ title:'ลูกหนี้แยกตามอายุหนี้', sub:'ณ ' + thDate(to) + ' · รวม ' + fmt(ar.totals.total) + ' บาท',
      actions: btn('go:ar', 'ดูรายลูกค้า'),
      body: AGE.length ? chartBarsH(AGE, 'หน่วย: บาท') : '<div class="empty">ไม่มียอดลูกหนี้คงค้าง</div>',
      foot: overdue > 0
        ? 'เกินกำหนดชำระรวม ' + fmt(overdue) + ' บาท คิดเป็น '
          + (ar.totals.total ? (overdue / ar.totals.total * 100).toFixed(1) : '0') + '% ของลูกหนี้ทั้งหมด'
        : 'ลูกหนี้ทั้งหมดยังอยู่ในกำหนดชำระ' })
  + '</div>'
  + card({ title:'รายการบัญชีล่าสุด', sub:'ทุกใบสำคัญที่ระบบสร้างจากเอกสาร',
      actions: btn('go:journals', 'ดูสมุดรายวันทั้งหมด'),
      body: tbl({
        cols:[{t:'เลขที่'},{t:'วันที่'},{t:'สมุด'},{t:'คำอธิบาย'},{t:'ยอด',a:'r'},{t:'สถานะ'}],
        rows: DB.entries.slice().reverse().slice(0, 10).map((e) =>
          [{mono:e.no}, thDateNum(e.date), JOURNAL_BOOKS[journalOf(e)].label.replace('สมุดรายวัน', ''),
           e.desc, {n:e.total}, statusPill(e.status)]),

      }) });
}

/* ===================================================================
   ปิดงวดบัญชี
   =================================================================== */
function scClose() {
  const chk = closeChecklist(STATE.period);
  const p = DB.periods.find((x) => x.code === STATE.period);
  const actMap = {
    depreciation: ['run:deprec', 'ตั้งค่าเสื่อมราคาเดี๋ยวนี้'],
    payroll: ['run:payroll', 'ทำเงินเดือนเดี๋ยวนี้'],
    vat: ['run:pp30', 'ยื่น ภ.พ.30 เดี๋ยวนี้'],
    bank: ['go:bank', 'ไปหน้ากระทบยอด'],
  };
  const rows = chk.items.map(function (i) {
    const a = i.action && actMap[i.action];
    return '<li><span class="dot ' + (i.ok ? 'good' : i.blocking ? 'bad' : 'warn') + '"></span>'
      + '<div><b>' + esc(i.label) + '</b><div class="dim">' + esc(i.detail) + '</div></div>'
      + '<span class="grow"></span>'
      + (i.ok ? '<span class="st paid">ผ่าน</span>' : (a ? btn(a[0], a[1], i.blocking ? 'primary' : '') : '<span class="st late">ยังไม่ผ่าน</span>'))
      + '</li>';
  }).join('');

  const closedList = DB.periods.filter((x) => x.status === 'closed');
  return card({
    title: 'ปิดงวดบัญชี ' + thPeriod(STATE.period),
    sub: p && p.status === 'closed' ? 'งวดนี้ปิดแล้ว — ลงรายการใหม่ไม่ได้' : 'ปิดงวดได้เมื่อรายการที่บล็อกผ่านครบ',
    actions: p && p.status === 'closed'
      ? btn('reopen:period', 'ขอเปิดงวดใหม่')
      : btn('close:period', 'ปิดงวดนี้', chk.canClose ? 'primary' : 'disabled'),
    body: '<ul class="todo big">' + rows + '</ul>',
    foot: p && p.status === 'closed'
      ? 'การเปิดงวดที่ปิดแล้วต้องระบุเหตุผล และระบบจะบันทึกไว้ในร่องรอยการตรวจสอบ'
      : (chk.canClose ? 'พร้อมปิดงวด — ตรวจครบทุกข้อแล้ว'
                      : 'ยังปิดไม่ได้: ' + chk.items.filter((i) => i.blocking && !i.ok).map((i) => i.label).join(' · ')),
  })
  + card({ title:'สถานะงวดทั้งปี', sub:'รอบบัญชี ' + DB.company.fiscalYear + ' · ' + DB.periods.length + ' งวด',
      /* เปิดปีถัดไปได้เมื่อเหลือไม่ถึงสามเดือนก่อนถึงงวดสุดท้าย กันกดเปิดปีล่วงหน้าไปไกลโดยไม่ตั้งใจ */
      actions: btn('newyear', '+ เปิดงวดปีบัญชีถัดไป',
        DB.periods.slice().sort((a, b) => a.start < b.start ? -1 : 1).pop().start <= addDays(TODAY, 92) ? '' : 'disabled'),
      body: '<div class="periods">' + DB.periods.map((x) =>
        '<button class="pchip ' + x.status + (x.code === STATE.period ? ' on' : '') + '" data-act="period:' + x.code + '">'
        + esc(thPeriod(x.code)) + '<span>' + (x.status === 'closed' ? 'ปิดแล้ว' : 'เปิดอยู่') + '</span></button>').join('')
        + '</div>',
      foot: 'ปิดแล้ว ' + closedList.length + ' งวด จาก ' + DB.periods.length + ' งวด · ข้ามปีได้โดยไม่ต้องลงรายการปิดบัญชี '
        + 'เพราะงบแสดงฐานะการเงินรวมกำไรของทุกปีก่อนหน้าเข้ากำไรสะสมให้เอง · ภาษีหัก ณ ที่จ่ายเดือนธันวาคม ระบบเปิดงวดปีถัดไปให้อัตโนมัติตอนยื่นแบบ' });
}

function scLedger() {
  const code = STATE.drill || accBySub('bank');
  const a = acc(code);
  const from = pStart(), to = pEnd();
  let bal = balanceOf(code, addDays(from, -1));
  const opening = bal;
  const rows = [];
  DB.entries.filter((e) => LIVE(e) && e.date >= from && e.date <= to)
    .slice().sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : 0))
    .forEach(function (e) {
      e.lines.forEach(function (l) {
        if (l.acc !== code) return;
        bal += l.dr - l.cr;
        rows.push([thDateNum(e.date), {mono:e.no}, e.desc, l.partner || '', {n:l.dr}, {n:l.cr}, {n:bal}]);
      });
    });
  const opts = DB.accounts.filter((x) => x.postable)
    .map((x) => '<option value="' + x.code + '"' + (x.code === code ? ' selected' : '') + '>'
      + esc(x.code + ' ' + x.name) + '</option>').join('');
  return card({
    title:'บัญชีแยกประเภท', sub: a.code + ' ' + a.name + ' · ' + thPeriod(STATE.period),
    filters: '<select id="accSel" class="search">' + opts + '</select>',
    body: '<div class="reco"><div><span>ยอดยกมา</span><b>' + fmt(opening) + '</b></div>'
      + '<div class="gt"><span>ยอดยกไป</span><b>' + fmt(bal) + '</b></div></div>'
      + tbl({

function nextMonthDay(period, day) {
  let [y, m] = period.split('-').map(Number);
  m += 1; if (m > 12) { m = 1; y += 1; }
  return y + '-' + String(m).padStart(2, '0') + '-' + String(day).padStart(2, '0');
}

function vatRegister(kind) {
  const isOut = kind === 'vat_output';
  /* เอกสารที่ยกเลิกยังต้องอยู่ในรายงานภาษี ยอดเป็นศูนย์และเขียนว่า "ยกเลิก" เลขที่จะได้เรียงต่อกันไม่ขาดช่วง */
  const rows = DB.taxTx.filter((t) => t.kind === kind && t.period === STATE.period);
  const voided = rows.filter((t) => t.void).length;
  const base = rows.reduce((s, t) => s + t.base, 0);
  const tax  = rows.reduce((s, t) => s + t.tax, 0);
  const nonClaim = rows.reduce((s, t) => s + (t.nonClaimable || 0), 0);
  return card({
    title: isOut ? 'รายงานภาษีขาย' : 'รายงานภาษีซื้อ',
    sub: thPeriod(STATE.period) + ' · ' + (rows.length - voided) + ' รายการ'
      + (voided ? ' · ยกเลิก ' + voided + ' ใบ' : '') + ' · '
      + (isOut ? 'ตามมาตรา 87 (1)' : 'ตามมาตรา 87 (2)'),
    actions: btn('print', 'พิมพ์'),
    body: tbl({
      cols:[{t:'ลำดับ',a:'c'},{t:'วันที่'},{t:'เลขที่ใบกำกับ'},{t:'ชื่อผู้' + (isOut ? 'ซื้อ' : 'ขาย')},
        {t:'เลขประจำตัวผู้เสียภาษี'},{t:'สาขา'},{t:'มูลค่า',a:'r'},{t:'ภาษี',a:'r'}]
        .concat(isOut ? [] : [{t:'หมายเหตุ'}]),
      rows: rows.map((t, i) => [{c:String(i + 1)}, thDateNum(t.date), {mono:t.docNo},
        t.void ? {html: esc(t.partnerName) + ' <span class="st void">ยกเลิก</span>'}
          : t.partnerName + (t.docType === 'credit_note' ? ' (ใบลดหนี้อ้าง ' + t.refDoc + ')' : '')
            + (t.docType === 'debit_note' ? ' (ใบเพิ่มหนี้อ้าง ' + t.refDoc + ')' : ''),
        {mono:t.taxId}, t.branch === '00000' ? 'สนญ.' : (t.branch || '—'),
        {n:t.base}, {n:t.tax}]
        .concat(isOut ? [] : [t.void ? {dim:'ยกเลิก: ' + (t.voidReason || '')}
          : t.nonClaimable ? {dim:'ภาษีต้องห้าม ' + fmt(t.nonClaimable)} : {dim:'ขอคืนได้'}])),
      foot: ['','','','รวม','','', {n:base}, {n:tax}].concat(isOut ? [] : ['']),
      empty:'ไม่มีรายการในงวดนี้',
    }),
    foot: isOut
      ? 'ยอดนี้ต้องตรงกับบัญชีภาษีขายในงบทดลองเสมอ ระบบตรวจให้ทุกครั้งในหน้าแดชบอร์ด'
      : (nonClaim ? 'มีภาษีซื้อต้องห้าม ' + fmt(nonClaim) + ' บาท ที่ไม่นำไปหักในแบบ ภ.พ.30 และบันทึกเป็นค่าใช้จ่ายแล้ว'
                  : 'ภาษีซื้อทั้งหมดในงวดนี้ขอคืนได้'),
  });
}

function scPp30() {
  const f = DB.docs.filing.find((x) => x.form === 'PP30' && x.period === STATE.period);
  const out = DB.taxTx.filter((t) => t.kind === 'vat_output' && t.period === STATE.period && !t.void);
  const inn = DB.taxTx.filter((t) => t.kind === 'vat_input' && t.period === STATE.period && !t.void);
  const outTax = f ? f.outTax : out.reduce((s, t) => s + t.tax, 0);
  const inTax  = f ? f.inTax  : inn.reduce((s, t) => s + t.tax, 0);
  const outBase = f ? f.outBase : out.reduce((s, t) => s + t.base, 0);
  const inBase  = f ? f.inBase  : inn.reduce((s, t) => s + t.base, 0);
  const payable = outTax - inTax;
  const due = nextMonthDay(STATE.period, 15);
  const dueE = nextMonthDay(STATE.period, 23);

  const line = (n, label, v, cls) =>
    '<tr class="' + (cls || '') + '"><td class="ctr dim">' + n + '</td><td>' + esc(label)
    + '</td><td class="num' + (v < 0 ? ' neg' : '') + '">' + fmt(v) + '</td></tr>';

  return card({
    title:'แบบแสดงรายการภาษีมูลค่าเพิ่ม ภ.พ.30',

    body: '<div class="scroll"><table class="fs"><tbody>'
      + '<tr class="fs-h"><td colspan="3">ยอดขายและภาษีขาย</td></tr>'
      + line(1, 'ยอดขายในเดือนนี้', outBase + (f ? f.outZero : 0))
      + line(2, 'ยอดขายที่เสียภาษีอัตราร้อยละ 0', f ? f.outZero : 0)
      + line(4, 'ยอดขายที่ต้องเสียภาษี', outBase)
      + line(5, 'ภาษีขายเดือนนี้', outTax, 'fs-s')
      + '<tr class="fs-h"><td colspan="3">ยอดซื้อและภาษีซื้อ</td></tr>'
      + line(6, 'ยอดซื้อที่มีสิทธินำภาษีซื้อมาหัก', inBase)

      + '</tbody></table></div>'
      + '<div class="reco">'
      + '<div><span>กำหนดยื่นแบบกระดาษ</span><b>' + thDate(due) + '</b></div>'
      + '<div><span>กำหนดยื่นผ่านอินเทอร์เน็ต (ขยาย 8 วัน)</span><b>' + thDate(dueE) + '</b></div>'

function scBudget() {
  const from = pStart(), to = pEnd();
  const yFrom = yStart();
  const months = Number(STATE.period.slice(5, 7));
  const rows = DB.budget.map(function (b) {
    const actual = Math.abs(balanceOf(b.account, to, from));
    const ytdActual = Math.abs(balanceOf(b.account, to, yFrom));
    const ytdBudget = b.monthly * months;
    return { ...b, actual, variance: b.monthly - actual, ytdActual, ytdBudget, ytdVariance: ytdBudget - ytdActual };
  });
  const sum = (f) => rows.reduce((s, r) => s + r[f], 0);
  return card({
    title:'งบประมาณเทียบใช้จริง', sub: thPeriod(STATE.period) + ' และสะสม ' + months + ' เดือน',
    body: tbl({
      cols:[{t:'รหัส'},{t:'รายการ'},{t:'งบเดือนนี้',a:'r'},{t:'ใช้จริงเดือนนี้',a:'r'},{t:'ผลต่าง',a:'r'},
        {t:'งบสะสม',a:'r'},{t:'ใช้จริงสะสม',a:'r'},{t:'ผลต่างสะสม',a:'r'}],
      rows: rows.map((r) => [{mono:r.account}, r.name, {n:r.monthly}, {n:r.actual},
        {n:r.variance, cls: r.variance < 0 ? 'bad' : 'good'},
        {n:r.ytdBudget}, {n:r.ytdActual},
        {n:r.ytdVariance, cls: r.ytdVariance < 0 ? 'bad' : 'good'}]),
      foot: ['','รวม', {n:sum('monthly')}, {n:sum('actual')}, {n:sum('variance')},
        {n:sum('ytdBudget')}, {n:sum('ytdActual')}, {n:sum('ytdVariance')}],
    }),
    foot:'ผลต่างเป็นบวกคือใช้ต่ำกว่างบ เป็นลบคือใช้เกินงบ ตัวเลขใช้จริงดึงจากบัญชีแยกประเภทโดยตรง ไม่ได้กรอกซ้ำ',
  });
}

  const nextLabel = cfg.next === 'salesOrder' ? 'แปลงเป็นใบสั่งขาย'

    title: cfg.label + ' เลขที่ ' + d.no,

      + (d.validUntil ? ' · ยืนราคาถึง ' + thDate(d.validUntil) : '')
      + (d.fromDoc ? ' · มาจาก ' + d.fromDoc : ''),
    actions: ((live || partial) && kind === 'purchaseOrder' ? btn('grn:po:' + d.no, partial ? 'รับสินค้าส่วนที่เหลือ' : 'รับสินค้าเข้าคลัง', 'primary') : '')
      + (live ? btn('trade:' + kind + ':convert:' + d.no, nextLabel, kind === 'purchaseOrder' ? '' : 'primary') : '')

          kind === 'purchaseOrder' ? 'ผู้ขายยืนยันแล้ว' : 'ลูกค้าตอบรับ') : '')

      + '<div><div class="dim">สถานะ</div><b>' + esc(tradePill(st).st[1]) + '</b>'

      + (d.statusReason ? '<div>' + esc(d.statusReason) + '</div>' : '') + '</div>'
      + '</div>'
      + tbl({
          cols:[{t:'รายการ'},{t:'จำนวน',a:'r'}].concat(got ? [{t:'รับแล้ว',a:'r'},{t:'ค้างรับ',a:'r'}] : [])
            .concat([{t:'ราคาต่อหน่วย',a:'r'},{t:'ภาษี'},{t:'จำนวนเงิน',a:'r'}]),
          rows: d.lines.map((l, i) => [l.desc, {n:M(String(l.qty))}]
            .concat(got ? [{n:M(String(got[i]))}, {n:M(String(roundQty(l.qty - got[i])))}] : [])

  });
}

function scPaymentPrep() {
  const all = DB.docs.paymentBatch;
  const rows = all.filter((b) => hit(b.no) || b.items.some((i) => hit(i.partnerName) || hit(i.billNo)));
  const pending = all.filter((b) => b.status === 'pending_approval');
  const approved = all.filter((b) => b.status === 'approved');
  const inBatch = new Set();
  all.filter(paymentBatchActive).forEach((b) => b.items.forEach((i) => inBatch.add(i.billNo)));
  const due = DB.docs.bill.filter((b) => billOutstanding(b) > 0 && !inBatch.has(b.no))
    .sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : 0));
  return (STATE.sel ? paymentBatchDetail(STATE.sel) : '')
    + card({
      title:'เตรียมจ่ายเงิน',
      sub:'รออนุมัติ ' + pending.length + ' ใบ · อนุมัติแล้วรอจ่าย ' + approved.length + ' ใบ · เงินที่ต้องเตรียม '
        + fmt(pending.concat(approved).reduce((s, b) => s + b.net, 0)) + ' บาท',
      actions: btn('new:paymentbatch', '+ จัดทำใบเตรียมจ่าย', 'primary'),
      filters: searchBox('ค้นหาเลขที่ ผู้ขาย หรือรายการตั้งหนี้'),
      body: tbl({
        cols:[{t:'เลขที่'},{t:'วันที่จัดทำ'},{t:'กำหนดจ่าย'},{t:'ผู้ขาย',a:'c'},{t:'ยอดตั้งหนี้',a:'r'},{t:'หัก ณ ที่จ่าย',a:'r'},{t:'จ่ายสุทธิ',a:'r'},{t:'สถานะ'}],
        rows: rows.map((b) => [{mono:b.no}, thDateNum(b.date), thDateNum(b.payDate), {c:String(b.items.length)},

    body:(DB.isDemo ? '<div class="note warn">ตอนนี้ระบบยังใช้ข้อมูลตัวอย่างอยู่ '

      + '<div class="prose"><p>ก่อนย้ายข้อมูลจริงเข้ามา ควรเริ่มจากบริษัทเปล่าก่อน '
      + 'ไม่งั้นตัวเลขของคุณจะปนกับข้อมูลตัวอย่างที่ระบบสร้างไว้ให้ลอง '
      + 'และยอดคุมจะไม่มีทางตรง</p>'
      + '<p class="dim">ตอนนี้กำลังใช้ข้อมูลของ <b>' + esc(DB.company.name) + '</b> '
      + 'มีใบสำคัญ ' + DB.entries.length + ' ใบ · ใบกำกับภาษี ' + DB.docs.invoice.length + ' ฉบับ</p></div>',

  });

  /* ประวัติการนำเข้า — ต้องเห็นและย้อนกลับได้ ไม่งั้นนำเข้าผิดแล้วไปต่อไม่ถูก */

  const history = past.length ? card({
    title:'สิ่งที่นำเข้าไปแล้ว',
    sub:'นำเข้าผิดก็ยกเลิกได้ ระบบจะกลับรายการให้ตามกฎหมาย แล้วนำเข้าใหม่ได้ทันที',

        + '→ กดแสดงผลรายงาน → <b>ดาวน์โหลด Excel</b></p>'
        + (isLedger
            ? '<p class="dim">เก็บไฟล์บัญชีแยกประเภทไว้ได้ ใช้ตรวจย้อนกลับตอนยอดไม่ตรงว่ารายการไหนทำให้ต่าง</p>'

    let h = '<option value="">— ไม่ใช้ —</option>';
    for (let i = 0; i < width; i++) {
      const label = String(head[i] === undefined ? '' : head[i]).trim();
      const sample = sampleOf(i);
      h += '<option value="' + i + '"' + (String(i) === String(sel) ? ' selected' : '') + '>'
        + esc(colLetter(i) + ' · ' + (label || '(ไม่มีหัวคอลัมน์)')
          + (sample ? ' — เช่น ' + sample : '')) + '</option>';
    }
    return h;
  };
  const rowOpts = function () {
    let h = '';
    const n = Math.min(IMP.rows.length, 30);
    for (let i = 0; i < n; i++) {
      const txt = IMP.rows[i].map((c) => String(c || '').trim()).filter(Boolean).join(' | ');
      h += '<option value="' + i + '"' + (i === IMP.headerRow ? ' selected' : '') + '>'
        + esc('แถวที่ ' + (i + 1) + ': ' + (txt.length > 60 ? txt.slice(0, 60) + '…' : txt || '(แถวว่าง)'))
        + '</option>';
    }
    return h;
  };
  /* ตารางดิบให้เห็นหน้าตาไฟล์จริง ๆ พร้อมตัวอักษรคอลัมน์เหมือนใน Excel */
  const rawGrid = function () {
    const n = Math.min(IMP.rows.length, 12);
    let h = '<div class="scroll"><table class="grid"><thead><tr><th></th>';
    for (let i = 0; i < width; i++) h += '<th>' + colLetter(i) + '</th>';
    h += '</tr></thead><tbody>';
    for (let i = 0; i < n; i++) {
      h += '<tr' + (i === IMP.headerRow ? ' class="hd"' : '') + '><th>' + (i + 1) + '</th>';
      for (let j = 0; j < width; j++) {
        const v = String(IMP.rows[i][j] === undefined ? '' : IMP.rows[i][j]).trim();
        h += '<td>' + esc(v.length > 22 ? v.slice(0, 22) + '…' : v) + '</td>';
      }
      h += '</tr>';
    }
    return h + '</tbody></table></div>';
  };

  const preview = IMP.tb ? previewOpening(IMP.tb.rows, IMP.overrides || {}) : null;
  const readCount = IMP.tb ? IMP.tb.rows.length : 0;
  const mode = IMP.mode || 'opening';
  const pairs = IMP.pairs || [];
  const curPair = pairs.find((pr) => pr.debit === IMP.map.debit && pr.credit === IMP.map.credit);
  /* คำเตือนที่ตรงกับสิ่งที่ผู้ใช้กำลังจะทำ ไม่ใช่คำอธิบายรวม ๆ ที่อ่านแล้วยังไม่รู้ว่าต้องทำอะไร */
  const looksCumulative = !!(curPair && /สะสม|คงเหลือ|balance/i.test(curPair.label));
  const modeNote = mode === 'movement'
    ? '<div class="note' + (looksCumulative ? ' warn' : '') + '">'
      + (looksCumulative
          ? '<b>ชุดที่เลือกอยู่คือยอดสะสม ไม่ใช่ยอดของเดือนเดียว</b> ถ้าลงเป็นยอดเคลื่อนไหว '
            + 'ตัวเลขจะถูกนับซ้ำกับเดือนก่อนหน้า — ให้เลือกชุด <b>ยอดประจำงวด</b> แทน'
          : 'ไฟล์ที่ใช้ต้องเป็นงบทดลองที่ดึงมา<b>เฉพาะเดือนนั้นเดือนเดียว</b> '
            + '(ตั้งช่วงเวลาใน FlowAccount เป็นวันที่ 1 ถึงวันสิ้นเดือน) ถ้าใช้ไฟล์รายปี '
            + 'ตัวเลขทั้งปีจะไปกองอยู่เดือนเดียว')
      + '</div>'
    : '<div class="note">ยอดยกมาลงใบสำคัญ<b>ใบเดียว</b> ณ วันตัดยอด ใช้ชุด<b>ยอดสะสมหรือยอดคงเหลือ</b> '
      + 'เหมาะกับการเริ่มใช้ระบบ ถ้าอยากให้งบกำไรขาดทุน<b>รายเดือน</b>ของปีนี้ถูกต้องด้วย '
      + 'ให้เปลี่ยนเป็นแบบยอดเคลื่อนไหวแล้วนำเข้าเดือนละไฟล์</div>';

  const step2 = card({
    title: IMP.needsMapping ? 'บอกระบบหน่อยว่าคอลัมน์ไหนคืออะไร' : 'ตรวจไฟล์ก่อนนำเข้า',
    sub: esc(IMP.name) + ' · ' + IMP.rows.length + ' แถว · '
      + (readCount ? 'อ่านบัญชีที่มียอดได้ ' + readCount + ' บัญชี' : 'ยังอ่านบัญชีไม่ได้'),
    actions: btn('imp:reset', 'เลือกไฟล์ใหม่'),
    body:(IMP.needsMapping
        ? '<div class="note warn">ระบบเดาหัวตารางเองไม่ได้ แต่ไม่ต้องแก้ไฟล์ '
          + 'ดูตารางข้างล่างว่าคอลัมน์ไหนคือรหัสบัญชี ชื่อบัญชี เดบิต เครดิต '
          + 'แล้วเลือกตัวอักษรคอลัมน์ให้ตรงกัน — เลือกเสร็จตัวเลขจะขึ้นให้ตรวจทันที</div>'
        : '')
      + '<div class="sub-h">หน้าตาไฟล์จริง 12 แถวแรก (แถวที่ระบายสีคือหัวตาราง)</div>'
      + rawGrid()
      + '<div class="flds">'
      + '<div class="fld-w"><label for="impMode">จะนำตัวเลขชุดนี้เข้าเป็นอะไร</label>'
        + '<select id="impMode">'
        + '<option value="opening"' + (mode === 'opening' ? ' selected' : '') + '>'
          + 'ยอดยกมา — ตั้งต้นครั้งเดียว ณ วันตัดยอด</option>'
        + '<option value="movement"' + (mode === 'movement' ? ' selected' : '') + '>'
          + 'ยอดเคลื่อนไหวของเดือนเดียว — ลงเดือนละไฟล์</option>'
        + '</select></div>'
      + (pairs.length > 1
          ? '<div class="fld-w"><label for="impPair">ใช้ตัวเลขชุดไหนในไฟล์</label>'
            + '<select id="impPair">'
            + pairs.map((pr, i) => '<option value="' + i + '"'
                + (pr.debit === IMP.map.debit && pr.credit === IMP.map.credit ? ' selected' : '') + '>'
                + esc(pr.label) + ' (คอลัมน์ ' + colLetter(pr.debit) + '/' + colLetter(pr.credit) + ')'
                + '</option>').join('')
            + '</select></div>'
          : '')
      + (mode === 'movement'
          ? field({ name:'impPeriod', label:'ตัวเลขชุดนี้เป็นของเดือนไหน', type:'select',
              value: IMP.period || STATE.period,
              options: DB.periods.map((pd) => [pd.code, thPeriod(pd.code)
                + (pd.status === 'open' ? '' : ' (ปิดแล้ว)')]),
              hint:'ระบบจะลงใบสำคัญวันสิ้นเดือนของเดือนนี้' })
          : field({ name:'cutoff', label:'วันตัดยอด (ยอดยกมาจะลงบัญชีวันนี้)', type:'date',
              value: IMP.cutoff || pStart(), hint:'ต้องอยู่ในงวดที่ยังเปิดอยู่' }))
      + '</div>'
      /* เดาไม่ออกหรืออ่านไม่ได้สักบรรทัด ต้องกางช่องเลือกคอลัมน์ให้เห็นทันที
         ไม่ใช่ซ่อนไว้ใต้หัวข้อที่ผู้ใช้ไม่รู้ว่าต้องกด */
      + '<details class="adv"' + (IMP.needsMapping || !readCount ? ' open' : '')
      + '><summary>เลือกคอลัมน์เองทีละช่อง (ปกติไม่ต้องแตะ)</summary>'
      + '<div class="flds">'
      + '<div class="fld-w"><label for="impHeaderRow">หัวตารางอยู่แถวไหน</label>'
        + '<select id="impHeaderRow">' + rowOpts() + '</select></div>'
      + '<div class="fld-w"><label for="c_code">คอลัมน์รหัสบัญชี</label><select id="c_code" class="impcol" data-k="code">' + colOpts(IMP.map.code) + '</select></div>'
      + '<div class="fld-w"><label for="c_name">คอลัมน์ชื่อบัญชี</label><select id="c_name" class="impcol" data-k="name">' + colOpts(IMP.map.name) + '</select></div>'
      + '<div class="fld-w"><label for="c_debit">คอลัมน์เดบิต</label><select id="c_debit" class="impcol" data-k="debit">' + colOpts(IMP.map.debit) + '</select></div>'
      + '<div class="fld-w"><label for="c_credit">คอลัมน์เครดิต</label><select id="c_credit" class="impcol" data-k="credit">' + colOpts(IMP.map.credit) + '</select></div>'
      + '</div></details>'
      + modeNote
      + '<div class="sub-h">ตัวอย่าง 8 แถวแรกที่อ่านได้</div>'
      + tbl({
          cols:[{t:'รหัส'},{t:'ชื่อบัญชี'},{t:'เดบิต',a:'r'},{t:'เครดิต',a:'r'},{t:'จับคู่กับ'}],
          rows: (IMP.tb ? IMP.tb.rows.slice(0, 8) : []).map(function (r) {
            const t = (IMP.overrides || {})[r.code || r.name] || matchAccount(r.code, r.name);
            return [{mono:r.code}, r.name, {n:r.debit}, {n:r.credit},
              t ? {dim: t + ' ' + acc(t).name} : {st:['late','ยังไม่จับคู่']}];
          }),
          empty:'ยังอ่านบรรทัดที่มียอดไม่ได้ — เลือกคอลัมน์ให้ตรงกับตารางข้างบนก่อน',
        })
      + (IMP.tb && IMP.tb.skipped.length
          ? '<div class="note">ข้ามไป ' + IMP.tb.skipped.length + ' แถว: '
            + esc(IMP.tb.skipped.slice(0, 4).map((s) => 'แถว ' + s.line + ' (' + s.why + ')').join(', '))
            + (IMP.tb.skipped.length > 4 ? ' และอื่น ๆ' : '') + '</div>'
          : ''),
  });

  if (!preview) return step1 + step2 + history + blank;

  /* ตัวเลือกบรรทัดงบสำหรับบัญชีที่จะสร้างใหม่ จัดกลุ่มตามบรรทัดงบให้เลือกง่าย */
  const fsOpts = (function () {
    const list = fsChoices();
    let h = '', group = null;
    list.forEach(function (o) {
      if (o.group !== group) {
        if (group !== null) h += '</optgroup>';
        h += '<optgroup label="' + esc(o.group) + '">';
        group = o.group;
      }
      h += '<option value="+' + esc(o.sub) + '">' + esc(o.label) + '</option>';
    });
    return h + (group !== null ? '</optgroup>' : '');
  })();
  const fsSelect = (key, sub) =>
    '<select class="impmap" data-key="' + esc(key) + '">'
    + fsOpts.replace('value="+' + esc(sub) + '"', 'value="+' + esc(sub) + '" selected')
    + '<optgroup label="หรือรวมเข้าบัญชีที่ระบบมีอยู่แล้ว">'
    + DB.accounts.filter((a) => a.postable && !a.imported)
        .map((a) => '<option value="' + a.code + '">' + esc(a.code + ' ' + a.name) + '</option>').join('')
    + '</optgroup></select>';

  const step3 = card({
    title:'สรุปสิ่งที่จะเกิดขึ้น',
    sub: mode === 'movement'
      ? 'จะลงใบสำคัญของงวด ' + thPeriod(IMP.period || STATE.period) + ' หนึ่งใบ'
      : 'ยังไม่มีอะไรถูกบันทึกจนกว่าจะกดปุ่มนำเข้า',
    actions: btn('imp:run', mode === 'movement' ? 'ลงยอดเคลื่อนไหวของเดือนนี้' : 'นำเข้ายอดยกมา',
      preview.ready ? 'primary' : 'disabled'),
    body:'<div class="reco">'
      + '<div><span>บัญชีที่ตรงกับผังของระบบ</span><b>' + preview.matched.length + ' บัญชี</b></div>'
      + '<div><span>บัญชีที่จะสร้างใหม่ตามรหัสเดิม</span><b>' + preview.creating.length + ' บัญชี</b></div>'
      + '<div><span>บัญชีที่ยังจับคู่ไม่ได้</span><b class="' + (preview.unmatched.length ? 'neg' : '') + '">'
        + preview.unmatched.length + ' บัญชี</b></div>'
      + '<div><span>เดบิตรวม</span><b>' + fmt(preview.totalDr) + '</b></div>'
      + '<div><span>เครดิตรวม</span><b>' + fmt(preview.totalCr) + '</b></div>'
      + '<div class="gt"><span>ผลต่าง</span><b class="' + (preview.balanced ? '' : 'neg') + '">'
        + fmt(preview.diff) + '</b></div></div>'
      + (preview.creating.length
          ? '<div class="sub-h">บัญชีที่ระบบจะสร้างใหม่ให้ โดยใช้รหัสและชื่อเดิมของคุณ</div>'
            + '<div class="note">ระบบเดาให้แล้วว่าบัญชีแต่ละตัวควรอยู่บรรทัดไหนของงบการเงิน '
            + 'ไล่ดูให้ครบ ถ้าตัวไหนไม่ถูกให้เปลี่ยนในช่องขวาสุด</div>'
            + tbl({
                cols:[{t:'รหัสเดิม'},{t:'ชื่อบัญชี'},{t:'เดบิต',a:'r'},{t:'เครดิต',a:'r'},{t:'จะไปอยู่บรรทัดงบ'}],
                rows: preview.creating.map((r) => [{mono:r.code}, r.name, {n:r.debit}, {n:r.credit},
                  {html: '<div class="dim" style="margin-bottom:4px">' + esc(r.fsLine || '—') + '</div>'
                    + fsSelect(r.code || r.name, r.subType)}]),
              })
          : '')
      + (preview.unmatched.length
          ? '<div class="sub-h">เลือกบัญชีปลายทางให้ครบก่อนนำเข้า</div>'
            + tbl({
                cols:[{t:'รหัสเดิม'},{t:'ชื่อบัญชีเดิม'},{t:'เดบิต',a:'r'},{t:'เครดิต',a:'r'},{t:'ลงบัญชีของเราที่'}],
                rows: preview.unmatched.map((r) => [{mono:r.code}, r.name, {n:r.debit}, {n:r.credit},
                  {html:'<select class="impmap" data-key="' + esc(r.code || r.name) + '">' + accOptions + '</select>'}]),
              })
          : '')
      + (preview.balanced ? '' : '<div class="note warn">เดบิตรวมไม่เท่ากับเครดิตรวม '
          + 'มักเกิดจากเลือกคอลัมน์ผิดคู่ — งบทดลองมักมีทั้งคู่ยอดยกมา คู่เคลื่อนไหว และคู่ยอดคงเหลือ '
          + 'ให้เลือกคู่ยอดคงเหลือปลายงวด</div>'),
    foot: preview.ready
      ? 'ระบบจะสร้างใบสำคัญ "ยอดยกมา" หนึ่งใบ ลงวันที่ตามที่เลือก แก้ไม่ได้ ถ้าผิดต้องกลับรายการ'
        + (preview.creating.length ? ' · บัญชีที่สร้างใหม่จะเข้าไปอยู่ในผังบัญชีถาวร' : '')
      : 'ยังนำเข้าไม่ได้ — ' + (!preview.balanced ? 'งบทดลองไม่สมดุล' : 'ยังจับคู่บัญชีไม่ครบ'),
  });

  return step1 + step2 + step3 + history + blank;
}

function scImportResult() {
  const r = STATE.impResult;
  if (!r) { STATE.screen = 'import'; return scImport(); }
  return card({
    title:'นำเข้าข้อมูลเรียบร้อย',
    sub:'จากระบบ ' + r.source + ' ตัดยอด ณ ' + thDate(r.cutoff),
    actions: btn('go:tb', 'ดูงบทดลอง', 'primary') + btn('go:import', 'นำเข้าไฟล์อื่นต่อ'),
    body: kpi([
      { label:'คู่ค้าที่เพิ่มใหม่', value: r.partners + ' / ' + r.partnersSeen + ' ราย' },
      { label:'สินค้าที่เพิ่มใหม่', value: r.items + ' / ' + r.itemsSeen + ' รายการ' },
      { label:'พนักงานที่เพิ่มใหม่', value: (r.employees || 0) + ' / ' + (r.employeesSeen || 0) + ' คน' },
      { label:'ลูกหนี้ค้างยกมา', value: r.invoices + ' ใบ' },
      { label:'เจ้าหนี้ค้างยกมา', value: r.bills + ' รายการ' },
    ])
    + (r.opening ? '<div class="reco"><div><span>ใบสำคัญยอดยกมา</span><b>' + esc(r.opening.entry.no) + '</b></div>'
        + '<div><span>จำนวนบัญชี</span><b>' + r.opening.accounts + '</b></div>'
        + (r.opening.created ? '<div><span>บัญชีที่สร้างใหม่ตามผังเดิม</span><b>'
            + r.opening.created + '</b></div>' : '')
        + '<div class="gt"><span>ยอดรวมด้านเดบิต</span><b>' + fmt(r.opening.total) + '</b></div></div>' : '')
    + '<div class="sub-h">ตรวจยอดคุมหลังนำเข้า</div>'
    + '<ul class="checks">' + r.checks.map((c) =>
        '<li><span class="dot ' + (c.ok ? 'good' : 'bad') + '"></span>' + esc(c.label)
        + (c.why ? '<span class="why-note">' + esc(c.why) + '</span>' : '')
        + '<span class="grow"></span><span class="' + (c.ok ? 'dim' : 'neg') + '">'
        + (c.ok ? 'ตรงกัน' : 'ต่าง ' + fmt(c.control - c.sub)) + '</span></li>').join('') + '</ul>'
    + ((r.coverage && r.coverage.length)
        ? '<div class="sub-h">ความครบถ้วนของแต่ละชุดข้อมูลที่ดึงมา</div>'
          + tbl({
              cols:[{t:'ชุดข้อมูล'},{t:'อ่านได้',a:'r'},{t:'ยกมาเป็นยอดค้าง',a:'r'},
                {t:'ปิดแล้วไม่ยกมา',a:'r'},{t:'ซ้ำ',a:'r'},{t:'แปลงไม่ได้',a:'r'},{t:'หมายเหตุ'}],
              rows: r.coverage.map((c) => [c.source, {c:String(c.rows)}, {c:String(c.open)},
                {c:String(c.closed)}, {c:String(c.duplicate)},
                c.error ? {st:['late', String(c.error)]} : {c:'0'},
                {dim: c.note || ''}]),
            })
          + '<div class="note">แถวที่ "ปิดแล้วไม่ยกมา" คือเอกสารที่ชำระครบก่อนวันตัดยอด '
          + 'ยอดของมันรวมอยู่ในงบทดลองแล้ว จึงไม่ต้องยกมาเป็นรายใบซ้ำอีก</div>'
        : '')
    + (r.warnings.length
        ? '<div class="sub-h">ข้อสังเกตจากตัวดึงข้อมูล (' + r.warnings.length + ')</div>'
          + tbl({ cols:[{t:'เอกสาร'},{t:'เรื่อง'}],
                  rows: r.warnings.slice(0, 50).map((w) => [{mono:w.doc || '—'}, w.message || String(w)]) })
        : ''),
    foot: r.allPassed
      ? 'ยอดคุมผ่านครบทุกข้อ ข้อมูลที่ย้ายมาสอดคล้องกันทั้งบัญชีคุมและบัญชีย่อย'
      : (r.checks.some((c) => !c.ok && c.why)
          ? 'ข้อที่ยังไม่ตรงพร้อมคำอธิบายข้างบน เป็นเรื่องที่คาดไว้เมื่อยกมาแต่ยอดรวม '
            + 'ระบบจะไม่ยอมให้ปิดงวดจนกว่าจะนำเอกสารค้างเข้ามาครบ'
          : 'มียอดคุมที่ยังไม่ตรง — แปลว่าย้ายมาไม่ครบ ตรวจรายการข้างต้นก่อนใช้งานจริง'),
  });
}


/* ===== ui-print.js ===== */
/* ===================================================================

function pHead(title, en, copy) {
  const c = DB.company;
  return '<div class="p-head"><div class="p-co"><b>' + esc(c.name) + '</b>'
    + (c.nameEn ? '<div>' + esc(c.nameEn) + '</div>' : '')
    + '<div>' + esc(c.address || '') + '</div>'
    + '<div>เลขประจำตัวผู้เสียภาษี ' + esc(c.taxId || '—') + ' · ' + esc(c.branchName || branchLabel(c.branch))
    + (c.phone ? ' · โทร ' + esc(c.phone) : '') + '</div></div>'
    + '<div class="p-title"><h1>' + esc(title) + '</h1>'
    + (en ? '<div class="en">' + esc(en) + '</div>' : '')
    + (copy ? '<div class="p-copy">' + esc(copy) + '</div>' : '') + '</div></div>';
}
function pParty(label, p) {
  p = p || {};
  return '<div class="p-box"><div class="lb">' + esc(label) + '</div>'
    + '<div><b>' + esc(p.name || '—') + '</b></div>'
    + (p.address ? '<div>' + esc(p.address) + '</div>' : '')
    + '<div>เลขประจำตัวผู้เสียภาษี ' + esc(p.taxId || '—')
    + (p.entityType === 'individual' && !p.branch ? '' : ' · ' + esc(branchLabel(p.branch))) + '</div></div>';
}
function pInfo(rows) {
  return '<div class="p-box"><div class="p-kv">'
    + rows.filter((r) => r && r[1] !== undefined && r[1] !== null && r[1] !== '')
      .map((r) => '<span>' + esc(r[0]) + '</span><div>' + esc(r[1]) + '</div>').join('')
    + '</div></div>';
}
/** ตารางรายการ — เติมบรรทัดว่างให้ครบ แบบฟอร์มจะได้หน้าตาเหมือนกันทุกใบ */
function pTable(cols, rows, minRows) {
  let h = '<table><thead><tr>' + cols.map((c) => '<th' + (c.w ? ' style="width:' + c.w + '"' : '') + '>'
    + esc(c.t) + '</th>').join('') + '</tr></thead><tbody>';
  rows.forEach(function (r) {
    h += '<tr>' + r.map((v, i) => (cols[i].n ? '<td class="num">' + (v === '' ? '' : esc(v)) + '</td>'
      : '<td' + (cols[i].c ? ' style="text-align:center"' : '') + '>' + esc(v) + '</td>')).join('') + '</tr>';
  });
  for (let i = rows.length; i < (minRows || 0); i++) h += '<tr>' + cols.map(() => '<td>&nbsp;</td>').join('') + '</tr>';
  return h + '</tbody></table>';
}
function pTotals(amountForWords, sums) {
  return '<div class="p-tot"><div class="p-words">(' + esc(bahtText(amountForWords)) + ')</div><div class="p-sum">'
    + sums.map((s) => '<div' + (s[2] ? ' class="g"' : '') + '><span>' + esc(s[0]) + '</span><span>' + esc(s[1]) + '</span></div>').join('')
    + '</div></div>';
}
function pSign(list) {
  return '<div class="p-sign" style="--n:' + list.length + '">' + list.map((x) =>
    '<div>' + esc(x) + '<small>วันที่ ______/______/________</small></div>').join('') + '</div>';
}

    + thDate(TODAY) + '</span></div></div>';

const lineRows = (lines) => lines.map((l, i) => [String(i + 1), l.desc, String(l.qty), l.uom || '', pm(l.price), pm(l.amount)]);
const LINE_COLS = [{ t:'ลำดับ', w:'11mm', c:1 }, { t:'รายการ' }, { t:'จำนวน', w:'18mm', n:1 }, { t:'หน่วย', w:'16mm', c:1 },
  { t:'ราคาต่อหน่วย', w:'28mm', n:1 }, { t:'จำนวนเงิน', w:'30mm', n:1 }];

/** แยกยอดตามชนิดภาษี — ใบกำกับต้องแสดงมูลค่าที่เสียภาษี อัตรา 0 และยกเว้นแยกกัน */
function vatSplit(lines) {
  const o = { std: 0, zero: 0, exempt: 0 };
  lines.forEach((l) => { o[l.taxCode === 'VAT0' ? 'zero' : l.taxCode === 'EXEMPT' ? 'exempt' : 'std'] += l.amount; });
  return o;
}
function vatSums(d) {
  const v = vatSplit(d.lines || []);
  const out = [['รวมเงิน', pm(d.base)]];
  if (v.zero) out.push(['มูลค่าอัตราร้อยละ 0', pm(v.zero)]);
  if (v.exempt) out.push(['มูลค่าที่ได้รับยกเว้น', pm(v.exempt)]);
  out.push(['มูลค่าที่เสียภาษี', pm(v.std)]);
  out.push(['ภาษีมูลค่าเพิ่ม 7%', pm(d.vat)]);
  out.push(['จำนวนเงินรวมทั้งสิ้น', pm(d.total), true]);
  return out;
}
/** รายการบัญชีของใบสำคัญ — นักบัญชีตรวจได้ทันทีว่าลงบัญชีอะไร */
function pEntry(entryNo) {
  const e = DB.entries.find((x) => x.no === entryNo);
  if (!e) return '';
  return '<div class="p-note"><b>การบันทึกบัญชี</b> · ใบสำคัญ ' + esc(e.no) + ' (' + esc(JOURNAL_BOOKS[journalOf(e)].label) + ')</div>'
    + pTable([{ t:'รหัสบัญชี', w:'24mm', c:1 }, { t:'ชื่อบัญชี' }, { t:'เดบิต', w:'32mm', n:1 }, { t:'เครดิต', w:'32mm', n:1 }],
      e.lines.map((l) => [l.acc, acc(l.acc).name + (l.partner ? ' (' + l.partner + ')' : ''), l.dr ? pm(l.dr) : '', l.cr ? pm(l.cr) : ''])
        .concat([['', 'รวม', pm(e.total), pm(e.total)]]));
}

function adjustNote(d, copy, kind) {
  const isCN = kind === 'creditNote';
  const inv = DB.docs.invoice.find((x) => x.no === d.invoiceNo) || { lines: [] };
  /* มูลค่าก่อนใบนี้ = ใบกำกับเดิม ปรับด้วยใบลด/เพิ่มหนี้ที่ออกก่อนหน้าใบนี้ */
  const earlier = (list) => list.filter((x) => x.invoiceNo === d.invoiceNo && (x.date < d.date || (x.date === d.date && x.no < d.no)));
  const before = inv.base - earlier(DB.docs.creditNote).reduce((s, x) => s + x.base, 0)
    + earlier(DB.docs.debitNote).reduce((s, x) => s + x.base, 0);
  const correct = isCN ? before - d.base : before + d.base;
  return pSheet(pHead(isCN ? 'ใบลดหนี้' : 'ใบเพิ่มหนี้', isCN ? 'CREDIT NOTE' : 'DEBIT NOTE', copy)
    + '<div class="p-meta">' + pParty('ลูกค้า', inv.snap || { name: d.partnerName })
    + pInfo([['เลขที่', d.no], ['วันที่', thDate(d.date)], ['อ้างใบกำกับภาษี', d.invoiceNo],
      ['ลงวันที่', inv.date ? thDate(inv.date) : '']]) + '</div>'
    + '<div class="p-note" style="margin:0 0 8px"><b>เหตุที่ออก' + (isCN ? 'ใบลดหนี้ (ม.86/10)' : 'ใบเพิ่มหนี้ (ม.86/9)') + ':</b> '
    + esc(d.reasonText) + '</div>'
    + pTable([{ t:'รายการ' }, { t:'มูลค่าตามใบกำกับเดิม', w:'38mm', n:1 }, { t:'มูลค่าที่ถูกต้อง', w:'34mm', n:1 }, { t:'ผลต่าง', w:'30mm', n:1 }],
      [[(isCN ? 'ลดหนี้' : 'เพิ่มหนี้') + 'ตามใบกำกับภาษีเลขที่ ' + d.invoiceNo, pm(before), pm(correct), pm(d.base)]], 4)
    + pTotals(d.total, [['มูลค่าผลต่าง', pm(d.base)], ['ภาษีมูลค่าเพิ่ม 7%', pm(d.vat)], ['รวมทั้งสิ้น', pm(d.total), true]])
    + pSign(['ผู้รับเอกสาร', 'ผู้มีอำนาจลงนาม']), d.no, isVoid(d) ? 'ยกเลิก' : '');

const cmdNorm = (s) => String(s || '').toLowerCase().replace(/[\s.\-–·/_]/g, '');

function cmdkSources(q) {
  const n = cmdNorm(q);
  const has = (...parts) => !n || parts.some((p) => cmdNorm(p).indexOf(n) >= 0);
  const out = [];
  const add = (g, list, max) => { list.slice(0, max).forEach((x) => out.push(Object.assign({ g }, x))); };

  /* สร้างเอกสาร */
  const creates = [];
  CREATE_MENU.forEach((sec) => sec.items.forEach((i) => {
    const t = (i[0].indexOf('partner:') === 0 || /^(item|emp|asset):/.test(i[0]) ? 'เพิ่ม' : 'สร้าง') + i[1];
    if (has(t, i[1], sec.s)) creates.push({ icon:'plus', t, h: sec.s, act: i[0] });
  }));
  add('สร้างเอกสาร', creates, n ? 6 : 5);

  /* หน้าจอ */
  const screens = [];
  navGroups().forEach(function (g) {
    const push = (it, sub) => {
      if (has(it[1], g.g, sub || '', SCREEN_WORDS[it[0]] || '')) {
        screens.push({ icon: g.icon, t: it[1], h: g.flat ? 'ภาพรวม' : g.g + (sub ? ' · ' + sub : ''), act: 'go:' + it[0] });
      }
    };
    (g.items || []).forEach((it) => push(it));
    (g.subs || []).forEach((s) => s.items.forEach((it) => push(it, s.s)));
  });
  add('ไปที่หน้า', screens, n ? 8 : 6);

  /* คำสั่ง */
  const cmds = [
    { icon: themeNow() === 'dark' ? 'sun' : 'moon', t:'สลับโหมดสว่าง / มืด', h:'การแสดงผล', act:'theme' },
    { icon:'printer', t:'พิมพ์หน้านี้', h:'รายงานบนจอ', act:'print' },
  ].filter((c) => has(c.t, c.h));
  if (n) add('คำสั่ง', cmds, 2);

  if (n.length < 2) return out;

  /* เอกสาร — ค้นจากเลขที่ เลขใบกำกับผู้ขาย และชื่อคู่ค้า */

    ['invoice', 'ใบกำกับภาษี', (d) => 'open:invoices:' + d.no, 'sale'],
    ['billingNote', 'ใบวางบิล', (d) => 'open:billingnotes:' + d.no, 'sale'],

    + '<div class="cmdk-f"><span><kbd>↑</kbd> <kbd>↓</kbd> เลือก</span><span><kbd>Enter</kbd> เปิด</span>'
    + '<span><kbd>Esc</kbd> ปิด</span></div></div>';
  el.classList.add('show');

function closeCmdk() {
  const el = document.getElementById('cmdk');
  if (!el.classList.contains('show')) return false;
  el.classList.remove('show');
  el.innerHTML = '';
  return true;
}
function cmdkRun(i) {
  const x = CMDK.items[i];
  if (!x) return;
  closeCmdk();
  dispatch(x.act);
}
function cmdkKey(ev) {
  const el = document.getElementById('cmdk');
  if (!el.classList.contains('show')) return false;
  if (ev.key === 'Escape') { ev.preventDefault(); closeCmdk(); return true; }
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    const n = CMDK.items.length;
    if (n) CMDK.at = (CMDK.at + (ev.key === 'ArrowDown' ? 1 : n - 1)) % n;
    cmdkRender();
    return true;
  }
  if (ev.key === 'Enter') { ev.preventDefault(); cmdkRun(CMDK.at); return true; }
  return false;
}

/* ---------- ส่งออกตารางเป็น CSV ----------
   ใส่ BOM ไว้หน้าไฟล์ Excel จะอ่านภาษาไทยถูก · ตัวเลขส่งออกเป็นตัวเลขล้วน
   (ไม่มีจุลภาค วงเล็บกลายเป็นเครื่องหมายลบ) ให้ Excel คำนวณต่อได้ทันที */
function csvCell(td) {
  const raw = (td.textContent || '').replace(/\s+/g, ' ').trim();
  if (!td.classList.contains('num')) return raw;
  if (raw === '—' || raw === '') return '';
  const neg = /^\(.*\)$/.test(raw);
  const v = raw.replace(/[(),\s]/g, '');
  return /^-?\d+(\.\d+)?$/.test(v) ? (neg ? '-' : '') + v : raw;
}
function csvQuote(v) {
  return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function exportCsv(cardEl) {
  if (!cardEl) return;
  const tables = Array.from(cardEl.querySelectorAll('table'));
  if (!tables.length) return;
  const h2 = cardEl.querySelector('.card-h h2');
  const title = h2 ? h2.textContent.trim() : 'ตาราง';
  const sub = cardEl.querySelector('.card-h .card-sub');
  const lines = [[DB.company.name], [title + (sub ? ' — ' + sub.textContent.trim() : '')], []];
  tables.forEach(function (t, ti) {
    if (ti > 0) lines.push([]);
    t.querySelectorAll('tr').forEach(function (tr) {
      const cells = Array.from(tr.children).map(csvCell);
      if (cells.some((c) => c !== '')) lines.push(cells);
    });
  });
  const text = '\ufeff' + lines.map((r) => r.map(csvQuote).join(',')).join('\r\n');
  /* ชื่อไฟล์เป็นอักษรอังกฤษ เบราว์เซอร์บางตัวไม่ยอมตั้งชื่อไฟล์ภาษาไทยแล้วตั้งเป็น "download" ไม่มีนามสกุล
     ชื่อรายงานภาษาไทยอยู่ในบรรทัดแรกของไฟล์แทน */
  const name = 'Financii_' + STATE.screen + '_' + STATE.period + '.csv';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('ส่งออก "' + title + '" แล้ว', 'ok', name + ' · ' + (lines.length - 3) + ' แถว · เปิดด้วย Excel ได้ทันที ภาษาไทยไม่เพี้ยน');
  return text;
}

function collectLines(n) {

    const it = DB.items.find((x) => x.code === code);

      itemCode: it && it.type === 'stock' ? it.code : null,

      taxCode: val('l' + i + '_tax') || 'VAT7',

    const back = DB.docs.creditNote.filter((c) => c.invoiceNo === inv.no && c.status !== 'void')
      .reduce((a, c) => a + (c.returns || []).filter((r) => r.itemCode === m.item).reduce((b, r) => b + r.qty, 0), 0);

    const it = DB.items.find((x) => x.code === m.item) || {};
    out.push({ code: m.item, name: it.name || m.item, uom: it.uom || '', sold: m.qty, back });
  });

  /* ใบที่ยังค้างชำระขึ้นก่อน — ลดหนี้ใบที่ชำระครบแล้วทำได้ แต่ต้องคืนเงินลูกค้าตามมา */
  const refs = DB.docs.invoice.filter(pickable)
    .sort((a, b) => (invOutstanding(b) > 0) - (invOutstanding(a) > 0))
    .map((d) => [d.no, d.no + ' · ' + d.partnerName + ' · ลดได้อีก ' + fmt(creditableBase(d))
      + (invOutstanding(d) > 0 ? '' : ' · ชำระครบแล้ว')]);
  if (!no && !needRefs(refs, 'ไม่มีใบกำกับภาษีที่ออกใบลดหนี้ได้', 'ใบลดหนี้ต้องอ้างใบกำกับเดิมที่ยังมีมูลค่าให้ลด (มาตรา 86/10)')) return;
  const list = fromList || !no;
  const invNo = no || refs[0][0];
  const inv = DB.docs.invoice.find((d) => d.no === invNo);
  if (!inv) return;
  const rets = returnableItems(inv);
  modal({
    title: list ? 'ออกใบลดหนี้' : 'ออกใบลดหนี้อ้างใบกำกับ ' + invNo,
    sub:'ออกได้เฉพาะเหตุที่มาตรา 86/10 กำหนดเท่านั้น และต้องอ้างใบกำกับเดิมเสมอ',
    body:'<div class="flds" data-note="cn">'
      + (list ? field({ name:'invoiceNo', label:'อ้างใบกำกับภาษีเดิม', type:'select', wide:true, options: refs, value: invNo }) : '')
      + noteCodeField(inv, true)
      + field({ name:'base', label:'มูลค่าที่ลด (ก่อนภาษี)', value:'0',
          hint:'ลดได้ไม่เกินมูลค่าคงเหลือ ' + fmt(creditableBase(inv)) + ' บาท'
            + (invOutstanding(inv) <= 0 ? ' · ลูกค้าชำระครบแล้ว ลดหนี้แล้วต้องคืนเงินที่หน้าใบกำกับ' : '') })
      + field({ name:'date', label:'วันที่ออกใบลดหนี้', type:'date', value: defaultDate() })
      + field({ name:'reason', label:'เหตุแห่งการลดหนี้', type:'select', wide:true,
          options: Object.keys(CN_REASONS).map((k) => [k, CN_REASONS[k]]) })
      + '</div>'
      + (rets.length ? '<div class="sub-h">รับสินค้าคืนเข้าคลัง (ถ้ามี)</div><div class="flds">'
          + rets.map((r, i) => field({ name:'ret' + i, label: r.code + ' ' + r.name, value:'0', type:'number',
              hint:'ขายไป ' + r.sold + ' ' + r.uom + (r.back ? ' · คืนแล้ว ' + r.back : '') + ' · คืนได้อีก ' + r.left
                + ' — ของกลับเข้าคลังด้วยต้นทุนเดิมตอนขาย' })).join('') + '</div>' : ''),
    submitLabel:'ออกใบลดหนี้',
    onSubmit: function () {
      submitAction(function () {
        const returnLines = rets.map((r, i) => ({ itemCode: r.code, qty: Number(val('ret' + i) || 0) })).filter((r) => r.qty > 0);
        const c = issueCreditNote({ invoiceNo: list ? val('invoiceNo') : invNo, base: val('base'), date: val('date'),
          reason: val('reason'), taxCode: val('taxCode') || undefined, returnLines });
        toast('ออกใบลดหนี้ ' + c.no + ' แล้ว', 'ok', 'ลดภาษีขาย ' + fmt(c.vat) + ' บาทในงวดนี้'
          + (c.returns.length ? ' · รับสินค้าคืนเข้าคลัง ' + c.returns.length + ' รายการ' : ''));
        return c;
      });
    },
  });
}

/* ---------- คืนเงินลูกค้า — ลดหนี้หลังรับเงินครบ ---------- */
function modalRefund(no) {
  const inv = DB.docs.invoice.find((d) => d.no === no);
  if (!inv) return;
  const credit = -invOutstanding(inv);
  if (credit <= 0) { toast('ใบกำกับ ' + no + ' ไม่มียอดที่ต้องคืนลูกค้า', 'err'); return; }
  const banks = payFromAccounts().map((a) => [a.code, a.code + ' ' + a.name]);
  modal({
    title:'คืนเงินลูกค้า ตามใบกำกับ ' + no,
    sub: inv.partnerName + ' · มีเครดิตจากใบลดหนี้ ' + fmt(credit) + ' บาท',
    body:'<div class="flds">'
      + field({ name:'amount', label:'จำนวนเงินที่คืน', value: fmt(credit), hint:'คืนได้ไม่เกินเครดิตของลูกค้า' })
      + field({ name:'date', label:'วันที่คืนเงิน', type:'date', value: defaultDate() })
      + field({ name:'bank', label:'จ่ายจากบัญชี', type:'select', options: banks, value: accBySub('bank') })
      + field({ name:'method', label:'วิธีคืนเงิน', type:'select', value:'transfer',
          options:[['transfer','โอนเงิน'],['cheque','เช็ค'],['cash','เงินสด']] })
      + field({ name:'note', label:'หมายเหตุ', wide:true, placeholder:'เช่น เลขที่อ้างอิงการโอน' })
      + '</div>',
    submitLabel:'คืนเงินและลงบัญชี',
    note:'Dr ลูกหนี้การค้า / Cr เงินฝากธนาคาร — ยอดเครดิตของลูกค้าจะกลับเป็นศูนย์',
    onSubmit: function () {
      submitAction(function () {
        const r = refundCustomer({ invoiceNo: no, amount: val('amount'), date: val('date'), bankAccount: val('bank'),
          method: val('method'), note: val('note') });
        toast('บันทึกคืนเงินลูกค้า ' + r.no + ' แล้ว', 'ok', fmt(r.amount) + ' บาท');
        return r;
      });
    },
  });
}

function modalConvertTradeDoc(kind, no) {
  const cfg = TRADE_DOCS[kind];
  const d = DB.docs[kind].find((x) => x.no === no);
  if (!d) return;
  const toBill = cfg.next === 'bill';
  const nextLabel = cfg.next === 'salesOrder' ? 'ใบสั่งขาย'
    : cfg.next === 'invoice' ? 'ใบกำกับภาษี' : 'รายการตั้งหนี้';
  const stockOnly = d.lines.every((l) => { const it = l.itemCode && DB.items.find((x) => x.code === l.itemCode); return it && it.type === 'stock'; });
  modal({
    title:'แปลง' + cfg.label + ' ' + no + ' เป็น' + nextLabel,
    sub: d.partnerName + ' · รวม ' + fmt(d.total) + ' บาท · ' + d.lines.length + ' รายการ',
    body:'<div class="flds">'
      + field({ name:'date', label:'วันที่ของ' + nextLabel, type:'date', value: defaultDate(),
          hint: cfg.next === 'salesOrder' ? '' : 'ต้องอยู่ในงวดที่ยังเปิดอยู่ ระบบจะเลือกอัตราภาษีตามวันที่นี้' })
      + (toBill ? field({ name:'vendorNo', label:'เลขที่ใบกำกับภาษีของผู้ขาย', placeholder:'ดูจากใบกำกับที่ผู้ขายส่งมา' }) : '')
      + (toBill && !stockOnly ? field({ name:'acc', label:'บันทึกเข้าบัญชี', type:'select', wide:true,
          value: d.lines[0].acc || defaultAccountFor(d.lines[0].expenseSub || 'admin_expense'), options: optBillAccounts(),
          hint:'ใช้กับรายการที่ไม่ใช่สินค้าคงคลัง · สินค้าคงคลังเข้าบัญชีสินค้าคงเหลือเสมอ' }) : '')
      + (toBill ? field({ name:'wht', label:'ภาษีหัก ณ ที่จ่ายตอนจ่ายเงิน', type:'select', options: optWht() }) : '')
      + '</div>',
    submitLabel:'แปลงเป็น' + nextLabel,
    note: cfg.next === 'salesOrder' ? 'ยังไม่ลงบัญชีในขั้นนี้'
      : 'ขั้นนี้จะลงบัญชีจริงและจองเลขที่เอกสาร',
    onSubmit: function () {
      submitAction(function () {
        const made = convertTradeDoc(kind, no, {
          date: val('date'), vendorNo: toBill ? val('vendorNo') : null,
          acc: toBill && !stockOnly ? val('acc') : null,
          whtCode: toBill ? (val('wht') || null) : null,
        });
        STATE.sel = null;
        toast('แปลงเป็น ' + made.no + ' แล้ว', 'ok', cfg.label + ' ' + no + ' ปิดรายการแล้ว');
        return made;
      });
    },
  });
}

/** ใบกำกับของลูกค้ารายนี้ที่ยังค้าง — ใบที่อยู่ในใบวางบิลอื่นที่ยังเปิดอยู่ติ๊กไม่ได้ */
function bnInvoiceRows(partnerCode) {
  const list = DB.docs.invoice.filter((d) => d.partnerCode === partnerCode && d.status !== 'void' && invOutstanding(d) > 0)
    .slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  if (!list.length) return '<div class="empty">ลูกค้ารายนี้ไม่มีใบกำกับที่ค้างชำระ</div>';
  const takenBy = (no) => {
    const b = DB.docs.billingNote.find((x) => x.invoices.some((i) => i.no === no)
      && ['issued', 'partially_paid'].indexOf(billingNoteStatus(x)) >= 0);
    return b ? b.no : null;
  };
  return '<div class="scroll"><table class="lines"><thead><tr><th></th><th>ใบกำกับภาษี</th><th>วันที่</th>'
    + '<th>ครบกำหนด</th><th class="r">คงค้าง</th><th>หมายเหตุ</th></tr></thead><tbody>'
    + list.map(function (d) {
      const t = takenBy(d.no);
      return '<tr><td><input type="checkbox" name="bnInv" value="' + esc(d.no) + '"' + (t ? ' disabled' : ' checked') + '></td>'
        + '<td class="mono">' + esc(d.no) + '</td><td>' + thDateNum(d.date) + '</td><td>' + thDateNum(d.due) + '</td>'
        + '<td class="num">' + fmt(invOutstanding(d)) + '</td>'
        + '<td class="dim">' + (t ? 'อยู่ในใบวางบิล ' + esc(t) + ' แล้ว' : d.due < TODAY ? 'เลยกำหนดแล้ว' : '') + '</td></tr>';
    }).join('')
    + '</tbody></table></div>';
}
