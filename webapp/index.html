function money(v, cls) {
  const c = v < 0 ? ' neg' : '';
  return '<td class="num' + c + (cls ? ' ' + cls : '') + '">' + (v === 0 ? '—' : fmt(v)) + '</td>';

function cell(c) {

    if ('dim' in c) return '<td class="dim">' + esc(c.dim) + '</td>';

    if ('html' in c) return '<td>' + c.html + '</td>';
    if ('c' in c) return '<td class="ctr">' + esc(c.c) + '</td>';

  return '<td>' + esc(c) + '</td>';
}
function tbl(o) {
  if (!o.rows.length) {
    return '<div class="empty">' + esc(o.empty || 'ยังไม่มีข้อมูลในมุมมองนี้')
      + (o.emptyAction ? '<div style="margin-top:12px">' + o.emptyAction + '</div>' : '') + '</div>';
  }
  let h = '<div class="scroll"><table><thead><tr>';
  o.cols.forEach((c) => { h += '<th class="' + (c.a || 'l') + '">' + esc(c.t) + '</th>'; });
  h += '</tr></thead><tbody>';
  o.rows.forEach(function (r, i) {
    const attrs = o.rowAttr ? o.rowAttr(r, i) : '';
    h += '<tr ' + attrs + '>' + (o.render ? o.render(r, i) : r.map(cell).join('')) + '</tr>';
  });
  h += '</tbody>';
  if (o.foot) h += '<tfoot><tr>' + o.foot.map(cell).join('') + '</tr></tfoot>';

  let nav = '';
  groups.forEach(function (g) {
    nav += '<div class="nav-g">' + esc(g.g) + '</div>';
    g.items.forEach(function (it) {
      nav += '<a href="#" class="nav-i' + (STATE.screen === it[0] ? ' on' : '') + '" data-act="go:' + it[0] + '">'
        + esc(it[1]) + (it[2] ? '<span class="badge">' + it[2] + '</span>' : '') + '</a>';
    });
  });
  document.getElementById('nav').innerHTML = nav;

  const periods = DB.periods.map((p) =>
    '<option value="' + p.code + '"' + (p.code === STATE.period ? ' selected' : '') + '>'
    + thPeriod(p.code) + (p.status !== 'open' ? ' (ปิดแล้ว)' : '') + '</option>').join('');
  document.getElementById('periodSel').innerHTML = periods;

  document.getElementById('coName').innerHTML = esc(DB.company.name)
    + (DB.isDemo
        ? '<button class="demo-tag" data-act="go:import" title="ข้อมูลชุดนี้ระบบสร้างขึ้นเพื่อให้ลองใช้">'
          + 'ข้อมูลตัวอย่าง · เริ่มใช้ของจริง</button>'
        : '');

  const fn = SCREENS[STATE.screen] || SCREENS.dashboard;
  let html;
  try { html = fn(); }
  catch (e) {
    console.error(e);
    html = card({ title:'เปิดหน้านี้ไม่ได้', body:'<div class="empty">' + esc(e.message) + '</div>' });
  }
  const main = document.getElementById('main');
  main.innerHTML = html;
  main.scrollTop = 0;
}


/* ===== import.js ===== */
/* ===================================================================
   นำเข้าข้อมูลจากระบบบัญชีเดิม
   อ่านได้ทั้งไฟล์ Excel (.xlsx) ไฟล์ CSV และแฟ้มข้อมูลจากตัวดึง FlowAccount
   ทุกจำนวนเงินผ่าน M() เสมอ ไม่มีการคำนวณต่อจากทศนิยมลอยตัว
   =================================================================== */

/* ---------- CSV ---------- */
function parseCsv(text) {
  const rows = [];
  let row = [], cell = '', q = false;
  const src = String(text).replace(/^﻿/, '');
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (q) {
      if (c === '"') { if (src[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',' || c === '\t') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((x) => String(x).trim() !== ''));
}

/* ---------- .xlsx คือไฟล์ zip ที่ข้างในเป็น XML ---------- */
const u16 = (b, o) => b[o] | (b[o + 1] << 8);
const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;

async function inflateRaw(bytes) {
  if (typeof DecompressionStream === 'undefined') {
    throw new DomainError('XLSX_UNSUPPORTED',
      'เบราว์เซอร์นี้ยังแตกไฟล์ .xlsx ไม่ได้',
      'เปิดไฟล์ใน Excel แล้วสั่ง Save As เป็น CSV จากนั้นลากไฟล์ CSV มาวางแทน');
  }
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/** อ่านสารบัญกลางของ zip แล้วคลายเฉพาะไฟล์ที่ต้องใช้ */
async function unzipEntries(buf, wanted) {
  const b = new Uint8Array(buf);
  let eocd = -1;
  for (let i = b.length - 22; i >= 0 && i > b.length - 66000; i--) {
    if (u32(b, i) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) {
    throw new DomainError('NOT_A_ZIP', 'ไฟล์นี้ไม่ใช่ไฟล์ .xlsx ที่อ่านได้',
      'ตรวจว่าเป็นไฟล์ Excel จริง ไม่ใช่ .xls รุ่นเก่าหรือไฟล์ที่เสียหาย');
  }
  let p = u32(b, eocd + 16);
  const count = u16(b, eocd + 10);
  const out = {};
  for (let i = 0; i < count; i++) {
    if (u32(b, p) !== 0x02014b50) break;
    const nameLen = u16(b, p + 28), extraLen = u16(b, p + 30), cmtLen = u16(b, p + 32);
    const method = u16(b, p + 10), csize = u32(b, p + 20), local = u32(b, p + 42);
    const name = new TextDecoder().decode(b.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extraLen + cmtLen;
    if (wanted && !wanted(name)) continue;
    const lnLen = u16(b, local + 26), leLen = u16(b, local + 28);
    const start = local + 30 + lnLen + leLen;
    const raw = b.subarray(start, start + csize);
    out[name] = method === 0 ? raw : await inflateRaw(raw);
  }
  return out;
}

const xmlDoc = (text) => new DOMParser().parseFromString(text, 'application/xml');

function parseSharedStrings(xml) {
  if (!xml) return [];
  const doc = xmlDoc(xml);
  return Array.from(doc.getElementsByTagName('si')).map(function (si) {
    return Array.from(si.getElementsByTagName('t')).map((t) => t.textContent).join('');
  });
}

const colIndex = (ref) => {
  let n = 0;
  for (let i = 0; i < ref.length; i++) {
    const c = ref.charCodeAt(i);
    if (c < 65 || c > 90) break;
    n = n * 26 + (c - 64);
  }
  return n - 1;
};

function parseSheetXml(xml, shared) {
  const doc = xmlDoc(xml);
  const rows = [];
  Array.from(doc.getElementsByTagName('row')).forEach(function (r) {
    const cells = [];
    Array.from(r.getElementsByTagName('c')).forEach(function (c) {
      const at = colIndex(c.getAttribute('r') || 'A');
      const t = c.getAttribute('t');
      let v = '';
      if (t === 'inlineStr') {
        v = Array.from(c.getElementsByTagName('t')).map((x) => x.textContent).join('');
      } else {
        const node = c.getElementsByTagName('v')[0];
        v = node ? node.textContent : '';
        if (t === 's') v = shared[Number(v)] || '';
      }
      cells[at >= 0 ? at : cells.length] = v;
    });
    for (let i = 0; i < cells.length; i++) if (cells[i] === undefined) cells[i] = '';
    rows.push(cells);
  });
  return rows.filter((r) => r.some((x) => String(x).trim() !== ''));
}

async function readXlsx(buf) {
  const files = await unzipEntries(buf, (n) =>
    n === 'xl/sharedStrings.xml' || /^xl\/worksheets\/sheet\d+\.xml$/.test(n));
  const dec = new TextDecoder();
  const sheetName = Object.keys(files).filter((n) => n.indexOf('worksheets') >= 0).sort()[0];
  if (!sheetName) throw new DomainError('NO_SHEET', 'ไม่พบแผ่นงานในไฟล์นี้');
  const shared = parseSharedStrings(files['xl/sharedStrings.xml'] ? dec.decode(files['xl/sharedStrings.xml']) : null);
  return parseSheetXml(dec.decode(files[sheetName]), shared);
}

/* ---------- ตัวเลขจากไฟล์ภายนอก ---------- */
function parseAmount(s) {
  let t = String(s === null || s === undefined ? '' : s).trim();
  if (!t || t === '-' || t === '—') return '0';
  let neg = false;
  if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
  t = t.replace(/[,\s฿]/g, '').replace(/^บาท/, '');
  if (t.startsWith('-')) { neg = !neg; t = t.slice(1); }
  if (!/^\d*(\.\d+)?$/.test(t) || t === '') return null;
  return (neg ? '-' : '') + t;
}

/* ---------- เดาคอลัมน์จากหัวตาราง ---------- */
const COL_HINTS = {
  code:   ['รหัสบัญชี', 'เลขที่บัญชี', 'รหัส', 'account code', 'code', 'accountcode'],
  name:   ['ชื่อบัญชี', 'ชื่อ', 'account name', 'description', 'name'],
  debit:  ['เดบิต', 'debit', 'dr'],
  credit: ['เครดิต', 'credit', 'cr'],
};
const norm = (s) => String(s || '').toLowerCase().replace(/\s+/g, '');

function detectColumns(rows) {
  let headerRow = -1, best = 0, map = {};
  rows.slice(0, 25).forEach(function (r, i) {
    const found = {};
    r.forEach(function (cell, j) {
      const n = norm(cell);
      if (!n) return;
      Object.keys(COL_HINTS).forEach(function (k) {
        if (COL_HINTS[k].some((h) => n.indexOf(norm(h)) >= 0)) {
          // งบทดลองมีเดบิต/เครดิตหลายคู่ เอาคู่ขวาสุดคือยอดคงเหลือปลายงวด
          if (k === 'debit' || k === 'credit' || found[k] === undefined) found[k] = j;
        }
      });
    });
    const score = Object.keys(found).length;
    if (score > best) { best = score; headerRow = i; map = found; }
  });
  return { headerRow, map, ok: best >= 3 };
}

/* ---------- อ่านงบทดลอง ---------- */
function readTrialBalance(rows, map, headerRow) {
  const out = [], skipped = [];
  rows.slice(headerRow + 1).forEach(function (r, i) {
    const code = String(r[map.code] === undefined ? '' : r[map.code]).trim();
    const name = String(r[map.name] === undefined ? '' : r[map.name]).trim();
    const dr = parseAmount(r[map.debit]);
    const cr = parseAmount(r[map.credit]);
    if (!code && !name) return;
    if (dr === null || cr === null) { skipped.push({ line: headerRow + 2 + i, code, name, why: 'ตัวเลขอ่านไม่ออก' }); return; }
    const debit = M(dr), credit = M(cr);
    if (debit === 0 && credit === 0) return;
    if (/^(รวม|total|ยอดรวม)/i.test(name) || /^(รวม|total)/i.test(code)) {
      skipped.push({ line: headerRow + 2 + i, code, name, why: 'บรรทัดผลรวม ข้ามอัตโนมัติ' });
      return;
    }
    out.push({ code, name, debit, credit });
  });
  return { rows: out, skipped };
}

/* ---------- จับคู่กับผังบัญชีของเรา ---------- */
function matchAccount(code, name) {
  const byCode = DB.accounts.find((a) => a.postable && a.code === String(code).trim());
  if (byCode) return byCode.code;
  const n = norm(name);
  if (!n) return null;
  const byName = DB.accounts.find((a) => a.postable && norm(a.name) === n);
  return byName ? byName.code : null;
}

/**
 * ตรวจก่อนนำเข้า — บอกให้ครบว่าจะเกิดอะไรขึ้น ก่อนแตะบัญชีจริง
 * overrides: { 'รหัสเดิม': 'รหัสในผังบัญชีเรา' }
 */
function previewOpening(tbRows, overrides) {
  overrides = overrides || {};
  const matched = [], unmatched = [];
  let totalDr = 0, totalCr = 0;
  tbRows.forEach(function (r) {
    const key = r.code || r.name;
    const target = overrides[key] || matchAccount(r.code, r.name);
    totalDr += r.debit; totalCr += r.credit;
    if (target) matched.push({ ...r, target, targetName: acc(target).name });
    else unmatched.push(r);
  });
  return {
    matched, unmatched, totalDr, totalCr,
    diff: totalDr - totalCr,
    balanced: totalDr === totalCr,
    ready: totalDr === totalCr && unmatched.length === 0 && matched.length > 0,
  };
}

function importOpeningBalances(tbRows, date, overrides) {
  const p = previewOpening(tbRows, overrides);
  if (!p.matched.length && !p.unmatched.length) {
    throw new DomainError('NOTHING_TO_IMPORT', 'ไม่พบบรรทัดที่มียอดในไฟล์นี้');
  }
  if (!p.balanced) {
    throw new DomainError('IMPORT_UNBALANCED',
      'งบทดลองในไฟล์ไม่สมดุล เดบิตรวม ' + fmt(p.totalDr) + ' เครดิตรวม ' + fmt(p.totalCr)
        + ' ต่างกัน ' + fmt(p.diff),
      'ตรวจว่าเลือกคอลัมน์เดบิตและเครดิตถูกคู่ และไฟล์ครอบคลุมทุกบัญชี');
  }
  if (p.unmatched.length) {
    throw new DomainError('ACCOUNT_UNMATCHED',
      'ยังจับคู่บัญชีไม่ครบ เหลือ ' + p.unmatched.length + ' บัญชี',
      'เลือกบัญชีปลายทางให้ครบทุกบรรทัดก่อนนำเข้า');
  }
  const srcId = 'opening|' + date;
  if (DB.entries.find((e) => e.src === 'import' && e.srcId === srcId)) {
    throw new DomainError('ALREADY_IMPORTED',
      'นำเข้ายอดยกมา ณ ' + thDate(date) + ' ไปแล้ว',
      'ถ้าต้องการนำเข้าใหม่ ให้กลับรายการใบสำคัญเดิมก่อน');
  }
  // รวมบรรทัดที่ชี้ไปบัญชีเดียวกัน แล้วสุทธิเป็นด้านเดียว
  const net = {};
  p.matched.forEach(function (r) { net[r.target] = (net[r.target] || 0) + r.debit - r.credit; });
  const lines = Object.keys(net).filter((c) => net[c] !== 0).map(function (c) {
    const a = acc(c);
    const l = net[c] > 0 ? { acc: c, dr: net[c] } : { acc: c, cr: -net[c] };
    if (a.requiresPartner) l.partner = 'OPENING';
    return l;
  });
  if (!DB.partners.find((x) => x.code === 'OPENING')) {
    DB.partners.push({ code:'OPENING', name:'ยอดยกมาจากระบบเดิม', taxId:null, address:'',
      branch:'00000', entityType:'juristic', kind:'customer', termDays:0, active:false });
  }
  const je = post({
    type: 'opening', date: date,
    desc: 'ยอดยกมาจากระบบเดิม ณ ' + thDate(date),
    src: 'import', srcId: srcId,
    lines: lines,
  });
  audit('import', srcId, 'run', null, { accounts: lines.length, total: fmt(p.totalDr) });
  return { entry: je, accounts: lines.length, total: p.totalDr };
}

/* ===================================================================
   แฟ้มข้อมูลจากตัวดึง FlowAccount (duly-import/1)
   =================================================================== */
function validatePackage(pkg) {
  if (!pkg || pkg.format !== 'duly-import/1') {
    throw new DomainError('BAD_PACKAGE',
      'ไฟล์นี้ไม่ใช่แฟ้มข้อมูลของระบบ (ต้องเป็น duly-import/1)',
      'ใช้ไฟล์ที่ได้จากคำสั่ง flowaccount-import convert');
  }
  if (!pkg.cutoff || !/^\d{4}-\d{2}-\d{2}$/.test(pkg.cutoff)) {
    throw new DomainError('BAD_CUTOFF', 'แฟ้มข้อมูลไม่ได้ระบุวันตัดยอดที่ถูกต้อง');
  }
  return pkg;
}

function upsertPartner(p) {
  const kind = p.kind === 'vendor' ? 'vendor' : 'customer';
  const rec = {
    code: p.code, name: p.name, taxId: p.taxId || null, address: p.address || '',
    branch: p.branch || (p.entityType === 'individual' ? null : '00000'),
    entityType: p.entityType === 'individual' ? 'individual' : 'juristic',
    kind: kind, termDays: Number(p.termDays || 0), whtCode: p.whtCode || null,
    creditLimit: M(p.creditLimit || '0'), active: true,
  };
  const at = DB.partners.findIndex((x) => x.code === rec.code);
  if (at >= 0) { DB.partners[at] = { ...DB.partners[at], ...rec }; return 0; }
  DB.partners.push(rec);
  return 1;
}

function upsertItem(i) {
  const rec = {
    code: i.code, name: i.name, category: i.category || 'ทั่วไป', uom: i.uom || 'หน่วย',
    type: i.type === 'service' ? 'service' : 'stock',
    avgCost: M(i.avgCost || '0'), price: M(i.price || '0'),
    qty: Number(i.qty || 0), reorder: Number(i.reorder || 0),
  };
  rec.value = rec.avgCost * rec.qty;
  const at = DB.items.findIndex((x) => x.code === rec.code);
  if (at >= 0) { DB.items[at] = { ...DB.items[at], ...rec }; return 0; }
  DB.items.push(rec);
  return 1;
}

function upsertEmployee(e) {
  const rec = {
    code: e.code, name: e.name, dept: e.dept || 'ไม่ระบุ',
    salary: M(e.salary || '0'), otHours: Number(e.otHours || 0),
    pvdRate: Number(e.pvdRate || 0), deductions: M(e.deductions || '0'),
    active: e.active !== false, hired: e.hired || null,
    nationalId: e.nationalId || null, ssoNumber: e.ssoNumber || null,
  };
  const at = DB.employees.findIndex((x) => x.code === rec.code);
  if (at >= 0) { DB.employees[at] = { ...DB.employees[at], ...rec }; return 0; }
  DB.employees.push(rec);
  return 1;
}

/** เอกสารค้างยกมา — เป็นบัญชีย่อยเท่านั้น ไม่ลงบัญชีซ้ำ เพราะยอดอยู่ในงบทดลองแล้ว */
function importOpenDocs(pkg, entryNo) {
  let inv = 0, bill = 0;
  (pkg.openInvoices || []).forEach(function (d) {
    if (DB.docs.invoice.find((x) => x.no === d.no)) return;
    const base = M(d.base || '0'), vat = M(d.vat || '0');
    const total = d.total !== undefined ? M(d.total) : base + vat;
    DB.docs.invoice.push({
      no: d.no, legacyNo: d.legacyNo || d.no, date: d.date, due: d.due || d.date,
      partnerCode: d.partnerCode, partnerName: d.partnerName,
      snap: { name:d.partnerName, taxId:d.taxId || null, branch:d.branch || '00000', address:d.address || '' },
      lines: [{ desc:'ยอดค้างยกมาจากระบบเดิม', qty:1, price:base, amount:base, taxCode:'EXEMPT', uom:'', itemCode:null }],
      base: base, vat: vat, total: total,
      paid: M(d.paid || '0'), credited: M(d.credited || '0'),
      bfPaid: M(d.paid || '0') + M(d.credited || '0'),
      status: 'issued', entryNo: entryNo, etax: 'not_applicable', broughtForward: true,
    });
    inv++;
  });
  (pkg.openBills || []).forEach(function (d) {
    if (DB.docs.bill.find((x) => x.no === d.no)) return;
    const base = M(d.base || '0'), vat = M(d.vat || '0');
    const total = d.total !== undefined ? M(d.total) : base + vat;
    DB.docs.bill.push({
      no: d.no, legacyNo: d.legacyNo || d.no, date: d.date, due: d.due || d.date,
      vendorNo: d.vendorNo || d.no, partnerCode: d.partnerCode, partnerName: d.partnerName,
      lines: [{ desc:'ยอดค้างยกมาจากระบบเดิม', qty:1, price:base, amount:base, itemCode:null }],
      base: base, vat: vat, total: total, claimable: true,
      paid: M(d.paid || '0'), bfPaid: M(d.paid || '0'), status: 'issued', entryNo: entryNo,
      whtCode: d.whtCode || null, broughtForward: true,
    });
    bill++;
  });
  return { inv, bill };
}

function importPackage(pkg, overrides) {
  validatePackage(pkg);
  const before = { partners: DB.partners.length, items: DB.items.length,
    employees: DB.employees.length };
  let newPartners = 0, newItems = 0, newEmployees = 0;
  (pkg.partners || []).forEach((p) => { newPartners += upsertPartner(p); });
  (pkg.items || []).forEach((i) => { newItems += upsertItem(i); });
  (pkg.employees || []).forEach((e) => { newEmployees += upsertEmployee(e); });

  let opening = null;
  if (pkg.trialBalance && pkg.trialBalance.length) {
    const tb = pkg.trialBalance.map((r) => ({
      code: String(r.code || ''), name: String(r.name || ''),
      debit: M(r.debit || '0'), credit: M(r.credit || '0'),
    }));
    opening = importOpeningBalances(tb, pkg.cutoff, overrides);
  }
  const docs = importOpenDocs(pkg, opening ? opening.entry.no : null);

  const asOf = pkg.cutoff;
  const rec = reconciliationChecks(asOf);
  audit('import', 'package|' + pkg.cutoff, 'run', null, {
    partners: newPartners, items: newItems, employees: newEmployees,
    invoices: docs.inv, bills: docs.bill,
  });
  return {
    cutoff: pkg.cutoff, source: pkg.source || 'ไม่ระบุ',
    partners: newPartners, partnersSeen: (pkg.partners || []).length,
    items: newItems, itemsSeen: (pkg.items || []).length,
    employees: newEmployees, employeesSeen: (pkg.employees || []).length,
    invoices: docs.inv, bills: docs.bill,
    coverage: pkg.coverage || [],
    opening: opening,
    warnings: pkg.warnings || [],
    checks: rec.checks, allPassed: rec.allPassed,
    before: before,
  };
}


/* ===== ui-charts.js ===== */
/* ===================================================================
   กราฟ — วาดเป็น SVG ตรง ๆ ไม่พึ่งไลบรารีภายนอก
   ทุกสีดึงจากโทเคนธีม จึงถูกต้องทั้งธีมสว่างและธีมมืด
   =================================================================== */

const CH = { w: 720, h: 236, top: 14, right: 14, bottom: 30, left: 62 };
const plotW = () => CH.w - CH.left - CH.right;
const plotH = () => CH.h - CH.top - CH.bottom;

/* ตัวเลขบนแกน — หน่วยล้านบาท อ่านง่ายกว่าเลขเต็ม */
const axisM = (v) => (v / S / 1000000).toFixed(v / S / 1000000 >= 10 ? 0 : 1);
const tip = (label, value) => ' data-tip="' + esc(label + ' · ' + fmt(value) + ' บาท') + '"';

/** ขั้นแกนที่ลงตัว 1 / 2 / 2.5 / 5 × 10^n */
function niceMax(v, ticks) {
  if (v <= 0) return { max: 1, step: 1 };
  const raw = v / ticks;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const mult = [1, 2, 2.5, 5, 10].find((m) => m * mag >= raw) || 10;
  const step = mult * mag;
  return { max: step * ticks, step };
}

function gridY(max, ticks, showZero) {
  let g = '';
  for (let i = 0; i <= ticks; i++) {
    const y = CH.top + plotH() - (plotH() * i) / ticks;
    const v = (max * i) / ticks;
    g += '<line class="grid' + (i === 0 && showZero ? ' base' : '') + '" x1="' + CH.left + '" y1="' + y
      + '" x2="' + (CH.w - CH.right) + '" y2="' + y + '"/>'
      + '<text class="ax" x="' + (CH.left - 9) + '" y="' + (y + 4) + '" text-anchor="end">' + axisM(v) + '</text>';
  }
  return g;
}

/** มุมบนมนตามหลัก ปลายข้อมูลมน 4px ฐานตรงติดเส้นศูนย์ */
function barTop(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h);
  return 'M' + x + ' ' + (y + h) + 'V' + (y + rr) + 'a' + rr + ' ' + rr + ' 0 0 1 ' + rr + ' ' + -rr
    + 'h' + (w - rr * 2) + 'a' + rr + ' ' + rr + ' 0 0 1 ' + rr + ' ' + rr + 'V' + (y + h) + 'Z';
}

/* ---------- แท่งเปรียบเทียบ 2 ชุดข้อมูลรายเดือน ---------- */
function chartGrouped(rows, series, caption) {
  const peak = Math.max(1, ...rows.map((r) => Math.max(...series.map((s) => r[s.key]))));
  const { max } = niceMax(peak, 4);
  const band = plotW() / rows.length;
  const gap = 2;                                   // ช่องว่าง 2px ระหว่างแท่งที่ติดกัน
  const bw = Math.min(26, (band * 0.62 - gap * (series.length - 1)) / series.length);
  let bars = '';
  rows.forEach(function (r, i) {
    const cx = CH.left + band * i + band / 2;
    const total = bw * series.length + gap * (series.length - 1);
    series.forEach(function (s, j) {
      const h = Math.max(0, (r[s.key] / max) * plotH());
      const x = cx - total / 2 + j * (bw + gap);
      const y = CH.top + plotH() - h;
      bars += '<path class="mk" fill="var(' + s.color + ')" d="' + barTop(x, y, bw, h, 4) + '"'
        + tip(r.label + ' — ' + s.name, r[s.key]) + '></path>';
    });
    bars += '<text class="ax" x="' + cx + '" y="' + (CH.h - 10) + '" text-anchor="middle">' + esc(r.label) + '</text>';
  });
  return '<div class="chart-wrap">'
    + '<div class="legend">' + series.map((s) =>
        '<span><i style="background:var(' + s.color + ')"></i>' + esc(s.name) + '</span>').join('')
    + '<span class="grow"></span><span class="unit">' + esc(caption) + '</span></div>'
    + '<svg class="chart" viewBox="0 0 ' + CH.w + ' ' + CH.h + '" role="img">'
    + gridY(max, 4, true) + bars + '</svg></div>';
}

/* ---------- เส้นแนวโน้ม ---------- */
function chartLine(rows, key, name, caption) {
  const peak = Math.max(1, ...rows.map((r) => r[key]));
  const { max } = niceMax(peak, 4);
  const step = rows.length > 1 ? plotW() / (rows.length - 1) : 0;
  const px = (i) => CH.left + step * i;
  const py = (v) => CH.top + plotH() - (v / max) * plotH();
  const pts = rows.map((r, i) => px(i) + ' ' + py(r[key]));
  const line = 'M' + pts.join('L');
  const area = line + 'L' + px(rows.length - 1) + ' ' + (CH.top + plotH())
    + 'L' + px(0) + ' ' + (CH.top + plotH()) + 'Z';
  const last = rows[rows.length - 1];
  let dots = '', labels = '';
  rows.forEach(function (r, i) {
    const isLast = i === rows.length - 1;
    dots += '<circle class="mk dot' + (isLast ? ' end' : '') + '" cx="' + px(i) + '" cy="' + py(r[key])
      + '" r="' + (isLast ? 4.5 : 3.5) + '"' + tip(r.label + ' — ' + name, r[key]) + '></circle>';
    labels += '<text class="ax" x="' + px(i) + '" y="' + (CH.h - 10) + '" text-anchor="middle">' + esc(r.label) + '</text>';
  });
  return '<div class="chart-wrap">'
    + '<div class="legend"><span class="grow"></span><span class="unit">' + esc(caption) + '</span></div>'
    + '<svg class="chart" viewBox="0 0 ' + CH.w + ' ' + CH.h + '" role="img">'
    + gridY(max, 4, true)
    + '<path class="area" d="' + area + '"/><path class="line" d="' + line + '"/>'
    + dots + labels
    + '<text class="val" x="' + (px(rows.length - 1) - 6) + '" y="' + (py(last[key]) - 12)
    + '" text-anchor="end">' + fmt(last[key], 0) + '</text>'
    + '</svg></div>';
}

/* ---------- แท่งแนวนอนพร้อมค่ากำกับทุกแท่ง ---------- */
function chartBarsH(rows, caption) {
  const peak = Math.max(1, ...rows.map((r) => r.value));
  const rowH = 30, padL = 168, padR = 108;
  const h = rows.length * rowH + 10;
  const w = 720, barW = w - padL - padR;
  let body = '';
  rows.forEach(function (r, i) {
    const y = i * rowH + 5;
    const len = Math.max(2, (r.value / peak) * barW);
    body += '<text class="ax lbl" x="' + (padL - 12) + '" y="' + (y + 15) + '" text-anchor="end">' + esc(r.label) + '</text>'
      + '<rect class="track" x="' + padL + '" y="' + (y + 5) + '" width="' + barW + '" height="12" rx="4"/>'
      + '<rect class="mk" x="' + padL + '" y="' + (y + 5) + '" width="' + len + '" height="12" rx="4"'
      + ' fill="var(' + (r.color || '--s1') + ')"' + tip(r.label, r.value) + '></rect>'
      + '<text class="val" x="' + (padL + barW + 10) + '" y="' + (y + 15) + '">' + fmt(r.value, 0) + '</text>';
  });
  return '<div class="chart-wrap">'
    + '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img">' + body + '</svg>'
    + (caption ? '<div class="legend"><span class="grow"></span><span class="unit">' + esc(caption) + '</span></div>' : '')
    + '</div>';
}

/* ---------- เส้นจิ๋วในกล่องตัวเลขสรุป ---------- */
function sparkline(values) {
  if (!values || values.length < 2) return '';
  const lo = Math.min(...values), hi = Math.max(...values);
  const span = hi - lo || 1;
  const w = 108, h = 24, step = w / (values.length - 1);
  const pts = values.map((v, i) => (step * i).toFixed(1) + ' ' + (h - 2 - ((v - lo) / span) * (h - 6)).toFixed(1));
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">'
    + '<polyline points="' + pts.join(' ') + '"/>'
    + '<circle cx="' + (w - 1.5) + '" cy="' + (h - 2 - ((values[values.length - 1] - lo) / span) * (h - 6)).toFixed(1)
    + '" r="2.2"/></svg>';
}

/* ---------- ตัวเลขรายเดือนตั้งแต่ต้นปีถึงงวดที่เลือก ---------- */
function monthlySeries() {
  const yr = STATE.period.slice(0, 4);
  const upto = Number(STATE.period.slice(5, 7));
  const rows = [];
  for (let m = 1; m <= upto; m++) {
    const code = yr + '-' + String(m).padStart(2, '0');
    const from = code + '-01', to = endOfMonth(from);
    const revenue = -balanceOf((a) => a.type === 'revenue', to, from);
    const expense = balanceOf((a) => a.type === 'expense', to, from);
    rows.push({
      code, label: TH_M[m - 1], revenue, expense, net: revenue - expense,
      cash: balBySub(CASH_SUB, to),
      ar: DB.docs.invoice.filter((d) => d.status !== 'draft' && d.status !== 'void' && d.date <= to)
        .reduce((s, d) => s + outstandingAsOf('ar', d, to), 0),
      ap: DB.docs.bill.filter((d) => d.status !== 'draft' && d.status !== 'void' && d.date <= to)
        .reduce((s, d) => s + outstandingAsOf('ap', d, to), 0),
      assets: balanceOf((a) => a.type === 'asset', to),
    });
  }
  return rows;
}

/* ---------- ค่าใช้จ่ายสูงสุดของงวด ---------- */
function topExpenses(from, to, n) {
  const rows = DB.accounts.filter((a) => a.postable && a.type === 'expense')
    .map((a) => ({ label: a.name, code: a.code, value: balanceOf(a.code, to, from) }))
    .filter((r) => r.value > 0)
    .sort((a, b) => b.value - a.value);
  const head = rows.slice(0, n);
  const rest = rows.slice(n).reduce((s, r) => s + r.value, 0);
  if (rest > 0) head.push({ label: 'ค่าใช้จ่ายอื่น ๆ รวม', code: null, value: rest });
  return head;
}

/* บรรทัดของงบการเงิน (ใช้ทั้งงบดุลและงบกำไรขาดทุน) */
function fsRows(lines) {
  let h = '<div class="scroll"><table class="fs"><tbody>';
  lines.forEach(function (L) {
    if (L.k === 'd' && L.value === 0) return;   // งบการเงินไม่แสดงบรรทัดที่ไม่มียอด
    if (L.k === 'sp') { h += '<tr class="sp"><td colspan="3"></td></tr>'; return; }
    if (L.k === 'h')  { h += '<tr class="fs-h"><td colspan="3">' + esc(L.label) + '</td></tr>'; return; }
    if (L.k === 'h2') { h += '<tr class="fs-h2"><td colspan="3">' + esc(L.label) + '</td></tr>'; return; }
    const cls = L.k === 't' ? 'fs-t' : L.k === 's' ? 'fs-s' : '';
    h += '<tr class="' + cls + '"><td>' + esc(L.label) + '</td>'
      + '<td class="ctr dim">' + (L.note ? String(L.note) : '') + '</td>'
      + '<td class="num' + (L.value < 0 ? ' neg' : '') + '">' + fmt(L.value) + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}

function scClose() {
  const chk = closeChecklist(STATE.period);
  const p = DB.periods.find((x) => x.code === STATE.period);
  const actMap = {
    depreciation: ['run:deprec', 'ตั้งค่าเสื่อมราคาเดี๋ยวนี้'],
    payroll: ['run:payroll', 'ทำเงินเดือนเดี๋ยวนี้'],
    vat: ['run:pp30', 'ยื่น ภ.พ.30 เดี๋ยวนี้'],
    bank: ['go:bank', 'ไปหน้ากระทบยอด'],
  };
  const rows = chk.items.map(function (i) {
    const a = i.action && actMap[i.action];
    return '<li><span class="dot ' + (i.ok ? 'good' : i.blocking ? 'bad' : 'warn') + '"></span>'
      + '<div><b>' + esc(i.label) + '</b><div class="dim">' + esc(i.detail) + '</div></div>'
      + '<span class="grow"></span>'
      + (i.ok ? '<span class="st paid">ผ่าน</span>' : (a ? btn(a[0], a[1], i.blocking ? 'primary' : '') : '<span class="st late">ยังไม่ผ่าน</span>'))
      + '</li>';
  }).join('');

  const closedList = DB.periods.filter((x) => x.status === 'closed');
  return card({
    title: 'ปิดงวดบัญชี ' + thPeriod(STATE.period),
    sub: p && p.status === 'closed' ? 'งวดนี้ปิดแล้ว — ลงรายการใหม่ไม่ได้' : 'ปิดงวดได้เมื่อรายการที่บล็อกผ่านครบ',
    actions: p && p.status === 'closed'
      ? btn('reopen:period', 'ขอเปิดงวดใหม่')
      : btn('close:period', 'ปิดงวดนี้', chk.canClose ? 'primary' : 'disabled'),
    body: '<ul class="todo big">' + rows + '</ul>',
    foot: p && p.status === 'closed'
      ? 'การเปิดงวดที่ปิดแล้วต้องระบุเหตุผล และระบบจะบันทึกไว้ในร่องรอยการตรวจสอบ'
      : (chk.canClose ? 'พร้อมปิดงวด — ตรวจครบทุกข้อแล้ว'
                      : 'ยังปิดไม่ได้: ' + chk.items.filter((i) => i.blocking && !i.ok).map((i) => i.label).join(' · ')),
  })
  + card({ title:'สถานะงวดทั้งปี', sub:'รอบบัญชี ' + DB.company.fiscalYear,
      body: '<div class="periods">' + DB.periods.map((x) =>
        '<button class="pchip ' + x.status + (x.code === STATE.period ? ' on' : '') + '" data-act="period:' + x.code + '">'
        + esc(thPeriod(x.code)) + '<span>' + (x.status === 'closed' ? 'ปิดแล้ว' : 'เปิดอยู่') + '</span></button>').join('')
        + '</div>',
      foot: 'ปิดแล้ว ' + closedList.length + ' งวด จาก ' + DB.periods.length + ' งวด' });
}

function nextMonthDay(period, day) {
  let [y, m] = period.split('-').map(Number);
  m += 1; if (m > 12) { m = 1; y += 1; }
  return y + '-' + String(m).padStart(2, '0') + '-' + String(day).padStart(2, '0');
}

  const outTax = f ? f.outTax : out.reduce((s, t) => s + t.tax, 0);
  const inTax  = f ? f.inTax  : inn.reduce((s, t) => s + t.tax, 0);
  const outBase = f ? f.outBase : out.reduce((s, t) => s + t.base, 0);
  const inBase  = f ? f.inBase  : inn.reduce((s, t) => s + t.base, 0);
  const payable = outTax - inTax;
  const due = nextMonthDay(STATE.period, 15);
  const dueE = nextMonthDay(STATE.period, 23);

  const line = (n, label, v, cls) =>
    '<tr class="' + (cls || '') + '"><td class="ctr dim">' + n + '</td><td>' + esc(label)

      + '<tr class="fs-h"><td colspan="3">ยอดขายและภาษีขาย</td></tr>'

function scBudget() {
  const from = pStart(), to = pEnd();
  const yFrom = yStart();
  const months = Number(STATE.period.slice(5, 7));
  const rows = DB.budget.map(function (b) {
    const actual = Math.abs(balanceOf(b.account, to, from));
    const ytdActual = Math.abs(balanceOf(b.account, to, yFrom));
    const ytdBudget = b.monthly * months;
    return { ...b, actual, variance: b.monthly - actual, ytdActual, ytdBudget, ytdVariance: ytdBudget - ytdActual };
  });
  const sum = (f) => rows.reduce((s, r) => s + r[f], 0);
  return card({
    title:'งบประมาณเทียบใช้จริง', sub: thPeriod(STATE.period) + ' และสะสม ' + months + ' เดือน',
    body: tbl({
      cols:[{t:'รหัส'},{t:'รายการ'},{t:'งบเดือนนี้',a:'r'},{t:'ใช้จริงเดือนนี้',a:'r'},{t:'ผลต่าง',a:'r'},
        {t:'งบสะสม',a:'r'},{t:'ใช้จริงสะสม',a:'r'},{t:'ผลต่างสะสม',a:'r'}],
      rows: rows.map((r) => [{mono:r.account}, r.name, {n:r.monthly}, {n:r.actual},
        {n:r.variance, cls: r.variance < 0 ? 'bad' : 'good'},
        {n:r.ytdBudget}, {n:r.ytdActual},
        {n:r.ytdVariance, cls: r.ytdVariance < 0 ? 'bad' : 'good'}]),
      foot: ['','รวม', {n:sum('monthly')}, {n:sum('actual')}, {n:sum('variance')},
        {n:sum('ytdBudget')}, {n:sum('ytdActual')}, {n:sum('ytdVariance')}],
    }),
    foot:'ผลต่างเป็นบวกคือใช้ต่ำกว่างบ เป็นลบคือใช้เกินงบ ตัวเลขใช้จริงดึงจากบัญชีแยกประเภทโดยตรง ไม่ได้กรอกซ้ำ',
  });
}

      + 'มีใบสำคัญ ' + DB.entries.length + ' ใบ · ใบกำกับภาษี ' + DB.docs.invoice.length + ' ฉบับ</p></div>',

  });

  if (!IMP.rows) return step1 + blank;

  /* ---- อ่านไฟล์ได้แล้ว ให้เลือกคอลัมน์ ---- */
  const head = IMP.rows[IMP.headerRow] || [];

  const preview = IMP.tb ? previewOpening(IMP.tb.rows, IMP.overrides || {}) : null;

  const step2 = card({
    title:'ตรวจไฟล์ก่อนนำเข้า',
    sub: esc(IMP.name) + ' · ' + IMP.rows.length + ' แถว · หัวตารางอยู่แถวที่ ' + (IMP.headerRow + 1),

      + tbl({

            const t = (IMP.overrides || {})[r.code || r.name] || matchAccount(r.code, r.name);

          : ''),
  });

  if (!preview) return step1 + step2 + blank;

  const step3 = card({
    title:'สรุปสิ่งที่จะเกิดขึ้น',
    sub:'ยังไม่มีอะไรถูกบันทึกจนกว่าจะกดปุ่มนำเข้า',

      + '<div><span>เครดิตรวม</span><b>' + fmt(preview.totalCr) + '</b></div>'
      + '<div class="gt"><span>ผลต่าง</span><b class="' + (preview.balanced ? '' : 'neg') + '">'
        + fmt(preview.diff) + '</b></div></div>'
      + (preview.unmatched.length
          ? '<div class="sub-h">เลือกบัญชีปลายทางให้ครบก่อนนำเข้า</div>'

          + 'มักเกิดจากเลือกคอลัมน์ผิดคู่ — งบทดลองมักมีทั้งคู่ยอดยกมา คู่เคลื่อนไหว และคู่ยอดคงเหลือ '
          + 'ให้เลือกคู่ยอดคงเหลือปลายงวด</div>'),
    foot: preview.ready
      ? 'ระบบจะสร้างใบสำคัญ "ยอดยกมา" หนึ่งใบ ลงวันที่ตามที่เลือก แก้ไม่ได้ ถ้าผิดต้องกลับรายการ'
      : 'ยังนำเข้าไม่ได้ — ' + (!preview.balanced ? 'งบทดลองไม่สมดุล' : 'ยังจับคู่บัญชีไม่ครบ'),
  });

  return step1 + step2 + step3 + blank;
}

const optVat = [['VAT7','ภาษีมูลค่าเพิ่ม 7%'], ['VAT0','อัตราร้อยละ 0 (ส่งออก)'], ['EXEMPT','ยกเว้นภาษี']];

function submitAction(fn) {
  try {
    const r = fn();
    closeModal(); save(); render();
    return r;
  } catch (e) {
    if (e instanceof DomainError) toast(e.message, 'err', e.hint);
    else { console.error(e); toast('เกิดข้อผิดพลาดที่ไม่คาดคิด', 'err', e.message); }
    return null;
  }
}

/* ---------- ออกใบกำกับภาษี ---------- */
function lineEditor(n) {
  let h = '<div class="sub-h">รายการสินค้าหรือบริการ</div><div class="scroll"><table class="lines"><thead><tr>'
    + '<th>สินค้า/บริการ</th><th>คำอธิบายบนใบกำกับ</th><th class="r">จำนวน</th><th class="r">ราคาต่อหน่วย</th><th>ภาษี</th></tr></thead><tbody>';
  for (let i = 0; i < n; i++) {
    h += '<tr>'
      + '<td><select name="l' + i + '_item" class="itemsel" data-i="' + i + '">'
        + optItems().map((o) => '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>').join('') + '</select></td>'
      + '<td><input name="l' + i + '_desc" placeholder="พิมพ์เองได้"></td>'
      + '<td><input name="l' + i + '_qty" class="r" value="' + (i === 0 ? '1' : '') + '"></td>'
      + '<td><input name="l' + i + '_price" class="r"></td>'
      + '<td><select name="l' + i + '_tax">'
        + optVat.map((o) => '<option value="' + o[0] + '">' + esc(o[1]) + '</option>').join('') + '</select></td>'
      + '</tr>';
  }
  return h + '</tbody></table></div>';
}
function collectLines(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const code = val('l' + i + '_item');
    const desc = val('l' + i + '_desc');
    const qty = val('l' + i + '_qty');
    const price = val('l' + i + '_price');
    if (!code && !desc.trim()) continue;
    if (!price || M(price) === 0) continue;
    const it = DB.items.find((x) => x.code === code);
    out.push({
      itemCode: it && it.type === 'stock' ? it.code : null,
      desc: desc.trim() || (it ? it.name : ''),
      qty: Number(qty || 1) || 1,
      price: price,
      taxCode: val('l' + i + '_tax') || 'VAT7',
      revenueSub: it && it.type === 'service' ? 'service_revenue' : 'sales_revenue',
    });
  }
  return out;
}

/* ===================================================================
   ตัวรับเหตุการณ์
   =================================================================== */
function dispatch(act) {
  const [head, ...rest] = act.split(':');
  const arg = rest.join(':');

  if (head === 'go')      { STATE.screen = arg; STATE.sel = null; STATE.filter = ''; render(); return; }
  if (head === 'period')  { STATE.period = arg; STATE.sel = null; save(); render(); return; }
  if (head === 'sel')     { STATE.sel = arg || null; render(); return; }
  if (head === 'drill')   { STATE.drill = arg; STATE.screen = 'ledger'; STATE.filter = ''; render(); return; }
  if (head === 'entry')   { STATE.screen = 'journals'; STATE.sel = arg; render(); return; }
  if (head === 'print')   { window.print(); return; }
  if (head === 'view')    { STATE.dashView = arg; render(); return; }
  if (head === 'pick')    { document.getElementById('file').click(); return; }
  if (head === 'blank')   { modalBlank(); return; }
  if (head === 'pass') {
    const code = val('passcode');
    syncUnlock(code).then(function (ok) {
      STATE.passWrong = !ok;
      render();
      if (ok) toast('เปิดสมุดบัญชีแล้ว', 'ok', 'ข้อมูลชุดนี้เก็บบนเซิร์ฟเวอร์');
    });
    return;
  }
  if (head === 'imp') {
    if (arg === 'reset') { STATE.imp = null; render(); return; }
    if (arg === 'run') {
      const I = STATE.imp;
      if (!I || !I.tb) return;
      runAction(function () {
        const r = importOpeningBalances(I.tb.rows, val('cutoff') || pStart(), I.overrides || {});
        STATE.impResult = {
          cutoff: val('cutoff') || pStart(), source: 'ไฟล์ ' + I.name,
          partners: 0, partnersSeen: 0, items: 0, itemsSeen: 0, invoices: 0, bills: 0,
          opening: r, warnings: [],
          checks: reconciliationChecks(val('cutoff') || pStart()).checks,
          allPassed: reconciliationChecks(val('cutoff') || pStart()).allPassed,
        };
        STATE.screen = 'importResult';
        STATE.imp = null;
        toast('ตั้งยอดยกมา ' + r.accounts + ' บัญชีแล้ว', 'ok', 'ใบสำคัญ ' + r.entry.no);
      });
    }
    return;
  }
  if (head === 'reset')   {
    if (window.confirm('ล้างข้อมูลตัวอย่างทั้งหมดและสร้างใหม่?')) resetAll();
    return;
  }
  if (head === 'modal')   { if (arg === 'close') closeModal(); else if (modalSubmit) modalSubmit(); return; }

  if (head === 'new') {
    if (!periodIsOpen()) { toast('งวด ' + thPeriod(STATE.period) + ' ปิดแล้ว', 'err', 'เลือกงวดที่ยังเปิดอยู่ก่อน'); return; }
    if (arg === 'invoice') modalInvoice();
    if (arg === 'bill') modalBill();
    return;
  }
  if (head === 'pay')     { modalReceive(arg); return; }
  if (head === 'cn')      { modalCreditNote(arg); return; }
  if (head === 'paybill') { modalPayBill(arg); return; }
  if (head === 'rev')     { modalReverse(arg); return; }
  if (head === 'reopen')  { modalReopen(); return; }

  if (head === 'bank') {
    const [what, id] = rest;
    if (what === 'book') modalBankBook(id);
    if (what === 'match') runAction(function () {
      matchBankTxn(Number(id));
      toast('ทำเครื่องหมายว่ากระทบยอดแล้ว', 'ok');
    });
    return;
  }

  if (head === 'run') {
    if (arg === 'deprec') return void runAction(function () {
      const r = runDepreciation(STATE.period);
      toast('ตั้งค่าเสื่อมราคางวด ' + thPeriod(STATE.period) + ' แล้ว', 'ok',
        'ทางบัญชี ' + fmt(r.bookTotal) + ' บาท · ทางภาษี ' + fmt(r.taxTotal) + ' บาท');
    });
    if (arg === 'payroll') return void runAction(function () {
      const r = runPayroll(STATE.period);
      toast('ทำเงินเดือน ' + r.count + ' คนแล้ว', 'ok', 'จ่ายสุทธิ ' + fmt(r.net) + ' บาท');
    });
    if (arg === 'pp30') return void runAction(function () {
      const f = fileVat(STATE.period);
      STATE.screen = 'pp30';
      toast('ยื่น ภ.พ.30 งวด ' + thPeriod(STATE.period) + ' แล้ว', 'ok',
        f.payable >= 0 ? 'ต้องชำระ ' + fmt(f.payable) + ' บาท' : 'ชำระเกิน ' + fmt(-f.payable) + ' บาท ยกไปเดือนถัดไป');
    });
    if (rest[0] === 'pnd') return void runAction(function () {
      const f = fileWht(STATE.period, rest[1]);
      toast('ยื่น ' + rest[1] + ' แล้ว', 'ok', f.count + ' รายการ รวม ' + fmt(f.total) + ' บาท'
        + (f.excluded ? ' · กันรายการ e-Withholding ออก ' + f.excluded + ' รายการ' : ''));
    });
    return;
  }

  if (head === 'close' && arg === 'period') {
    runAction(function () {
      closePeriod(STATE.period);
      toast('ปิดงวด ' + thPeriod(STATE.period) + ' เรียบร้อย', 'ok', 'ลงรายการย้อนหลังในงวดนี้ไม่ได้อีก');
    });
    return;
  }
}

function bindEvents() {
  document.addEventListener('click', function (ev) {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    if (el.classList.contains('disabled')) { ev.preventDefault(); return; }
    ev.preventDefault();
    dispatch(el.getAttribute('data-act'));
  });

  document.addEventListener('input', function (ev) {
    if (ev.target.id !== 'q') return;
    STATE.filter = ev.target.value;
    render();
    const q = document.getElementById('q');
    if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  });

  document.addEventListener('change', function (ev) {
    const t = ev.target;
    if (t.id === 'periodSel') { STATE.period = t.value; STATE.sel = null; save(); render(); return; }
    if (t.id === 'accSel')    { STATE.drill = t.value; render(); return; }
    if (t.id === 'file') {
      if (t.files && t.files[0]) handleFile(t.files[0]);
      return;
    }
    if (t.classList.contains('impcol')) {
      const I = STATE.imp;
      if (I) { I.map[t.getAttribute('data-k')] = t.value === '' ? undefined : Number(t.value); refreshImportPreview(); render(); }
      return;
    }
    if (t.classList.contains('impmap')) {
      const I = STATE.imp;
      if (I) {
        I.overrides = I.overrides || {};
        if (t.value) I.overrides[t.getAttribute('data-key')] = t.value;
        else delete I.overrides[t.getAttribute('data-key')];
        render();
      }
      return;
    }
    if (t.classList.contains('itemsel')) {
      const i = t.getAttribute('data-i');
      const it = DB.items.find((x) => x.code === t.value);
      const price = document.querySelector('[name="l' + i + '_price"]');
      const desc  = document.querySelector('[name="l' + i + '_desc"]');
      const qty   = document.querySelector('[name="l' + i + '_qty"]');
      if (it && price) price.value = it.price ? fmt(it.price) : '';
      if (it && desc) desc.value = it.name;
      if (it && qty && !qty.value) qty.value = '1';
      return;
    }
    if (t.name === 'expenseSub') {
      const item = document.querySelector('[name="item"]');
      if (item) item.disabled = t.value !== 'inventory';
      return;
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') closeModal();
    if (ev.key === 'Enter' && document.getElementById('modal').classList.contains('show')
        && ev.target.tagName !== 'TEXTAREA' && modalSubmit) {
      ev.preventDefault(); modalSubmit();
    }
  });

  /* คำอธิบายจุดข้อมูลบนกราฟ */
  const ttEl = document.getElementById('tip');
  document.addEventListener('mousemove', function (ev) {
    const m = ev.target.closest ? ev.target.closest('[data-tip]') : null;
    if (!m) { ttEl.classList.remove('show'); return; }
    ttEl.textContent = m.getAttribute('data-tip');
    ttEl.classList.add('show');
    const w = ttEl.offsetWidth, h = ttEl.offsetHeight;
    let x = ev.clientX + 14, y = ev.clientY - h - 12;
    if (x + w > window.innerWidth - 8) x = ev.clientX - w - 14;
    if (y < 8) y = ev.clientY + 18;
    ttEl.style.left = x + 'px';
    ttEl.style.top = y + 'px';
  });
  document.addEventListener('mouseleave', function () { ttEl.classList.remove('show'); });

  ['dragenter', 'dragover'].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      const d = document.getElementById('drop');
      if (!d) return;
      e.preventDefault();
      d.classList.add('over');
    });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      const d = document.getElementById('drop');
      if (!d) return;
      e.preventDefault();
      if (ev === 'dragleave' && e.relatedTarget) return;
      d.classList.remove('over');
      if (ev === 'drop' && e.dataTransfer && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
  });

  document.getElementById('menuBtn').addEventListener('click', function () {
    document.body.classList.toggle('nav-open');
  });
  document.getElementById('nav').addEventListener('click', function () {
    document.body.classList.remove('nav-open');
  });
}

/* ===================================================================
   นำเข้าไฟล์
   =================================================================== */
async function handleFile(file) {
  STATE.imp = { name: file.name };
  try {
    const lower = file.name.toLowerCase();
    if (lower.endsWith('.json')) {
      const pkg = JSON.parse(await file.text());
      validatePackage(pkg);
      STATE.imp = { name: file.name, pkg: pkg };
      runImportPackage(pkg);
      return;
    }
    let rows;
    if (lower.endsWith('.xlsx')) rows = await readXlsx(await file.arrayBuffer());
    else rows = parseCsv(await file.text());
    if (!rows.length) throw new DomainError('EMPTY_FILE', 'ไฟล์นี้ไม่มีข้อมูล');

    const det = detectColumns(rows);
    if (!det.ok) {
      throw new DomainError('COLUMNS_NOT_FOUND',
        'หาหัวตารางไม่เจอ ต้องมีคอลัมน์รหัสบัญชี ชื่อบัญชี เดบิต และเครดิต',
        'ถ้าไฟล์มีหัวรายงานหลายบรรทัด ให้ลบบรรทัดบนออกแล้วบันทึกใหม่');
    }
    STATE.imp = {
      name: file.name, rows: rows, headerRow: det.headerRow, map: det.map,
      overrides: {}, cutoff: null,
    };
    refreshImportPreview();
  } catch (e) {
    STATE.imp = { name: file.name, error: (e.message || String(e)) + (e.hint ? ' — ' + e.hint : '') };
    if (!(e instanceof DomainError)) console.error(e);
  }
  render();
}

function refreshImportPreview() {
  const I = STATE.imp;
  if (!I || !I.rows) return;
  const m = I.map;
  if (m.code === undefined || m.debit === undefined || m.credit === undefined) { I.tb = null; return; }
  I.tb = readTrialBalance(I.rows, m, I.headerRow);
}

function runImportPackage(pkg) {
  runAction(function () {
    const r = importPackage(pkg, {});
    STATE.impResult = r;
    STATE.screen = 'importResult';
    STATE.imp = null;
    toast('นำเข้าข้อมูลจาก ' + (pkg.source || 'ระบบเดิม') + ' แล้ว', 'ok',
      r.allPassed ? 'ยอดคุมผ่านครบทุกข้อ' : 'มียอดคุมที่ยังไม่ตรง ตรวจในหน้าสรุป');
  });
}

/* ---------- เริ่มระบบ ---------- */
async function boot() {
  bindEvents();
  const onServer = await syncConfig();

  if (onServer) {
    try { SYNC.passcode = localStorage.getItem('duly.passcode') || ''; } catch (e) { SYNC.passcode = ''; }
    if (SYNC.needsPasscode && !SYNC.passcode) {
      setStatus('locked');
      render();
      return;
    }
    const r = await syncPull();
    if (r === 'locked') { render(); return; }
    if (r === 'empty') { buildSeed(); render(); await syncPush(); }
    else if (r === 'error') {
      /* ต่อเซิร์ฟเวอร์ไม่ได้ อย่าให้หน้าจอว่างเปล่า — ใช้ของในเครื่องไปก่อนแล้วบอกให้รู้ */
      SYNC.mode = 'browser';
      if (!load()) buildSeed();
      toast('ต่อเซิร์ฟเวอร์ไม่ได้', 'err', 'ใช้ข้อมูลในเบราว์เซอร์ไปก่อน ยังไม่บันทึกขึ้นเซิร์ฟเวอร์');
    }
    render();
    return;
  }

  const restored = load();
  if (!restored) buildSeed();
  render();
  if (!restored) save();
  const el = document.getElementById('boot');
  if (el) el.remove();
}

boot();
