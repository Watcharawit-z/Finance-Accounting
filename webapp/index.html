    bookkeeper: String(input.bookkeeper || '').trim(), auditor: String(input.auditor || '').trim(),
  });
  audit('company', 'profile', 'update', before, { name, taxId, address: DB.company.address });
  return DB.company;
}

/** ข้อมูลที่ยังขาดสำหรับใบกำกับภาษี — แสดงเตือนในหน้าข้อมูลกิจการ */
function companyGaps() {
  const c = DB.company || {};
  const out = [];
  if (!c.name) out.push('ชื่อผู้ประกอบการ');
  if (!c.taxId) out.push('เลขประจำตัวผู้เสียภาษี');
  if (!c.address) out.push('ที่อยู่สถานประกอบการ');
  return out;
}

/* ===================================================================
   ยกเลิกเอกสาร — กลับทุกอย่างที่เอกสารเคยแตะในชุดเดียว
   ใบสำคัญ (กลับรายการ ณ วันที่เดิม) · ลูกหนี้/เจ้าหนี้รายตัว · สต๊อก · ทะเบียนภาษี · 50 ทวิ
   เลขที่เอกสารยังอยู่และขึ้นว่า "ยกเลิก" ทะเบียนจึงไม่มีเลขขาดช่วง
   =================================================================== */
const VOIDABLE = {
  invoice:      { label:'ใบกำกับภาษี', src:'invoice' },
  receipt:      { label:'ใบเสร็จรับเงิน', src:'receipt' },
  creditNote:   { label:'ใบลดหนี้', src:'creditNote' },
  debitNote:    { label:'ใบเพิ่มหนี้', src:'debitNote' },
  bill:         { label:'รายการตั้งหนี้', src:'bill' },
  payment:      { label:'ใบสำคัญจ่าย', src:'payment' },
  expense:      { label:'ค่าใช้จ่าย', src:'expense' },
  goodsReceipt: { label:'ใบรับสินค้า', src:'goodsReceipt' },
  customerRefund: { label:'ใบคืนเงินลูกค้า', src:'customerRefund' },
};
const liveDoc = (d) => !!d && d.status !== 'void';

/** แถวในทะเบียนภาษีที่เกิดจากเอกสารใบนี้ */
function taxRowsOf(kind, d) {
  return DB.taxTx.filter(function (t) {
    if (t.void) return false;
    if (kind === 'invoice') return t.kind === 'vat_output' && t.docType === 'tax_invoice' && t.docNo === d.no;
    if (kind === 'creditNote') return t.kind === 'vat_output' && t.docType === 'credit_note' && t.docNo === d.no;
    if (kind === 'debitNote') return t.kind === 'vat_output' && t.docType === 'debit_note' && t.docNo === d.no;
    if (kind === 'bill') return t.kind === 'vat_input' && t.entryNo === d.entryNo;
    if (kind === 'expense') return (t.kind === 'vat_input' && t.expenseNo === d.no) || (t.kind === 'wht' && t.docNo === d.no);
    if (kind === 'payment') return t.kind === 'wht' && t.docNo === d.no;
    return false;
  });
}

/** สิ่งที่ยังอ้างถึงเอกสารใบนี้อยู่ — ต้องยกเลิกก่อน ไม่งั้นจะมีเอกสารกำพร้า */
function voidBlockers(kind, d) {
  const out = [];
  const refs = (coll, key) => (DB.docs[coll] || []).filter((x) => x[key] === d.no && liveDoc(x)).map((x) => x.no);
  /* คืนเงินลูกค้าไปแล้ว ยกเลิกใบลดหนี้หรือใบเสร็จที่ทำให้เกิดเครดิตก่อนไม่ได้ — ยอดจะกลับด้านผิดทาง */
  if (kind === 'creditNote' || kind === 'receipt') {
    const f = (DB.docs.customerRefund || []).filter((x) => x.invoiceNo === d.invoiceNo && liveDoc(x)).map((x) => x.no);
    if (f.length) out.push('คืนเงินลูกค้าไปแล้วตาม ' + f.join(', ') + ' ต้องยกเลิกใบคืนเงินก่อน');
  }
  if (kind === 'invoice') {
    const r = refs('receipt', 'invoiceNo'), c = refs('creditNote', 'invoiceNo'), n = refs('debitNote', 'invoiceNo');
    const f = refs('customerRefund', 'invoiceNo');
    if (f.length) out.push('มีใบคืนเงินลูกค้าอ้างถึง ' + f.join(', '));
    if (r.length) out.push('มีใบเสร็จรับเงินอ้างถึง ' + r.join(', '));
    if (c.length) out.push('มีใบลดหนี้อ้างถึง ' + c.join(', '));
    if (n.length) out.push('มีใบเพิ่มหนี้อ้างถึง ' + n.join(', '));
    const bn = DB.docs.billingNote.find((b) => b.invoices.some((i) => i.no === d.no)
      && ['issued', 'partially_paid'].indexOf(billingNoteStatus(b)) >= 0);
    if (bn) out.push('อยู่ในใบวางบิล ' + bn.no + ' ที่ยังเปิดอยู่');
  }
  if (kind === 'bill') {
    const p = refs('payment', 'billNo');
    if (p.length) out.push('มีใบสำคัญจ่ายอ้างถึง ' + p.join(', '));
    const pb = DB.docs.paymentBatch.find((b) => paymentBatchActive(b) && b.items.some((i) => i.billNo === d.no));
    if (pb) out.push('อยู่ในใบเตรียมจ่าย ' + pb.no + ' ที่ยังไม่ได้จ่าย');
  }
  if (kind === 'goodsReceipt' && d.status === 'closed') out.push('ตั้งหนี้ไปแล้ว (' + d.billNo + ') ต้องยกเลิกรายการตั้งหนี้ก่อน');
  /* ของที่รับเข้ามาถูกขายออกไปแล้ว ดึงกลับออกจากคลังไม่ได้ — ต้องขอใบลดหนี้จากผู้ขายแทน */
  if ((kind === 'bill' && !d.grnNo) || kind === 'goodsReceipt' || kind === 'creditNote') {
    DB.docs.stockMove.filter((m) => m.src === d.no && m.dir === 'in').forEach(function (m) {
      const it = DB.items.find((x) => x.code === m.item);
      if (it && it.qty < m.qty) out.push(it.code + ' เหลือในคลัง ' + it.qty + ' ' + it.uom + ' น้อยกว่าที่รับเข้ามา ' + m.qty);
    });
  }
  return out;
}

/** ตรวจทุกเงื่อนไขก่อนยกเลิก — คืนเอกสาร ถ้าไม่ผ่านโยนข้อผิดพลาดที่บอกวิธีแก้ */
function voidCheck(kind, no) {
  const cfg = VOIDABLE[kind];
  if (!cfg) throw new DomainError('VOID_KIND_UNKNOWN', 'เอกสารประเภทนี้ยกเลิกไม่ได้');
  const d = (DB.docs[kind] || []).find((x) => x.no === no);
  if (!d) throw new DomainError('DOC_NOT_FOUND', 'ไม่พบ' + cfg.label + ' ' + no);
  if (d.status === 'void') throw new DomainError('ALREADY_VOID', cfg.label + ' ' + no + ' ยกเลิกไปแล้ว');
  const e = DB.entries.find((x) => x.no === d.entryNo);
  if (d.broughtForward || !e || e.src !== cfg.src || String(e.srcId) !== String(d.no)) {
    throw new DomainError('VOID_NOT_OWN_ENTRY', cfg.label + ' ' + no + ' เป็นยอดยกมาหรือนำเข้าจากระบบเดิม ยกเลิกในระบบนี้ไม่ได้',
      'บันทึกรายการปรับปรุงในสมุดรายวันทั่วไปแทน');
  }
  const blockers = voidBlockers(kind, d);
  if (blockers.length) {
    throw new DomainError('VOID_HAS_DEPENDENTS', 'ยกเลิก' + cfg.label + ' ' + no + ' ไม่ได้ เพราะ' + blockers[0],
      blockers.length > 1 ? 'และ ' + blockers.slice(1).join(' · ') : 'ยกเลิกเอกสารที่อ้างถึงก่อน แล้วค่อยยกเลิกใบนี้');
  }
  const p = periodFor(d.date);
  if (p.status !== 'open') {
    throw new DomainError('PERIOD_CLOSED', 'งวด ' + thPeriod(p.code) + ' ปิดแล้ว ยกเลิก' + cfg.label + 'ในงวดนั้นไม่ได้',
      kind === 'invoice' ? 'ออกใบลดหนี้ในงวดปัจจุบันแทน (มาตรา 86/10)' : 'บันทึกรายการปรับปรุงในงวดปัจจุบันแทน');
  }
  const filed = taxRowsOf(kind, d).find((t) => t.filingId);
  if (filed) {
    const form = filed.kind === 'wht' ? 'ภ.ง.ด.' + String(filed.form || '').replace('PND', '') : 'ภ.พ.30';
    throw new DomainError('TAX_ALREADY_FILED', 'ยื่นแบบ ' + form + ' งวด ' + thPeriod(filed.period) + ' ที่มีเอกสารนี้ไปแล้ว ยกเลิกไม่ได้',
      kind === 'invoice' ? 'ออกใบลดหนี้ในงวดปัจจุบันแทน (มาตรา 86/10)'
        : filed.kind === 'wht' ? 'ยื่นแบบเพิ่มเติมกับกรมสรรพากร แล้วบันทึกปรับปรุงในงวดปัจจุบัน'
        : 'ขอใบลดหนี้จากผู้ขาย แล้วบันทึกในงวดปัจจุบัน');
  }
  if (e.status !== 'posted') throw new DomainError('ALREADY_REVERSED', 'ใบสำคัญของเอกสารนี้ถูกกลับรายการไปแล้ว');
  return d;
}

/** สิ่งที่จะเกิดขึ้นเมื่อยกเลิก — แสดงให้ผู้ใช้เห็นก่อนกดยืนยัน */
function voidPreview(kind, no) {
  const d = voidCheck(kind, no);
  const out = ['กลับรายการใบสำคัญ ' + [d.entryNo, d.cogsEntryNo].filter(Boolean).join(' และ ') + ' ณ วันที่ ' + thDate(d.date)];
  const tax = taxRowsOf(kind, d);
  if (tax.some((t) => t.kind !== 'wht')) out.push('ทะเบียนภาษี' + (kind === 'bill' || kind === 'expense' ? 'ซื้อ' : 'ขาย') + 'แสดงว่า "ยกเลิก" ยอดเป็นศูนย์');
  if (tax.some((t) => t.kind === 'wht')) out.push('ตัดรายการออกจากแบบ ภ.ง.ด. ของงวด');
  if (d.certNo) out.push('ยกเลิกหนังสือรับรอง 50 ทวิ เลขที่ ' + d.certNo);
  if (kind === 'invoice' && d.cogsEntryNo) out.push('คืนสินค้าเข้าคลังตามที่ตัดออกไป');
  if ((kind === 'bill' && !d.grnNo) || kind === 'goodsReceipt' || kind === 'creditNote') {
    if (DB.docs.stockMove.some((m) => m.src === d.no && m.dir === 'in')) {
      out.push(kind === 'creditNote' ? 'นำสินค้าที่รับคืนออกจากคลัง และกลับต้นทุนขายส่วนนั้น' : 'นำสินค้าที่รับเข้าออกจากคลัง');
    }
  }
  if (kind === 'receipt' || kind === 'creditNote' || kind === 'debitNote' || kind === 'customerRefund') out.push('ยอดคงค้างของใบกำกับ ' + d.invoiceNo + ' กลับไปเหมือนก่อนออกใบนี้');
  if (kind === 'payment') out.push('ยอดคงค้างของ ' + d.billNo + ' กลับไปเหมือนก่อนจ่าย');
  if (kind === 'bill' && d.grnNo) out.push('ใบรับสินค้า ' + d.grnNo + ' กลับไปรอตั้งหนี้');
  return out;
}

function stockBack(no, dir) {
  DB.docs.stockMove.filter((m) => m.src === no && m.dir === dir).forEach(function (m) {
    const it = DB.items.find((x) => x.code === m.item);
    if (!it) return;
    const sign = dir === 'out' ? 1 : -1;     // ยกเลิกการขาย = ของกลับเข้า · ยกเลิกการรับ = ของออก
    it.qty = roundQty(it.qty + sign * m.qty);
    it.value += sign * m.cost;
    it.avgCost = it.qty > 0 ? unitCost(it.value, it.qty) : it.avgCost;
    DB.docs.stockMove.push({ date: m.date, item: it.code, dir: dir === 'out' ? 'in' : 'out', qty: m.qty, cost: m.cost,
      src: no + ' (ยกเลิก)', balance: it.qty });
  });
}
function reopenTradeDoc(kind, convertedTo) {
  (DB.docs[kind] || []).forEach(function (x) {
    if (x.convertedTo === convertedTo && x.status === 'closed') { x.status = 'approved'; x.convertedTo = null; }
  });
}
function voidCert(certNo) {
  const c = certNo && DB.docs.whtCert.find((x) => x.no === certNo);
  if (c) c.status = 'void';
}

function voidDocument(kind, no, reason) {
  if (!reason || String(reason).trim().length < 5) {
    throw new DomainError('REASON_REQUIRED', 'การยกเลิกเอกสารต้องระบุเหตุผล อย่างน้อย 5 ตัวอักษร',
      'ผู้สอบบัญชีจะเห็นเหตุผลนี้ในร่องรอยการตรวจสอบ');
  }
  const why = String(reason).trim();
  voidCheck(kind, no);
  return atomically(function () {
    const d = DB.docs[kind].find((x) => x.no === no);
    const label = VOIDABLE[kind].label;
    [d.entryNo, d.cogsEntryNo].filter(Boolean).forEach(function (en) {
      const e = DB.entries.find((x) => x.no === en);
      if (e && e.status === 'posted') reverse(en, 'ยกเลิก' + label + ' ' + no + ' — ' + why, d.date, { fromSource: true });
    });
    taxRowsOf(kind, d).forEach(function (t) {
      t.orig = { base: t.base, zero: t.zero || 0, exempt: t.exempt || 0, tax: t.tax, nonClaimable: t.nonClaimable || 0 };
      t.base = 0; t.zero = 0; t.exempt = 0; t.tax = 0; t.nonClaimable = 0;
      t.void = true; t.voidReason = why;
    });
    const inv = d.invoiceNo ? DB.docs.invoice.find((x) => x.no === d.invoiceNo) : null;
    /* ตั้งสถานะยกเลิกก่อนปรับทะเบียนที่เกี่ยวข้อง — ตัวที่นับใหม่จากเอกสาร (เช่นยอดรับของตามใบสั่งซื้อ) จะได้ไม่นับใบนี้ */
    const before = d.status;
    d.status = 'void';
    if (kind === 'invoice') { stockBack(no, 'out'); reopenTradeDoc('salesOrder', no); }
    if (kind === 'receipt') { inv.paid -= d.gross; syncInvStatus(inv); }
    if (kind === 'customerRefund') { inv.refunded = (inv.refunded || 0) - d.amount; syncInvStatus(inv); }
    if (kind === 'creditNote') { inv.credited -= d.total; stockBack(no, 'in'); syncInvStatus(inv); }
    if (kind === 'debitNote') { inv.debited = (inv.debited || 0) - d.total; syncInvStatus(inv); }
    if (kind === 'bill') {
      if (d.grnNo) {
        const g = DB.docs.goodsReceipt.find((x) => x.no === d.grnNo);
        if (g) { g.status = 'received'; g.billNo = null; g.billDate = null; }
      } else stockBack(no, 'in');
      reopenTradeDoc('purchaseOrder', no);
    }
    if (kind === 'payment') {
      const b = DB.docs.bill.find((x) => x.no === d.billNo);
      b.paid -= d.gross;
      b.status = b.paid >= b.total ? 'paid' : b.paid > 0 ? 'partially_paid' : 'issued';
      voidCert(d.certNo);
      DB.docs.paymentBatch.forEach((pb) => pb.items.forEach((i) => { if (i.paymentNo === no) i.voided = true; }));
    }
    if (kind === 'expense') voidCert(d.certNo);
    if (kind === 'goodsReceipt') { stockBack(no, 'in'); reopenGrnOnPo(d); }
    d.voidReason = why;
    d.voidedAt = new Date().toISOString();
    audit(kind, no, 'void', { status: before }, { status: 'void' }, why);
    return d;
  });
}
/* ใบรับสินค้าที่ยกเลิก — ใบสั่งซื้อต้องกลับมารอรับของอีกครั้ง */
function reopenGrnOnPo(g) {
  if (!g.poNo) return;
  const po = DB.docs.purchaseOrder.find((x) => x.no === g.poNo);
  if (po) syncPoStatus(po);
}

/** มูลค่าก่อนภาษีที่ยังลดหนี้ได้ = ใบกำกับ + ใบเพิ่มหนี้ − ใบลดหนี้ที่ยังไม่ยกเลิก
    ต้องคิดจากฐานก่อนภาษีของแต่ละใบ — inv.credited เก็บยอดรวมภาษี เอามาลบกับฐานตรง ๆ ไม่ได้ */
function creditableBase(inv, code) {
  let v = inv.lines.reduce((s, l) => s + (!code || (l.taxCode || 'VAT7') === code ? l.amount : 0), 0);
  const mine = (d) => d.invoiceNo === inv.no && liveDoc(d) && (!code || noteCodeOf(d, inv) === code);
  DB.docs.debitNote.forEach((d) => { if (mine(d)) v += d.base; });
  DB.docs.creditNote.forEach((c) => { if (mine(c)) v -= c.base; });
  return Math.max(0, v);
}
const TAX_CODE_LABEL = { VAT7:'ภาษี 7%', VAT0:'อัตรา 0%', EXEMPT:'ยกเว้นภาษี' };
/** อัตราภาษีที่มีอยู่ในใบกำกับ (เฉพาะบรรทัดที่มีมูลค่า) */
function invoiceTaxCodes(inv) {
  const set = [];
  inv.lines.forEach((l) => { const c = l.taxCode || 'VAT7'; if (l.amount && set.indexOf(c) < 0) set.push(c); });
  return set.length ? set : ['VAT7'];
}
/** ใบลดหนี้/เพิ่มหนี้รุ่นก่อนไม่ได้เก็บอัตราไว้ — เดาจากภาษีในใบและอัตราของใบกำกับเดิม */
function noteCodeOf(d, inv) {
  if (d.taxCode) return d.taxCode;
  if (d.vat) return 'VAT7';
  const codes = invoiceTaxCodes(inv).filter((c) => c !== 'VAT7');
  return codes[0] || 'VAT7';
}
function noteTaxCode(inv, given, verb) {
  const codes = invoiceTaxCodes(inv);
  if (given) {
    if (codes.indexOf(given) < 0) {
      throw new DomainError('NOTE_TAX_CODE_INVALID', 'ใบกำกับ ' + inv.no + ' ไม่มีรายการ' + (TAX_CODE_LABEL[given] || given),
        'เลือกอัตราภาษีที่มีอยู่ในใบกำกับเดิม');
    }
    return given;
  }
  if (codes.length > 1) {
    throw new DomainError('NOTE_TAX_CODE_REQUIRED', 'ใบกำกับ ' + inv.no + ' มีหลายอัตราภาษี ต้องเลือกว่า' + verb + 'รายการอัตราใด',
      'อัตราในใบ' + verb + 'ต้องตรงกับรายการเดิม ไม่งั้นภาษีขายและยอดขายแต่ละช่องใน ภ.พ.30 จะผิด');
  }
  return codes[0];
}
/** รายการสินค้าที่รับคืน — ต้องเป็นสินค้าในใบกำกับเดิม จำนวนไม่เกินที่ขายหักที่คืนไปแล้ว
    ต้นทุนใช้ต้นทุนเดิมที่ตัดออกตอนขาย ครั้งสุดท้ายรับต้นทุนส่วนที่เหลือทั้งหมด */
function creditNoteReturns(inv, lines) {
  const want = (lines || []).filter((l) => l && l.itemCode && Number(l.qty) > 0);
  return want.map(function (l) {
    const sold = DB.docs.stockMove.filter((m) => m.src === inv.no && m.dir === 'out' && m.item === l.itemCode);
    if (!sold.length) {
      throw new DomainError('RETURN_ITEM_NOT_SOLD', 'สินค้า ' + l.itemCode + ' ไม่ได้ตัดออกจากคลังในใบกำกับ ' + inv.no,
        'รับคืนได้เฉพาะสินค้าคงคลังที่ขายในใบกำกับนี้');
    }
    const soldQty = roundQty(sold.reduce((s, m) => s + m.qty, 0));
    const soldCost = sold.reduce((s, m) => s + m.cost, 0);
    const prior = DB.docs.creditNote.filter((c) => c.invoiceNo === inv.no && liveDoc(c))
      .reduce((a, c) => (c.returns || []).filter((r) => r.itemCode === l.itemCode)
        .reduce((b, r) => ({ qty: roundQty(b.qty + r.qty), cost: b.cost + r.cost }), a), { qty: 0, cost: 0 });
    const q = roundQty(l.qty);
    const left = roundQty(soldQty - prior.qty);
    if (q > left) {
      throw new DomainError('RETURN_EXCEEDS_SOLD', 'รับคืน ' + l.itemCode + ' ' + q + ' หน่วย เกินที่ขายและยังไม่ได้คืน ' + left + ' หน่วย');
    }
    const cost = q === left ? soldCost - prior.cost : round2(mulDiv(soldCost, Math.round(q * 1000), Math.round(soldQty * 1000)));
    const it = DB.items.find((x) => x.code === l.itemCode);
    return { itemCode: l.itemCode, desc: it ? it.name : l.itemCode, qty: q, cost };
  });
}
/** ต้นทุนต่อหน่วย = มูลค่า ÷ จำนวน (จำนวนละเอียด 3 ตำแหน่ง) */
const unitCost = (value, qty) => qty > 0 ? mulDiv(value, 1000, Math.round(qty * 1000)) : 0;

/* ===================================================================
   ยกเลิกงวดค่าเสื่อมราคา / งวดเงินเดือน
   ใบสำคัญของสองอย่างนี้กลับรายการตรง ๆ ไม่ได้ เพราะค่าเสื่อมสะสมของทรัพย์สินแต่ละตัว
   และ ภ.ง.ด.1 จะไม่ตรงกับบัญชีแยกประเภท ต้องยกเลิกทั้งงวดจากต้นทางเท่านั้น
   =================================================================== */
const RUN_KINDS = {
  depreciation: { label:'ค่าเสื่อมราคางวด', coll:'depreciation' },
  payroll:      { label:'เงินเดือนงวด', coll:'payRun' },
};
function runCheck(kind, period) {
  const cfg = RUN_KINDS[kind];
  if (!cfg) throw new DomainError('RUN_KIND_UNKNOWN', 'ยกเลิกงวดประเภทนี้ไม่ได้');
  const run = DB.docs[cfg.coll].find((r) => r.period === period && r.status !== 'void');
  if (!run) throw new DomainError('RUN_NOT_FOUND', 'ไม่พบ' + cfg.label + ' ' + thPeriod(period) + ' ที่ยังใช้งานอยู่');
  const p = periodFor(run.date);
  if (p.status !== 'open') {
    throw new DomainError('PERIOD_CLOSED', 'งวด ' + thPeriod(p.code) + ' ปิดแล้ว ยกเลิก' + cfg.label + 'ไม่ได้',
      'บันทึกรายการปรับปรุงในงวดปัจจุบันแทน');
  }
  if (kind === 'depreciation') {
    /* ค่าเสื่อมงวดหลังคิดต่อจากยอดสะสมของงวดนี้ ต้องยกเลิกจากงวดล่าสุดย้อนกลับมา */
    const later = DB.docs.depreciation.find((r) => r.period > period && r.status !== 'void');
    if (later) {
      throw new DomainError('RUN_HAS_LATER', 'มีค่าเสื่อมราคางวด ' + thPeriod(later.period) + ' คิดต่อจากงวดนี้อยู่',
        'ยกเลิกงวดล่าสุดก่อน แล้วย้อนกลับมาทีละงวด');
    }
    const gone = run.rows.map((r) => DB.assets.find((a) => a.code === r.code))
      .find((a) => !a || a.status !== 'in_use');
    if (gone) {
      throw new DomainError('RUN_ASSET_DISPOSED', 'ทรัพย์สินบางรายการในงวดนี้จำหน่ายออกไปแล้ว ยกเลิกค่าเสื่อมย้อนหลังไม่ได้',
        'บันทึกรายการปรับปรุงในสมุดรายวันทั่วไปแทน');
    }
  }
  if (kind === 'payroll') {
    const filed = DB.taxTx.find((t) => t.kind === 'wht' && t.docType === 'payroll' && t.entryNo === run.entryNo && !t.void && t.filingId);
    if (filed) {
      throw new DomainError('TAX_ALREADY_FILED', 'ยื่น ภ.ง.ด.1 งวด ' + thPeriod(filed.period) + ' ไปแล้ว ยกเลิกงวดเงินเดือนไม่ได้',
        'ยื่นแบบเพิ่มเติมกับกรมสรรพากร แล้วบันทึกปรับปรุงในงวดปัจจุบัน');
    }
  }
  const e = DB.entries.find((x) => x.no === run.entryNo);
  if (!e || e.status !== 'posted') throw new DomainError('ALREADY_REVERSED', 'ใบสำคัญของงวดนี้ถูกกลับรายการไปแล้ว');
  return run;
}
function voidRun(kind, period, reason) {
  if (!reason || String(reason).trim().length < 5) {
    throw new DomainError('REASON_REQUIRED', 'การยกเลิกงวดต้องระบุเหตุผล อย่างน้อย 5 ตัวอักษร');
  }
  const why = String(reason).trim();
  runCheck(kind, period);
  return atomically(function () {
    const run = DB.docs[RUN_KINDS[kind].coll].find((r) => r.period === period && r.status !== 'void');
    reverse(run.entryNo, 'ยกเลิก' + RUN_KINDS[kind].label + ' ' + thPeriod(period) + ' — ' + why, run.date, { fromSource: true });
    if (kind === 'depreciation') {
      run.rows.forEach(function (r) {
        const a = DB.assets.find((x) => x.code === r.code);
        a.accumBook -= r.book;
        a.accumTax -= r.tax;
      });
    }
    if (kind === 'payroll') {
      DB.taxTx.forEach(function (t) {
        if (t.kind !== 'wht' || t.docType !== 'payroll' || t.entryNo !== run.entryNo || t.void) return;
        t.orig = { base: t.base, tax: t.tax };
        t.base = 0; t.tax = 0; t.void = true; t.voidReason = why;
      });
    }
    run.status = 'void';
    run.voidReason = why;
    run.voidedAt = new Date().toISOString();
    audit(kind, period, 'void', { status: 'posted' }, { status: 'void' }, why);
    return run;
  });
}

/* ===================================================================
   ฐานภาษีหัก ณ ที่จ่าย — จำนวนเต็มล้วน และครั้งสุดท้ายรับส่วนที่เหลือ
   ผลรวมฐานของทุกครั้งที่รับ/จ่าย จึงเท่าฐานเต็มของเอกสารพอดี ไม่คลาดสตางค์
   =================================================================== */
/** ค่าบริการก่อน VAT ของใบกำกับ (หลังใบเพิ่มหนี้/ลดหนี้) — ขายสินค้าไม่อยู่ในฐานหัก ณ ที่จ่าย */
function invoiceServiceBase(inv) {
  const lineBase = inv.lines.reduce((s, l) => s + l.amount, 0);
  if (!lineBase) return 0;
  const goods = inv.lines.reduce(function (s, l) {
    const it = l.itemCode ? DB.items.find((x) => x.code === l.itemCode) : null;
    return s + (it && it.type === 'stock' ? l.amount : 0);
  }, 0);
  return round2(mulDiv(creditableBase(inv), lineBase - goods, lineBase));
}
/** ส่วนของค่าบริการที่อยู่ในยอดรับครั้งนี้ */
function receiptServiceShare(inv, gross) {
  const svc = invoiceServiceBase(inv);
  const due = inv.total + (inv.debited || 0) - inv.credited;
  if (due <= 0 || svc <= 0) return 0;
  const prior = DB.docs.receipt.filter((r) => r.invoiceNo === inv.no && liveDoc(r))
    .reduce((s, r) => s + (r.svcShare !== undefined ? r.svcShare : round2(mulDiv(svc, r.gross, due))), 0);
  /* ฐานที่พิมพ์ใน 50 ทวิ เป็นบาทกับสตางค์ — ปัดฐานก่อน แล้วค่อยคิดภาษีจากฐานที่ปัดแล้ว */
  if (gross >= invOutstanding(inv)) return Math.max(0, svc - prior);
  return Math.min(round2(mulDiv(svc, gross, due)), Math.max(0, svc - prior));
}
/** ภาษีหัก ณ ที่จ่ายของการจ่ายชำระเจ้าหนี้ครั้งนี้
    เกณฑ์ 1,000 บาทดูจากมูลค่าทั้งใบ — แบ่งจ่ายหลายงวดเพื่อเลี่ยงการหักไม่ได้ (ท.ป.4/2528) */
function billWhtFor(bill, gross, date, channel, whtCode) {
  const prior = DB.docs.payment.filter((x) => x.billNo === bill.no && liveDoc(x))
    .reduce((s, x) => s + (x.baseShare !== undefined ? x.baseShare : round2(mulDiv(bill.base, x.gross, bill.total))), 0);
  const final = gross >= billOutstanding(bill);
  const share = final ? Math.max(0, bill.base - prior) : Math.min(round2(mulDiv(bill.base, gross, bill.total)), Math.max(0, bill.base - prior));
  if (!whtCode || bill.base < M('1000') || share <= 0) return { wht: 0, rate: null, base: share, share };
  const r = resolveRate(whtCode, date, { channel });
  return { wht: round2(pct(share, r.rate)), rate: r.rate, base: share, share };
}

/** ขายเกินของที่มีในคลังไม่ได้ — สต๊อกติดลบทำให้ต้นทุนเฉลี่ยของการรับเข้าครั้งถัดไปเพี้ยน */
function assertStockAvailable(lines) {
  const need = {};
  lines.forEach(function (l) {
    const it = l.itemCode ? DB.items.find((x) => x.code === l.itemCode) : null;
    if (!it || it.type !== 'stock') return;
    need[it.code] = roundQty((need[it.code] || 0) + roundQty(l.qty));
  });
  Object.keys(need).forEach(function (code) {
    const it = DB.items.find((x) => x.code === code);
    if (need[code] > it.qty) {
      throw new DomainError('INSUFFICIENT_STOCK',
        it.name + ' (' + code + ') มีในคลัง ' + it.qty + ' ' + (it.uom || '') + ' แต่จะขาย ' + need[code],
        'บันทึกรับสินค้าเข้าคลังก่อน (ใบรับสินค้าหรือตั้งหนี้ผู้ขาย) แล้วจึงออกใบกำกับ');
    }
  });
}

/* ===================================================================
   คืนเงินลูกค้า — ใช้เมื่อลดหนี้หลังรับเงินครบแล้ว ลูกค้ามียอดเครดิตเกิน
   Dr ลูกหนี้ (รายตัว) / Cr เงินฝากธนาคาร · ยอดคงค้างของใบกำกับกลับเป็นศูนย์
   =================================================================== */
function refundCustomer(input) {
  const inv = DB.docs.invoice.find((d) => d.no === input.invoiceNo);
  if (!inv) throw new DomainError('INVOICE_NOT_FOUND', 'ไม่พบใบกำกับภาษี ' + input.invoiceNo);
  if (inv.status === 'void') throw new DomainError('INVOICE_VOID', 'ใบกำกับ ' + inv.no + ' ถูกยกเลิกไปแล้ว');
  const credit = -invOutstanding(inv);
  if (credit <= 0) {
    throw new DomainError('NO_CREDIT_BALANCE', 'ใบกำกับ ' + inv.no + ' ไม่มียอดที่ต้องคืนลูกค้า',
      'คืนเงินได้เฉพาะเมื่อลดหนี้หลังรับเงินครบแล้วเท่านั้น');
  }
  const amount = input.amount ? M(input.amount) : credit;
  if (amount <= 0 || amount > credit) {
    throw new DomainError('REFUND_EXCEEDS', 'ยอดคืน ' + fmt(amount) + ' ต้องมากกว่าศูนย์และไม่เกินเครดิตของลูกค้า ' + fmt(credit));
  }
  if (!input.date) throw new DomainError('DATE_REQUIRED', 'ต้องระบุวันที่คืนเงิน');
  const bank = input.bankAccount || accBySub('bank');
  const ba = acc(bank);
  if (ba.subType !== 'cash' && ba.subType !== 'bank') {
    throw new DomainError('REFUND_FROM_INVALID', 'ต้องคืนจากบัญชีเงินสดหรือเงินฝากธนาคาร');
  }
  assertPostingOpen(input.date);
  const no = nextNo('customerRefund', input.date);
  const je = post({
    type: 'payment', date: input.date,
    desc: 'คืนเงินลูกค้า ' + inv.partnerName + ' ตามใบลดหนี้ อ้าง ' + inv.no + ' (' + no + ')',
    src: 'customerRefund', srcId: no,
    lines: [{ acc: accBySub('trade_receivable'), dr: amount, partner: inv.partnerCode }, { acc: bank, cr: amount }],
  });
  inv.refunded = (inv.refunded || 0) + amount;
  syncInvStatus(inv);
  const doc = { no, date: input.date, invoiceNo: inv.no, partnerCode: inv.partnerCode, partnerName: inv.partnerName,
    amount, method: input.method || 'transfer', bankAccount: bank, note: input.note || '', entryNo: je.no };
  DB.docs.customerRefund.unshift(doc);
  audit('customerRefund', no, 'create', null, { invoice: inv.no, amount: fmt(amount) });
  return doc;
}

/* ===================================================================
   เปิดปีบัญชีถัดไป — 12 งวดต่อจากงวดสุดท้าย
   งบแสดงฐานะการเงินรวมกำไรทุกปีเข้ากำไรสะสมเอง จึงข้ามปีได้โดยไม่ต้องลงรายการปิดบัญชี
   =================================================================== */
function openNextFiscalYear(reason) {
  if (!DB.periods.length) throw new DomainError('PERIOD_NOT_FOUND', 'ยังไม่มีงวดบัญชีเลย สร้างบริษัทก่อน');
  const last = DB.periods.slice().sort((a, b) => a.start < b.start ? -1 : 1).pop();
  const made = [];
  let d = addDays(last.end, 1);
  for (let i = 0; i < 12; i++) {
    const code = d.slice(0, 7);
    if (!DB.periods.some((p) => p.code === code)) {
      DB.periods.push({ code, start: code + '-01', end: endOfMonth(code + '-01'), status: 'open' });
      made.push(code);
    }
    d = addDays(endOfMonth(code + '-01'), 1);
  }
  audit('period', made[0] + '…' + made[made.length - 1], 'open_year', null, { periods: made.length }, reason || 'เปิดปีบัญชีถัดไป');
  return made;
}

/** บัญชีที่ตั้งหนี้ผู้ขายลงได้: ค่าใช้จ่าย สินค้า ทรัพย์สิน ค่าใช้จ่ายล่วงหน้า เงินมัดจำ */
function billAccounts() {
  const assetSubs = ['inventory', 'ppe', 'ppe_land', 'cip', 'intangible', 'other_asset'];
  const out = DB.accounts.filter((a) => a.postable && assetSubs.indexOf(a.subType) >= 0);
  expenseAccounts().forEach((a) => { if (out.indexOf(a) < 0) out.push(a); });
  return out;
}
/** บัญชีปริยายของประเภท — ค่าใช้จ่ายบริหารทั่วไปลง "เบ็ดเตล็ด" ไม่ใช่บัญชีแรกที่บังเอิญเจอ */
function defaultAccountFor(sub) {
  const accs = DB.accounts.filter((a) => a.postable && a.subType === sub);
  const pick = accs.find((a) => a.isDefault)
    || (sub === 'admin_expense' ? accs.find((a) => /เบ็ดเตล็ด/.test(a.name || '')) || accs.find((a) => /อื่น/.test(a.name || '')) : null)
    || accs[0];
  return pick ? pick.code : accBySub(sub);
}
function billLineAccount(l, i) {
  if (l.acc) {
    const ok = billAccounts().some((a) => a.code === l.acc);
    if (!ok) {
      throw new DomainError('BILL_ACCOUNT_INVALID', 'บรรทัดที่ ' + (i + 1) + ' บัญชี ' + l.acc + ' ใช้บันทึกรายการซื้อไม่ได้',
        'เลือกบัญชีค่าใช้จ่าย สินค้าคงเหลือ ทรัพย์สิน หรือค่าใช้จ่ายจ่ายล่วงหน้า');
    }
    if (l.itemCode && acc(l.acc).subType !== 'inventory') {
      const it = DB.items.find((x) => x.code === l.itemCode);
      if (it && it.type === 'stock') {
        throw new DomainError('BILL_STOCK_ACCOUNT', 'บรรทัดที่ ' + (i + 1) + ' เป็นสินค้าคงคลัง ต้องลงบัญชีสินค้าคงเหลือ',
          'ถ้าเป็นค่าใช้จ่าย ไม่ต้องเลือกสินค้า');
      }
    }
    return l.acc;
  }
  return defaultAccountFor(l.expenseSub || 'admin_expense');
}

function loadChart() {
  DB.accounts = COA.map(function (r) {
    return {
      code: r[0], name: r[1], type: r[2], subType: r[3],
      postable: !!r[4], requiresPartner: r[5] === 'partner',
      level: r[0].endsWith('000') ? 1 : r[0].endsWith('00') ? 2 : 3,
    };
  });
}

function loadPeriods(year) {
  DB.periods = [];
  for (let m = 1; m <= 12; m++) {
    const mm = String(m).padStart(2, '0');
    DB.periods.push({
      code: year + '-' + mm, start: year + '-' + mm + '-01',
      end: endOfMonth(year + '-' + mm + '-01'), status: 'open',
    });
  }
}

/**
 * เริ่มจากบริษัทเปล่า — ผังบัญชีและงวดครบ แต่ไม่มีรายการใด ๆ
 * ใช้เมื่อจะย้ายข้อมูลจริงเข้ามา จะได้ไม่ปนกับข้อมูลตัวอย่าง
 */
function buildBlank(o) {
  o = o || {};
  /* ★ ตรวจให้ครบก่อนแตะข้อมูลเดิมแม้แต่ฟิลด์เดียว
     ถ้าตรวจหลังจากเขียนทับไปแล้ว การกรอกผิดครั้งเดียวจะลบข้อมูลบริษัทเดิมทิ้ง */
  const taxId = String(o.taxId || '').trim();
  if (taxId && !validTaxId(taxId)) {
    throw new DomainError('TAX_ID_INVALID',
      'เลขประจำตัวผู้เสียภาษี ' + taxId + ' ไม่ผ่านการตรวจหลักที่ 13',
      'ตรวจเลขกับหนังสือรับรองของบริษัท หรือเว้นว่างไว้ก่อนแล้วมาแก้ทีหลัง');
  }
  const year = Number(o.year);
  if (!Number.isInteger(year) || year < 2000 || year > 2100) {
    throw new DomainError('FISCAL_YEAR_INVALID',
      'ปีของรอบบัญชีต้องเป็น ค.ศ. ระหว่าง 2000 ถึง 2100 (ได้รับ "' + o.year + '")',
      'ปี พ.ศ. 2569 คือ ค.ศ. 2026');
  }

  /* ล้างทุกอย่างจากแม่แบบเดียวใน engine.js ห้ามไล่เขียนทีละฟิลด์ตรงนี้
     ไม่งั้นพอเพิ่มประเภทเอกสารใหม่ ที่นี่จะลืมแล้วสร้างบริษัทใหม่จะพัง */
  const fresh = blankState();
  Object.keys(DB).forEach((k) => { if (!(k in fresh)) delete DB[k]; });
  Object.keys(fresh).forEach((k) => { DB[k] = fresh[k]; });

  DB.company = {
    name: String(o.name || '').trim() || 'บริษัทของฉัน จำกัด',
    nameEn: '',
    taxId: taxId,
    regNo: taxId,
    address: String(o.address || '').trim(),
    branch: '00000', branchName: 'สำนักงานใหญ่', phone: '',
    fiscalYear: String(year + 543),
    standard: 'TFRS for NPAEs',
    bookkeeper: '', auditor: '',
    paidUpCapital: 0, vatRegistered: true,
  };
  loadChart();
  loadPeriods(year);
  DB.isDemo = false;
  audit('company', 'blank', 'create', null, { name: DB.company.name, year: DB.company.fiscalYear });
  return DB.company;
}

function monthsBetween(a, b) {
  const [ay, am] = a.split('-').map(Number);
  const [by, bm] = b.split('-').map(Number);
  return Math.max(0, (by - ay) * 12 + (bm - am) + 1);
}

/* ---------- สุ่มแบบกำหนดผลได้ (ผลลัพธ์เหมือนเดิมทุกครั้ง) ---------- */
let _seed = 20260731;
function rnd() { _seed = (_seed * 1103515245 + 12345) & 0x7fffffff; return _seed / 0x7fffffff; }
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const rint = (a, b) => a + Math.floor(rnd() * (b - a + 1));

/* ---------- สร้างธุรกรรม ม.ค.–มิ.ย. 2569 ---------- */
function generateTransactions() {
  // ม.ค.–มิ.ย. ปิดงวดครบแล้ว · ก.ค. เปิดอยู่ ยังไม่ได้ทำเงินเดือน ค่าเสื่อม และยื่นภาษี
  // เพื่อให้มีงานค้างจริงให้ผู้ใช้ทดลองทำ
  const months = ['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07'];
  const CLOSED_THROUGH = '2026-06';
  const stockItems = DB.items.filter((i) => i.type === 'stock');
  const svcItems = DB.items.filter((i) => i.type === 'service');
  const customers = DB.partners.filter((p) => p.kind === 'customer');
  const vendors = DB.partners.filter((p) => p.kind === 'vendor');

  months.forEach(function (mo, mi) {
    const last = Number(endOfMonth(mo + '-01').slice(-2));

    // ---- ขาย ----
    const salesCount = 12 + (mi % 3);
    for (let k = 0; k < salesCount; k++) {
      const c = customers[(mi * 3 + k) % customers.length];
      const lines = [];
      const nItems = rint(1, 3);
      for (let j = 0; j < nItems; j++) {
        const it = stockItems[(mi + k + j) % stockItems.length];
        if (it.qty < 3) continue;
        const qty = Math.max(1, Math.min(Math.floor(it.qty / 3), rint(1, 6)));
        lines.push({ desc: it.name, qty, price: String(divRound(it.price, S)),
                     uom: it.uom, itemCode: it.code, revenueSub: 'sales_revenue' });
      }
      if (rnd() > 0.5) {
        const sv = pick(svcItems);
        lines.push({ desc: sv.name, qty: 1, price: String(rint(25, 120) * 1000),
                     uom: 'งาน', revenueSub: 'service_revenue' });
      }
      if (!lines.length) continue;
      issueInvoice({ date: mo + '-' + String(rint(2, Math.min(28, last))).padStart(2, '0'),
                     partnerCode: c.code, lines });
    }

    // ---- เติมสต๊อกตามที่ขายไปจริง (นโยบายจุดสั่งซื้อ) ----
    let poSeq = 0;
    stockItems.forEach(function (it, idx) {
      if (it.qty > it.reorder) return;
      const target = it.reorder * 3;
      const qty = target - it.qty;
      if (qty <= 0) return;
      poSeq += 1;
      const v = vendors[idx % 2 === 0 ? 0 : 1];
      recordBill({
        date: mo + '-' + String(Math.min(last, 4 + poSeq * 2)).padStart(2, '0'),
        partnerCode: v.code,
        vendorNo: (v.code === 'VEN-0001' ? 'ASI-69-' : 'TPS-69-') + (1000 + mi * 20 + poSeq),
        lines: [{ desc: 'สั่งซื้อเติมสต๊อก ' + it.name, qty,
                  price: String(divRound(it.avgCost, S)),
                  expenseSub: 'inventory', itemCode: it.code }],
      });
    });

    // ---- ค่าใช้จ่ายประจำเดือน ----
    const recurring = [
      { v:'VEN-0012', no:'TNP-69-', desc:'ค่าเช่าอาคารสำนักงานและโกดัง', amt:'120000', acc:'5321', wht:'WHT_RENT', day:1 },
      { v:'VEN-0009', no:'SBN-69-', desc:'ค่าขนส่งสินค้าประจำเดือน', amt:String(rint(60, 95) * 1000), acc:'5230', wht:'WHT_TRANSPORT', day:25 },
      { v:'VEN-0025', no:'OFM-69-', desc:'วัสดุสิ้นเปลืองสำนักงาน', amt:String(rint(12, 28) * 1000), acc:'5324', wht:null, day:12 },
      { v:'VEN-0030', no:'ENG-69-', desc:'ค่าน้ำมันรถยนต์นั่งผู้บริหาร', amt:String(rint(14, 22) * 1000), acc:'5327', wht:null, day:20, nonClaim:true },
    ];
    if (mi % 2 === 0) {
      recurring.push({ v:'VEN-0015', no:'MDP-69-', desc:'ค่าโฆษณาออนไลน์', amt:'200000', acc:'5220', wht:'WHT_ADVERT', day:18 });
    }
    if (mi % 3 === 1) {
      recurring.push({ v:'VEN-0021', no:'MAL-69-', desc:'ค่าที่ปรึกษาระบบบัญชี', amt:'50000', acc:'5334', wht:'WHT_PROF', day:15 });
    }
    recurring.forEach(function (r, ri) {
      recordBill({
        date: mo + '-' + String(r.day).padStart(2, '0'),
        partnerCode: r.v, vendorNo: r.no + (mi * 10 + ri + 100),
        lines: [{ desc: r.desc, qty: 1, price: r.amt, acc: r.acc }],
        whtCode: r.wht, nonClaimableVat: !!r.nonClaim,
      });
    });

    // ---- ใบลดหนี้เดือนละไม่เกิน 1 ใบ ----
    if (mi >= 1 && rnd() > 0.5) {
      const target = DB.docs.invoice.find((d) => periodOf(d.date) === mo && d.base > M('50000') && !d.credited);
      if (target) {
        try {
          issueCreditNote({ date: mo + '-' + String(Math.min(28, last)).padStart(2, '0'),
            invoiceNo: target.no, base: String(divRound(round2(divRound(target.base, 12)), S)),
            reason: pick(['RETURN_DEFECT','PRICE_REDUCE','CALC_ERROR']) });
        } catch (e) { /* ข้ามถ้าเงื่อนไขไม่ผ่าน */ }
      }
    }

    // ---- วงจรก่อนลงบัญชี: ใบเสนอราคา → ใบสั่งขาย → ใบกำกับภาษี ----
    const quoteCust = customers[(mi * 3) % customers.length];
    const quoteLines = [{ desc:'งานติดตั้งและวางระบบตามข้อเสนอเดือน ' + thPeriod(mo),
                          qty:1, price:String(rint(80, 260) * 1000), revenueSub:'service_revenue' }];
    const q1 = issueTradeDoc('quotation', {
      date: mo + '-' + String(rint(2, 6)).padStart(2, '0'),
      partnerCode: quoteCust.code, lines: quoteLines, note:'ยืนราคา 30 วัน ชำระภายใน 30 วันนับจากวันส่งมอบ',
    });
    /* ใบที่ลูกค้าตอบรับ เดินต่อเป็นใบสั่งขายแล้วออกใบกำกับในเดือนเดียวกัน
       ใบที่เหลือปล่อยค้างไว้ให้เห็นสถานะจริงว่ามีทั้งรอผล ปฏิเสธ และหมดอายุ */
    if (mi % 3 !== 2) {
      setTradeDocStatus('quotation', q1.no, 'approved');
      const so = convertTradeDoc('quotation', q1.no, { date: mo + '-' + String(rint(7, 10)).padStart(2, '0') });
      if (mi < months.length - 1) {
        convertTradeDoc('salesOrder', so.no, { date: mo + '-' + String(rint(12, 20)).padStart(2, '0') });
      }
    } else {
      setTradeDocStatus('quotation', q1.no, 'rejected', 'ลูกค้าเลือกผู้เสนอราคารายอื่น');
    }

    // ---- ใบสั่งซื้อ: ออกทุกเดือน แปลงเป็นตั้งหนี้เมื่อผู้ขายส่งใบกำกับมาแล้ว ----
    const poVendor = vendors[mi % vendors.length];
    const po = issueTradeDoc('purchaseOrder', {
      date: mo + '-' + String(rint(3, 8)).padStart(2, '0'),
      partnerCode: poVendor.code,
      lines: [{ desc:'สั่งซื้อวัสดุและอุปกรณ์ตามแผนเดือน ' + thPeriod(mo),
                qty:1, price:String(rint(20, 60) * 1000), acc:'5324' }],
      note:'ส่งของภายใน 15 วัน',
    });
    if (mi % 2 === 0) {
      convertTradeDoc('purchaseOrder', po.no, {
        date: mo + '-' + String(rint(14, Math.min(24, last))).padStart(2, '0'),
        vendorNo: 'PO-' + poVendor.code.slice(-4) + '-' + mo.replace('-', '') + '-1',
        acc: '5324',
      });
    }

    // ---- ใบเพิ่มหนี้: คิดราคาต่ำไปแล้วต้องเก็บเพิ่ม (มาตรา 86/9) ----
    if (mi === 3) {
      const dnTarget = DB.docs.invoice.find((d) => periodOf(d.date) === mo && d.base > M('50000') && !d.debited);
      if (dnTarget) {
        try {
          issueDebitNote({ date: mo + '-' + String(Math.min(27, last)).padStart(2, '0'),
            invoiceNo: dnTarget.no, base: String(divRound(round2(divRound(dnTarget.base, 20)), S)),
            reason: 'GOODS_UNDERPRICED' });
        } catch (e) { /* ข้ามถ้าเงื่อนไขไม่ผ่าน */ }
      }
    }

    // ---- รับชำระใบที่ครบกำหนดแล้ว ----
    DB.docs.invoice.filter((d) => d.status === 'issued' && !d.broughtForward
        && d.due <= endOfMonth(mo + '-01') && d.due >= '2026-01-01')
      .forEach(function (inv) {
        const hasService = inv.lines.some((l) => l.desc.indexOf('ค่า') === 0);
        try {
          receivePayment({ date: inv.due, invoiceNo: inv.no,
            method: pick(['transfer','transfer','cheque','promptpay']),
            whtCode: hasService ? 'WHT_SERVICE' : null });
        } catch (e) { /* ข้าม */ }
      });

    // ---- จ่ายชำระเจ้าหนี้ที่ครบกำหนด ----
    DB.docs.bill.filter((b) => b.status === 'issued' && !b.broughtForward
        && b.due <= endOfMonth(mo + '-01'))
      .forEach(function (bill) {
        try {
          payBill({ date: bill.due, billNo: bill.no,
            channel: bill.whtCode && rnd() > 0.5 ? 'e_wht' : 'manual',
            whtCode: bill.whtCode });
        } catch (e) { /* ข้าม */ }
      });

    // ---- ดอกเบี้ยเงินกู้และค่าธรรมเนียมธนาคาร ----
    const finCost = M(String(rint(18, 26) * 1000));
    post({
      type: 'general', date: endOfMonth(mo + '-01'),
      desc: 'ดอกเบี้ยเงินกู้และค่าธรรมเนียมธนาคารประจำเดือน',
      lines: [
        { acc: accBySub('finance_cost'), dr: finCost },
        { acc: accBySub('bank'), cr: finCost },
      ],
    });

    // ---- งานสิ้นงวด: ทำเฉพาะงวดที่ปิดไปแล้ว ----
    if (mo <= CLOSED_THROUGH) {
      runPayroll(mo);
      runDepreciation(mo);
      fileVat(mo);
      ['PND1','PND3','PND53'].forEach(function (f) {
        try { fileWht(mo, f); } catch (e) { /* ไม่มีรายการก็ข้าม */ }
      });
    }
  });

  // ---- รายการเดินบัญชีที่ยังไม่กระทบยอด (เดือน ก.ค.) ----
  DB.bankTxns = [
    { id:1, date:'2026-07-03', desc:'INTEREST RECEIVED', ref:'INT690703', debit:0, credit:M('1842'), matched:false, suggest:'ดอกเบี้ยรับ — ยังไม่มีรายการในระบบ' },
    { id:2, date:'2026-07-08', desc:'FEE - REMITTANCE', ref:'FEE690708', debit:M('350'), credit:0, matched:false, suggest:'ค่าธรรมเนียมโอนเงิน — ยังไม่มีรายการในระบบ' },
    { id:3, date:'2026-07-15', desc:'TRANSFER FROM 6890', ref:'TR690715', debit:0, credit:M('240000'), matched:false, suggest:'ไม่แน่ใจ — มีใบแจ้งหนี้ยอดใกล้เคียง 3 ใบ' },
  ];

  julySamples();
}

    lines: [{ desc: mc.name, qty: 6, price: unM(mc.avgCost), itemCode: mc.code }], note: 'ส่งของภายใน 7 วัน' });
  receiveGoodsFromPo(po.no, { date: '2026-07-21', vendorDoNo: 'ASI-DO-6907-033' });

  // ค่าใช้จ่ายจ่ายทันที — ใบที่หัก ณ ที่จ่าย 3% ได้หนังสือรับรอง 50 ทวิ อัตโนมัติ
  recordExpense({ partnerCode: 'VEN-0025', date: '2026-07-24', taxInvoiceNo: 'OFM-6907-551',
    lines: [{ desc: 'กระดาษและหมึกพิมพ์สำนักงาน', qty: 1, price: '8500', acc: '5324' }] });
  recordExpense({ partnerCode: 'VEN-0012', date: '2026-07-28', taxInvoiceNo: 'TNP-SV-6907-09',
    lines: [{ desc: 'ค่าซ่อมแซมระบบไฟฟ้าอาคารสำนักงาน', qty: 1, price: '25000', acc: '5325' }],
    whtCode: 'WHT_SERVICE', channel: 'manual' });

  // ใบเตรียมจ่าย — รวบเจ้าหนี้ที่ครบกำหนดต้นเดือนหน้าไว้รออนุมัติ
  const due = DB.docs.bill.filter((b) => !b.broughtForward && billOutstanding(b) > 0 && b.due <= '2026-08-10')
    .sort((a, b) => (a.due < b.due ? -1 : 1)).slice(0, 4).map((b) => b.no);
  if (due.length) {
    createPaymentBatch({ date: '2026-07-29', payDate: '2026-08-05', billNos: due, note: 'รอบจ่ายวันที่ 5 สิงหาคม' });

/* ===== sync.js ===== */
/* ===================================================================
   ซิงก์ข้อมูลกับเซิร์ฟเวอร์
   ถ้าเซิร์ฟเวอร์ต่อฐานข้อมูลไว้ ทุกเครื่องจะเห็นข้อมูลชุดเดียวกัน
   ถ้าไม่ได้ต่อ ก็กลับไปเก็บในเบราว์เซอร์เหมือนเดิม ไม่ต้องแก้อะไร
   =================================================================== */
const SYNC = {
  mode: 'browser',        // 'browser' | 'server'
  book: 'default',        // สมุดบัญชีที่เปิดอยู่ = หนึ่งบริษัท
  books: [],              // [{book, name, taxId, entries}]
  version: 0,
  needsPasscode: false,
  passcode: '',
  status: 'idle',         // idle | saving | saved | error | conflict | locked
  message: '',
  pending: false,
  timer: null,
  retry: null,
};
const PASS_KEY = 'financii.passcode';

/** ส่วนหัวของ HTTP รับได้แค่ ASCII รหัสผ่านภาษาไทยจึงต้องแปลงเป็น base64 ก่อนส่ง */
function encodePass(s) {
  const bytes = new TextEncoder().encode(String(s));
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
const syncHeaders = () => {
  const h = { 'content-type': 'application/json' };
  if (SYNC.passcode) h['x-passcode'] = encodePass(SYNC.passcode);
  return h;
};

function setStatus(s, msg) {
  SYNC.status = s;
  SYNC.message = msg || '';
  const el = document.getElementById('syncTag');
  if (!el) return;
  const map = {
    idle:     ['', ''],
    saving:   ['saving', 'กำลังบันทึก…'],
    saved:    ['saved', 'บันทึกขึ้นเซิร์ฟเวอร์แล้ว'],
    error:    ['error', 'บันทึกไม่สำเร็จ'],
    conflict: ['error', 'มีการแก้จากอีกเครื่อง'],
    locked:   ['error', 'ต้องใส่รหัสผ่าน'],
  };
  const m = map[s] || ['', ''];
  el.className = 'sync-tag ' + m[0];
  el.textContent = SYNC.mode === 'server' ? m[1] : '';
  el.title = SYNC.message;
}

async function syncConfig() {
  /* เปิดไฟล์ตรง ๆ จากเครื่อง ไม่มีเซิร์ฟเวอร์ให้ถาม และการเรียก fetch จะพ่นข้อผิดพลาดเปล่า ๆ */
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return false;
  try {
    const r = await fetch('/api/config');
    if (!r.ok) return false;
    const c = await r.json();
    SYNC.mode = c.storage === 'server' ? 'server' : 'browser';
    SYNC.needsPasscode = Boolean(c.needsPasscode);
    return SYNC.mode === 'server';
  } catch (e) {
    return false;                       // เปิดจากไฟล์ในเครื่อง ไม่มีเซิร์ฟเวอร์
  }
}

/** ดึงข้อมูลจากเซิร์ฟเวอร์ — คืน 'ok' | 'empty' | 'locked' | 'error' */
async function syncBooks() {
  if (SYNC.mode !== 'server') return SYNC.books;
  try {
    const r = await fetch('/api/books', { headers: syncHeaders() });
    if (!r.ok) return SYNC.books;
    const b = await r.json();
    SYNC.books = b.books || [];
  } catch (e) { /* ไม่เป็นไร ใช้รายชื่อเดิมไปก่อน */ }
  return SYNC.books;
}

async function syncPull() {
  try {
    const r = await fetch('/api/state?book=' + encodeURIComponent(SYNC.book), { headers: syncHeaders() });
    if (r.status === 401) { setStatus('locked'); return 'locked'; }
    if (!r.ok) { setStatus('error', 'อ่านข้อมูลจากเซิร์ฟเวอร์ไม่ได้'); return 'error'; }
    const s = await r.json();
    SYNC.version = s.version || 0;
    if (!s.data) { loadState(null); return 'empty'; }
    loadState(s.data);          // ★ แทนที่ทั้งก้อน ไม่ผสมกับบริษัทที่เปิดอยู่ก่อนหน้า
    setStatus('saved', 'ดึงข้อมูลรุ่นที่ ' + SYNC.version + ' มาแล้ว');
    return 'ok';
  } catch (e) {
    setStatus('error', e.message);
    return 'error';
  }
}

async function syncPush() {
  if (SYNC.mode !== 'server') return;
  SYNC.pending = false;
  setStatus('saving');
  try {
    const r = await fetch('/api/state?book=' + encodeURIComponent(SYNC.book), {
      method: 'PUT',
      headers: syncHeaders(),
      body: JSON.stringify({ version: SYNC.version, data: DB }),
    });
    if (r.status === 401) { setStatus('locked'); return; }
    if (r.status === 409) {
      /* อีกเครื่องบันทึกแทรกเข้ามา — ไม่เขียนทับ ให้ดึงของใหม่มาแทน
         ข้อมูลบัญชีหายเงียบ ๆ ไม่ได้ ต้องบอกให้รู้ทุกครั้ง */
      const s = await r.json();
      SYNC.version = s.version || 0;
      if (s.data) loadState(s.data);
      setStatus('conflict');
      toast('มีการบันทึกจากอีกเครื่อง', 'err',
        'ระบบดึงข้อมูลล่าสุดมาแสดงแทนแล้ว สิ่งที่เพิ่งทำอาจต้องทำซ้ำ');
      render();
      return;
    }
    if (!r.ok) {
      const b = await r.json().catch(() => null);
      setStatus('error', (b && b.error && b.error.message) || ('HTTP ' + r.status));
      scheduleRetry();
      return;
    }
    const b = await r.json();
    SYNC.version = b.version;
    setStatus('saved', 'รุ่นที่ ' + SYNC.version);
    syncBooks();                // ให้รายชื่อบริษัทอัปเดตชื่อและจำนวนรายการตาม
  } catch (e) {
    setStatus('error', e.message);
    scheduleRetry();
  }
}

function scheduleRetry() {
  clearTimeout(SYNC.retry);
  SYNC.retry = setTimeout(function () { if (SYNC.pending || SYNC.status === 'error') syncPush(); }, 5000);
}

/** รวบการบันทึกหลายครั้งติดกันให้ยิงครั้งเดียว */
function syncSave() {
  SYNC.pending = true;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(syncPush, 500);
}

function syncPasscodeScreen(wrong) {
  return card({

      + '</div>',

/** สลับบริษัท — ต้องบันทึกของเดิมให้จบก่อน แล้วค่อยยกข้อมูลใหม่เข้ามาแทนทั้งก้อน */
async function syncSwitch(book) {
  if (SYNC.mode === 'server') {
    clearTimeout(SYNC.timer);
    if (SYNC.pending) await syncPush();
    SYNC.book = book;
    SYNC.version = 0;
    const r = await syncPull();
    if (r === 'empty') { loadState(null); return 'empty'; }
    return r;
  }
  booksSaveActive();
  SYNC.book = book;
  return booksLoadLocal(book) ? 'ok' : 'empty';
}

async function syncUnlock(code) {
  SYNC.passcode = code;
  const r = await syncPull();
  if (r === 'locked') { SYNC.passcode = ''; return false; }
  try { localStorage.setItem(PASS_KEY, code); } catch (e) { /* ปิดการเก็บข้อมูลไว้ */ }
  if (r === 'empty') { buildSeed(); await syncPush(); }
  return true;
}

/* ---------- เก็บข้อมูลไว้ในเครื่อง — หนึ่งบริษัทหนึ่งสมุด ---------- */
const LS_OLD = 'duly.demo.v1';                 // รูปแบบเดิมสมัยรองรับบริษัทเดียว
const LS_BOOKS = 'financii.books';
const LS_ACTIVE = 'financii.activeBook';
const bookKey = (id) => 'financii.book.' + id;

const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) {} };

function booksList() {
  try { return JSON.parse(lsGet(LS_BOOKS) || '[]'); } catch (e) { return []; }
}
function booksWrite(list) { lsSet(LS_BOOKS, JSON.stringify(list)); }

/**
 * ย้ายข้อมูลที่เก็บไว้ใต้ชื่อเดิม (duly.*) มาไว้ใต้ชื่อใหม่ (financii.*)
 * ทำครั้งเดียวตอนเปิดครั้งแรกหลังเปลี่ยนชื่อ ไม่ลบของเดิมทิ้งจนกว่าจะคัดลอกสำเร็จ
 */
function booksRebrand() {
  if (lsGet(LS_BOOKS)) return;
  const oldBooks = lsGet('duly.books');
  if (!oldBooks) return;
  let moved = 0;
  try {
    JSON.parse(oldBooks).forEach(function (b) {
      const data = lsGet('duly.book.' + b.id);
      if (data && lsSet(bookKey(b.id), data)) moved++;
    });
    if (!lsSet(LS_BOOKS, oldBooks)) return;
    const act = lsGet('duly.activeBook');
    if (act) lsSet(LS_ACTIVE, act);
    JSON.parse(oldBooks).forEach(function (b) { lsDel('duly.book.' + b.id); });
    lsDel('duly.books');
    lsDel('duly.activeBook');
  } catch (e) { /* ย้ายไม่สำเร็จก็ปล่อยของเดิมไว้ ดีกว่าทำหาย */ }
  return moved;
}

/** ย้ายข้อมูลรูปแบบเดิมมาเป็นสมุดแรก ผู้ใช้เดิมต้องไม่เสียข้อมูล */
function booksMigrate() {
  if (booksList().length) return;
  const old = lsGet(LS_OLD);
  if (!old) return;
  try {
    const d = JSON.parse(old);
    if (!d || !d.DB || !d.DB.company) return;
    lsSet(bookKey('default'), old);
    booksWrite([{ id: 'default', name: d.DB.company.name, taxId: d.DB.company.taxId || null }]);
    lsSet(LS_ACTIVE, 'default');
    lsDel(LS_OLD);
  } catch (e) { /* อ่านไม่ออกก็ปล่อยไว้ ไม่ลบของเดิมทิ้ง */ }
}

function booksSaveActive() {
  if (SYNC.mode === 'server') return;
  lsSet(bookKey(SYNC.book), JSON.stringify({ DB, STATE: { period: STATE.period } }));
  const list = booksList();
  const at = list.findIndex((b) => b.id === SYNC.book);
  const meta = { id: SYNC.book, name: DB.company ? DB.company.name : SYNC.book,
    taxId: DB.company ? DB.company.taxId : null, entries: DB.entries.length };
  if (at >= 0) list[at] = meta; else list.push(meta);
  booksWrite(list);
  lsSet(LS_ACTIVE, SYNC.book);
  SYNC.books = list.map((b) => ({ book: b.id, name: b.name, taxId: b.taxId, entries: b.entries || 0 }));
}

function booksLoadLocal(id) {
  const raw = lsGet(bookKey(id));
  if (!raw) { loadState(null); return false; }
  try {
    const d = JSON.parse(raw);
    const ok = loadState(d && d.DB);
    if (ok && d.STATE && d.STATE.period) STATE.period = d.STATE.period;
    lsSet(LS_ACTIVE, id);
    return ok;
  } catch (e) { loadState(null); return false; }
}

function save() {
  if (SYNC.mode === 'server') { syncSave(); return; }
  booksSaveActive();
}
function load() {
  booksRebrand();
  booksMigrate();
  const list = booksList();
  SYNC.books = list.map((b) => ({ book: b.id, name: b.name, taxId: b.taxId, entries: b.entries || 0 }));
  if (!list.length) return false;
  const active = lsGet(LS_ACTIVE);
  const id = list.some((b) => b.id === active) ? active : list[0].id;
  SYNC.book = id;
  return booksLoadLocal(id);
}
function resetAll() {
  if (SYNC.mode === 'server') {
    buildSeed();
    syncPush().then(() => location.reload());
    return;
  }
  buildSeed();
  booksSaveActive();
  location.reload();
}

/** เพิ่มบริษัทใหม่ — สมุดใหม่ที่ไม่แตะข้อมูลของบริษัทอื่นเลย */
function booksNewId(name) {
  const base = 'co-' + String(name || '').replace(/[^A-Za-z0-9]+/g, '').slice(0, 12).toLowerCase();
  const taken = new Set((SYNC.books || []).map((b) => b.book));
  let id = base.length > 3 ? base : 'co';
  let n = 1;
  while (taken.has(id)) { id = (base.length > 3 ? base : 'co') + '-' + (++n); }
  return id;
}

/* ---------- โหมดสว่าง/มืด — ไม่ตั้ง = ตามเครื่อง · ตั้งแล้วจำไว้ในเครื่องนี้ ---------- */
const THEME_KEY = 'financii.theme';
function themeNow() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(t) {
  if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
function toggleTheme() {
  const next = themeNow() === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  lsSet(THEME_KEY, next);
  render();
}

/** รายชื่อหน้าจอทั้งหมด ไม่ว่าจะอยู่ในหมวดย่อยชั้นไหน */
function navScreens() {
  const out = [];
  navGroups().forEach(function (g) {
    (g.items || []).forEach((i) => out.push(i[0]));
    (g.subs || []).forEach((s) => s.items.forEach((i) => out.push(i[0])));
  });
  return out;
}

/** ตำแหน่งของหน้าจอในเมนู — ใช้ทำเส้นทาง (กลุ่ม › หมวดย่อย › หน้า) และกางกลุ่มให้เอง */
function navWhere(screen) {
  let found = null;
  navGroups().forEach(function (g) {
    (g.items || []).forEach(function (i) { if (i[0] === screen) found = { g: g, sub: null, item: i }; });
    (g.subs || []).forEach(function (s) {
      s.items.forEach(function (i) { if (i[0] === screen) found = { g: g, sub: s, item: i }; });
    });
  });
  return found;
}
/** หมวดย่อยที่มีหน้าจอปัจจุบันอยู่ ต้องกางไว้เสมอ ผู้ใช้จะได้เห็นว่าตัวเองอยู่ตรงไหน */
function navSubOf(screen) {
  const w = navWhere(screen);
  return w && w.sub ? w.sub.s : null;
}
function navGroupIsOpen(g) {
  if (STATE.navGroupOpen[g.g] !== undefined) return STATE.navGroupOpen[g.g];
  const w = navWhere(STATE.screen);
  return !!(w && w.g.g === g.g);
}

/* ---------- โครงหน้าจอ ---------- */
function renderNav() {
  const groups = navGroups();
  const openSub = navSubOf(STATE.screen);
  const where = navWhere(STATE.screen);
  const badge = (n) => (n ? '<span class="badge">' + n + '</span>' : '');
  const item = (it, cls) => '<a href="#" class="nav-i ' + cls + (STATE.screen === it[0] ? ' on' : '')
    + '" data-act="go:' + it[0] + '"' + (STATE.screen === it[0] ? ' aria-current="page"' : '') + '>'
    + (cls === 'flat' ? icon(it[3] || 'file') : '') + '<span>' + esc(it[1]) + '</span>' + badge(it[2]) + '</a>';
  let nav = '';
  groups.forEach(function (g) {
    if (g.sec) nav += '<div class="nav-sec">' + esc(g.sec) + '</div>';
    if (g.flat) { g.items.forEach(function (it) { nav += item(it, 'flat'); }); return; }
    const open = navGroupIsOpen(g);
    const sum = (g.items || []).reduce((n, i) => n + (i[2] || 0), 0)
      + (g.subs || []).reduce((n, s) => n + s.items.reduce((m, i) => m + (i[2] || 0), 0), 0);
    nav += '<button class="nav-gh' + (open ? ' open' : '') + (where && where.g.g === g.g ? ' has-on' : '')
      + '" data-act="navg:' + esc(g.g) + '" aria-expanded="' + (open ? 'true' : 'false') + '">'
      + icon(g.icon) + '<span>' + esc(g.g) + '</span>' + (open ? '' : badge(sum)) + icon('chev', 'chev') + '</button>';
    if (!open) return;
    (g.items || []).forEach(function (it) { nav += item(it, 'child'); });
    (g.subs || []).forEach(function (s) {
      const sOpen = STATE.navOpen[s.s] === undefined ? s.s === openSub : STATE.navOpen[s.s];
      nav += '<button class="nav-s' + (sOpen ? ' open' : '') + '" data-act="nav:' + esc(s.s) + '"'
        + ' aria-expanded="' + (sOpen ? 'true' : 'false') + '">'
        + '<span class="chev" aria-hidden="true">›</span>' + esc(s.s)
        + (!sOpen && s.items.some((i) => i[2]) ? badge(s.items.reduce((n, i) => n + (i[2] || 0), 0)) : '')
        + '</button>';
      if (sOpen) s.items.forEach(function (it) { nav += item(it, 'sub'); });
    });
  });
  document.getElementById('nav').innerHTML = nav;
}

/** เส้นทางบนแถบบน: กลุ่ม › หมวดย่อย › หน้า */
function renderCrumb() {
  const w = navWhere(STATE.screen);
  const sep = '<span class="sep">/</span>';
  const extra = { importResult: ['ระบบ', 'ผลการนำเข้า'] }[STATE.screen];
  let h = '';
  if (w) {
    if (!w.g.flat) h += '<span class="grp">' + esc(w.g.g) + '</span>' + sep;
    if (w.sub) h += '<span class="grp">' + esc(w.sub.s) + '</span>' + sep;
    h += '<b>' + esc(w.item[1]) + '</b>';
  } else if (extra) {
    h = '<span class="grp">' + esc(extra[0]) + '</span>' + sep + '<b>' + esc(extra[1]) + '</b>';
  }
  document.getElementById('crumb').innerHTML = h;
}

    + '</div></div>'
    + '<div class="co-acts"><button class="add-co" data-act="company:new" title="เพิ่มบริษัท">+ บริษัท</button>'
    + (DB.isDemo
        ? '<button class="demo-tag" data-act="go:import" title="ข้อมูลชุดนี้ระบบสร้างขึ้นเพื่อให้ลองใช้">'
          + 'ข้อมูลตัวอย่าง · เริ่มใช้ของจริง</button>'
        : '')
    + '</div>';

  const fn = SCREENS[STATE.screen] || SCREENS.dashboard;
  let html;
  try { html = pageContext(STATE.screen) + fn(); }
  catch (e) {
    console.error(e);
    html = card({ title:'เปิดหน้านี้ไม่ได้', body:'<div class="empty">' + esc(e.message) + '</div>' });
  }
  const main = document.getElementById('main');
  main.innerHTML = html;
  /* เลื่อนขึ้นบนสุดเฉพาะตอนเปลี่ยนหน้าหรือเปิดเอกสารใบใหม่ (รายละเอียดอยู่บนสุดของหน้า)
     ถ้าเลื่อนทุกครั้งที่วาดใหม่ แค่พิมพ์ในช่องค้นหาหน้าก็จะกระโดดขึ้นไปบนสุด */
  const spot = STATE.screen + '|' + (STATE.sel || '');
  if (spot !== render.lastSpot) window.scrollTo(0, 0);
  render.lastSpot = spot;
}


/* ===== import.js ===== */
/* ===================================================================
   นำเข้าข้อมูลจากระบบบัญชีเดิม
   อ่านได้ทั้งไฟล์ Excel (.xlsx) ไฟล์ CSV และแฟ้มข้อมูลจากตัวดึง FlowAccount
   ทุกจำนวนเงินผ่าน M() เสมอ ไม่มีการคำนวณต่อจากทศนิยมลอยตัว
   =================================================================== */

/* ---------- CSV ---------- */
function parseCsv(text) {
  const rows = [];
  let row = [], cell = '', q = false;
  const src = String(text).replace(/^﻿/, '');
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (q) {
      if (c === '"') { if (src[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',' || c === '\t') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((x) => String(x).trim() !== ''));
}

/* ---------- .xlsx คือไฟล์ zip ที่ข้างในเป็น XML ---------- */
const u16 = (b, o) => b[o] | (b[o + 1] << 8);
const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;

async function inflateRaw(bytes) {
  if (typeof DecompressionStream === 'undefined') {
    throw new DomainError('XLSX_UNSUPPORTED',
      'เบราว์เซอร์นี้ยังแตกไฟล์ .xlsx ไม่ได้',
      'เปิดไฟล์ใน Excel แล้วสั่ง Save As เป็น CSV จากนั้นลากไฟล์ CSV มาวางแทน');
  }
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/** อ่านสารบัญกลางของ zip แล้วคลายเฉพาะไฟล์ที่ต้องใช้ */
async function unzipEntries(buf, wanted) {
  const b = new Uint8Array(buf);
  let eocd = -1;
  for (let i = b.length - 22; i >= 0 && i > b.length - 66000; i--) {
    if (u32(b, i) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) {
    throw new DomainError('NOT_A_ZIP', 'ไฟล์นี้ไม่ใช่ไฟล์ .xlsx ที่อ่านได้',
      'ตรวจว่าเป็นไฟล์ Excel จริง ไม่ใช่ .xls รุ่นเก่าหรือไฟล์ที่เสียหาย');
  }
  let p = u32(b, eocd + 16);
  const count = u16(b, eocd + 10);
  const out = {};
  for (let i = 0; i < count; i++) {
    if (u32(b, p) !== 0x02014b50) break;
    const nameLen = u16(b, p + 28), extraLen = u16(b, p + 30), cmtLen = u16(b, p + 32);
    const method = u16(b, p + 10), csize = u32(b, p + 20), local = u32(b, p + 42);
    const name = new TextDecoder().decode(b.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extraLen + cmtLen;
    if (wanted && !wanted(name)) continue;
    const lnLen = u16(b, local + 26), leLen = u16(b, local + 28);
    const start = local + 30 + lnLen + leLen;
    const raw = b.subarray(start, start + csize);
    out[name] = method === 0 ? raw : await inflateRaw(raw);
  }
  return out;
}

const xmlDoc = (text) => new DOMParser().parseFromString(text, 'application/xml');

function parseSharedStrings(xml) {
  if (!xml) return [];
  const doc = xmlDoc(xml);
  return Array.from(doc.getElementsByTagName('si')).map(function (si) {
    return Array.from(si.getElementsByTagName('t')).map((t) => t.textContent).join('');
  });
}

const colIndex = (ref) => {
  let n = 0;
  for (let i = 0; i < ref.length; i++) {
    const c = ref.charCodeAt(i);
    if (c < 65 || c > 90) break;
    n = n * 26 + (c - 64);
  }
  return n - 1;
};

function parseSheetXml(xml, shared) {
  const doc = xmlDoc(xml);
  const rows = [];
  Array.from(doc.getElementsByTagName('row')).forEach(function (r) {
    const cells = [];
    Array.from(r.getElementsByTagName('c')).forEach(function (c) {
      const at = colIndex(c.getAttribute('r') || 'A');
      const t = c.getAttribute('t');
      let v = '';
      if (t === 'inlineStr') {
        v = Array.from(c.getElementsByTagName('t')).map((x) => x.textContent).join('');
      } else {
        const node = c.getElementsByTagName('v')[0];
        v = node ? node.textContent : '';
        if (t === 's') v = shared[Number(v)] || '';
      }
      cells[at >= 0 ? at : cells.length] = v;
    });
    for (let i = 0; i < cells.length; i++) if (cells[i] === undefined) cells[i] = '';
    rows.push(cells);
  });
  return rows.filter((r) => r.some((x) => String(x).trim() !== ''));
}

/** ไฟล์จากโปรแกรมบัญชีมักมีหลายแผ่นงาน และงบทดลองไม่ได้อยู่แผ่นแรกเสมอ
    จึงอ่านทุกแผ่นแล้วเลือกแผ่นที่อ่านเป็นงบทดลองได้จริง */
async function readXlsx(buf) {
  const files = await unzipEntries(buf, (n) =>
    n === 'xl/sharedStrings.xml' || /^xl\/worksheets\/sheet\d+\.xml$/.test(n));
  const dec = new TextDecoder();
  const sheetNames = Object.keys(files).filter((n) => n.indexOf('worksheets') >= 0)
    .sort((a, b) => (Number(a.replace(/\D+/g, '')) || 0) - (Number(b.replace(/\D+/g, '')) || 0));
  if (!sheetNames.length) throw new DomainError('NO_SHEET', 'ไม่พบแผ่นงานในไฟล์นี้');
  const shared = parseSharedStrings(files['xl/sharedStrings.xml'] ? dec.decode(files['xl/sharedStrings.xml']) : null);

  let best = null;
  sheetNames.forEach(function (n) {
    const rows = parseSheetXml(dec.decode(files[n]), shared);
    if (!rows.length) return;
    const det = detectColumns(rows);
    const score = (det.ok ? 1e9 : 0) + det.usable * 1000 + rows.length;
    if (!best || score > best.score) best = { rows, score };
  });
  if (!best) throw new DomainError('EMPTY_FILE', 'ไฟล์นี้ไม่มีข้อมูล',
    'ตรวจว่าเลือกไฟล์ที่ดาวน์โหลดมาจริง ไม่ใช่ไฟล์เปล่า');
  return best.rows;
}

/* ---------- ตัวเลขจากไฟล์ภายนอก ---------- */
function parseAmount(s) {
  let t = String(s === null || s === undefined ? '' : s).trim();
  if (!t || t === '-' || t === '—') return '0';
  let neg = false;
  if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
  t = t.replace(/[,\s฿]/g, '').replace(/^บาท/, '');
  if (t.startsWith('-')) { neg = !neg; t = t.slice(1); }
  /* Excel เขียนจำนวนเล็ก ๆ เป็นรูปยกกำลัง เช่น 7.0000000000000007E-2 คือ 0.07
     ถ้าอ่านไม่ออกแล้วข้ามไป งบทดลองจะไม่สมดุลโดยหาสาเหตุไม่เจอ */
  if (!/^\d*(\.\d+)?([eE][+-]?\d+)?$/.test(t) || t === '') return null;
  if (/[eE]/.test(t)) {
    const n = Number(t);
    if (!isFinite(n)) return null;
    t = n.toFixed(6);
  }
  return (neg ? '-' : '') + t;
}

/* ---------- เดาคอลัมน์จากหัวตาราง ---------- */
const COL_HINTS = {
  code:   ['รหัสบัญชี', 'เลขที่บัญชี', 'เลขบัญชี', 'รหัสผังบัญชี', 'รหัส',
           'account code', 'accountcode', 'acc code', 'gl code', 'code', 'a/c'],
  name:   ['ชื่อบัญชี', 'ชื่อผังบัญชี', 'รายการบัญชี', 'ชื่อ',
           'account name', 'accountname', 'account title', 'description', 'name'],
  debit:  ['เดบิต', 'เดบิท', 'ดร.', 'debit', 'dr'],
  credit: ['เครดิต', 'เครดิท', 'คร.', 'credit', 'cr'],
};
/* คำที่บอกว่าคู่เดบิต/เครดิตนี้คือ "ยอดคงเหลือปลายงวด" ซึ่งเป็นคู่ที่เราต้องการ
   งบทดลองมักมีสามคู่: ยอดยกมา · เคลื่อนไหวระหว่างงวด · ยอดคงเหลือ */
const BALANCE_HINTS = ['ยอดคงเหลือ', 'คงเหลือ', 'ยอดสะสม', 'สะสม', 'ยอดยกไป', 'ยกไป',
                       'ปลายงวด', 'สิ้นงวด', 'balance', 'ending', 'closing', 'carryforward'];
/* คำที่บอกว่าเป็นคู่ยอดยกมาต้นงวด — ห้ามหยิบคู่นี้ไปเป็นยอดคงเหลือ */
const OPENING_HINTS = ['ยอดยกมา', 'ยกมา', 'ต้นงวด', 'opening', 'brought'];
const norm = (s) => String(s || '').toLowerCase().replace(/\s+/g, '');
const hitsAny = (n, list) => list.some((h) => n.indexOf(norm(h)) >= 0);

/** เซลล์ที่ผสานกันใน Excel เก็บค่าไว้เฉพาะช่องซ้ายสุด ช่องที่เหลือว่าง
    ต้องลากค่าไปทางขวาก่อน ไม่งั้นหัวกลุ่มอย่าง "ยอดคงเหลือ" จะหายไปครึ่งหนึ่ง
    แต่บรรทัดที่มีข้อความช่องเดียวคือชื่อรายงาน ไม่ใช่หัวกลุ่ม ห้ามลากไปทับทั้งแถว */
function fillRight(row, width) {
  const filled = [];
  for (let j = 0; j < width; j++) {
    filled[j] = String(row[j] === undefined ? '' : row[j]).trim();
  }
  if (filled.filter(Boolean).length < 2) return filled;
  let last = '';
  return filled.map(function (v) {
    if (v) last = v;
    return v || last;
  });
}

/** หัวตารางอาจอยู่บรรทัดเดียว หรือกระจายสองบรรทัด (หัวกลุ่มบน หัวย่อยล่าง)
    จึงต้องลองทั้งสองแบบ ไม่ใช่ดูทีละบรรทัดอย่างเดียว */
function headerCandidates(rows) {
  const out = [];
  const n = Math.min(rows.length, 30);
  for (let i = 0; i < n; i++) {
    out.push({ row: i, span: 1, cells: (rows[i] || []).map((c) => String(c === undefined ? '' : c)) });
    if (i + 1 < n) {
      const w = Math.max((rows[i] || []).length, (rows[i + 1] || []).length);
      const top = fillRight(rows[i] || [], w);
      const bot = rows[i + 1] || [];
      const merged = [];
      for (let j = 0; j < w; j++) {
        merged[j] = top[j] + ' ' + String(bot[j] === undefined ? '' : bot[j]);
      }
      out.push({ row: i + 1, span: 2, cells: merged });
    }
  }
  return out;
}

/** คอลัมน์หนึ่งอาจเข้าได้หลายคำใบ้ เช่น "ชื่อบัญชี" เข้าทั้ง code (คำว่าบัญชี)
    และ name (คำว่าชื่อบัญชี) ต้องให้คำใบ้ที่ยาวกว่าชนะ ไม่ใช่ตัวที่เจอก่อน */
const BARE_CODE_HEADERS = ['บัญชี', 'ผังบัญชี', 'acct', 'account', 'a/c no'];
function bestKeyFor(text) {
  const n = norm(text);
  if (!n) return null;
  /* หัวคอลัมน์ที่เขียนสั้น ๆ ว่า "บัญชี" เฉย ๆ หมายถึงรหัสบัญชี
     ต้องตรงทั้งช่อง ไม่ใช่ไปเจอคำว่าบัญชีในชื่อรายงานยาว ๆ แล้วนับว่าใช่ */
  if (BARE_CODE_HEADERS.indexOf(n) >= 0) return 'code';
  let key = null, len = 0;
  Object.keys(COL_HINTS).forEach(function (k) {
    COL_HINTS[k].forEach(function (h) {
      const hn = norm(h);
      if (n.indexOf(hn) >= 0 && hn.length > len) { len = hn.length; key = k; }
    });
  });
  return key;
}

/** ชื่อชุดตัวเลข เอาจากหัวกลุ่มที่อยู่เหนือคำว่าเดบิต/เครดิต เช่น "ยอดยกมา" */
function pairLabel(text) {
  let t = String(text || '');
  ['เดบิต', 'เดบิท', 'debit', 'dr', 'เครดิต', 'เครดิท', 'credit', 'cr']
    .forEach(function (w) { t = t.replace(new RegExp(w, 'gi'), ' '); });
  return t.replace(/\s+/g, ' ').trim();
}

function mapFromHeader(cells) {
  const found = {}, bal = {};
  const drCols = [], crCols = [];
  cells.forEach(function (cell, j) {
    const n = norm(cell);
    if (!n) return;
    const isBalance = hitsAny(n, BALANCE_HINTS) && !hitsAny(n, OPENING_HINTS);
    const k = bestKeyFor(cell);
    if (!k) return;
    if (k === 'debit' || k === 'credit') {
      found[k] = j;                                    // ไม่เจอคำว่ายอดคงเหลือ ให้เอาคู่ขวาสุด
      (k === 'debit' ? drCols : crCols).push({ col: j, label: pairLabel(cell) });
      if (isBalance && bal[k] === undefined) bal[k] = j;
    } else if (found[k] === undefined) found[k] = j;
  });
  /* งบทดลองมักมีหลายชุด (ยอดยกมา / ยอดประจำงวด / ยอดสะสม) เก็บไว้ให้ผู้ใช้เลือกได้
     ว่าจะตั้งยอดยกมาจากชุดไหน หรือจะลงยอดเคลื่อนไหวของเดือนจากชุดประจำงวด */
  found.pairs = [];
  for (let i = 0; i < Math.min(drCols.length, crCols.length); i++) {
    found.pairs.push({ debit: drCols[i].col, credit: crCols[i].col,
      label: drCols[i].label || crCols[i].label || ('ชุดที่ ' + (i + 1)) });
  }
  if (bal.debit !== undefined && bal.credit !== undefined) {
    found.debit = bal.debit; found.credit = bal.credit;
  }
  /* บางรายงานไม่แยกเดบิต/เครดิต มีคอลัมน์ยอดคงเหลือคอลัมน์เดียวติดลบเป็นเครดิต
     ให้ถือเป็นคอลัมน์เดบิตไว้ก่อน readTrialBalance จะพลิกยอดติดลบไปเครดิตให้เอง */
  if (found.debit === undefined && found.credit === undefined) {
    cells.forEach(function (cell, j) {
      const n = norm(cell);
      if (!n || found.debit !== undefined) return;
      if (hitsAny(n, BALANCE_HINTS) || hitsAny(n, ['จำนวนเงิน', 'ยอดเงิน', 'amount'])) found.debit = j;
    });
  }
  return found;
}

/** นับว่าใต้หัวตารางนี้มีบรรทัดที่อ่านเป็นบัญชีพร้อมยอดได้จริงกี่บรรทัด
    หัวตารางที่เดาถูกจะมีบรรทัดใช้ได้เยอะ ตัวที่เดามั่วจะได้ศูนย์ */
function countUsable(rows, map, headerRow) {
  if (map.code === undefined && map.name === undefined) return 0;
  if (map.debit === undefined && map.credit === undefined) return 0;
  let n = 0;
  rows.slice(headerRow + 1).forEach(function (r) {
    const code = String(r[map.code] === undefined ? '' : r[map.code]).trim();
    const name = String(r[map.name] === undefined ? '' : r[map.name]).trim();
    if (!code && !name) return;
    const dr = map.debit === undefined ? '0' : parseAmount(r[map.debit]);
    const cr = map.credit === undefined ? '0' : parseAmount(r[map.credit]);
    if (dr === null || cr === null) return;
    if (M(dr) === 0 && M(cr) === 0) return;
    n++;
  });
  return n;
}

const COL_KEYS = ['code', 'name', 'debit', 'credit'];
const countKeys = (map) => COL_KEYS.filter((k) => map[k] !== undefined).length;

function detectColumns(rows) {
  let bestScore = -1, best = null;
  headerCandidates(rows).forEach(function (c) {
    const map = mapFromHeader(c.cells);
    const keys = countKeys(map);
    if (keys < 2) return;
    const usable = countUsable(rows, map, c.row);
    /* จำนวนคอลัมน์ที่จับได้มาก่อน แล้วค่อยดูว่าอ่านข้อมูลจริงได้กี่บรรทัด
       บรรทัดที่อ่านได้เป็นตัวตัดสินเวลาหัวตารางหน้าตาคล้ายกันหลายบรรทัด */
    const score = keys * 100000 + Math.min(usable, 99999);
    if (score > bestScore) { bestScore = score; best = { headerRow: c.row, map, keys, usable }; }
  });
  if (!best) return { headerRow: 0, map: {}, keys: 0, usable: 0, ok: false };
  inferNameColumn(rows, best.map, best.headerRow);
  const keys = countKeys(best.map);
  return { headerRow: best.headerRow, map: best.map, keys, usable: best.usable,
           pairs: best.map.pairs || [], ok: keys >= 3 && best.usable > 0 };
}

/** งบทดลองบางฉบับใส่หัวคอลัมน์ไว้แค่ "บัญชี" ช่องเดียว ช่องชื่อบัญชีข้าง ๆ ไม่มีหัว
    ถ้าปล่อยว่างไว้ บัญชีทุกตัวจะไม่มีชื่อ จับคู่ผังบัญชีไม่ได้และผู้ใช้อ่านไม่รู้เรื่อง
    จึงมองหาคอลัมน์ถัดจากรหัสที่เป็นข้อความล้วนแล้วถือว่าเป็นชื่อบัญชี */
function inferNameColumn(rows, map, headerRow) {
  if (map.name !== undefined || map.code === undefined) return;
  const body = rows.slice(headerRow + 1, headerRow + 40)
    .filter((r) => String(r[map.code] === undefined ? '' : r[map.code]).trim() !== '');
  if (!body.length) return;
  for (let j = map.code + 1; j <= map.code + 4; j++) {
    if (j === map.debit || j === map.credit) continue;
    let text = 0, filled = 0;
    body.forEach(function (r) {
      const v = String(r[j] === undefined ? '' : r[j]).trim();
      if (!v) return;
      filled++;
      if (parseAmount(v) === null) text++;
    });
    if (filled >= body.length * 0.6 && text >= filled * 0.8) { map.name = j; return; }
  }
}

/* ---------- ไฟล์นี้คือรายงานอะไร ----------
   งบทดลองมีบัญชีละบรรทัด ส่วนบัญชีแยกประเภทมีรายการละบรรทัด รหัสบัญชีเดิมซ้ำได้เป็นร้อย
   ถ้าเผลอนำบัญชีแยกประเภทเข้าเป็นยอดยกมา ยอดจะกลายเป็นผลรวมรายการทั้งปี ไม่ใช่ยอดคงเหลือ */
const LEDGER_HINTS = ['เลขที่เอกสาร', 'สมุดรายวัน', 'เลขที่อ้างอิง', 'ผู้ทำรายการ',
                      'คำอธิบายรายการ', 'voucher', 'journal', 'document no'];
const CHART_HINTS = ['ประเภทบัญชี', 'หมวดบัญชี', 'account type', 'category'];

function detectFileKind(rows, map, headerRow) {
  const head = (rows[headerRow] || []).concat(rows[headerRow - 1] || []);
  const headText = head.map((c) => norm(c)).join('|');
  const ledgerWords = LEDGER_HINTS.filter((h) => headText.indexOf(norm(h)) >= 0).length;

  let repeated = 0;
  if (map.code !== undefined) {
    const seen = {};
    rows.slice(headerRow + 1).forEach(function (r) {
      const c = String(r[map.code] === undefined ? '' : r[map.code]).trim();
      if (!c) return;
      seen[c] = (seen[c] || 0) + 1;
      if (seen[c] === 2) repeated++;
    });
  }
  if (ledgerWords >= 2 || repeated >= 3) return 'ledger';
  if (map.debit === undefined && map.credit === undefined
      && CHART_HINTS.some((h) => headText.indexOf(norm(h)) >= 0)) return 'chart';
  return 'trialBalance';
}

/* ---------- อ่านงบทดลอง ---------- */
function readTrialBalance(rows, map, headerRow) {
  const out = [], skipped = [];
  rows.slice(headerRow + 1).forEach(function (r, i) {
    const code = String(r[map.code] === undefined ? '' : r[map.code]).trim();
    const name = String(r[map.name] === undefined ? '' : r[map.name]).trim();
    const dr = map.debit === undefined ? '0' : parseAmount(r[map.debit]);
    const cr = map.credit === undefined ? '0' : parseAmount(r[map.credit]);
    if (!code && !name) return;
    if (dr === null || cr === null) { skipped.push({ line: headerRow + 2 + i, code, name, why: 'ตัวเลขอ่านไม่ออก' }); return; }
    let debit = M(dr), credit = M(cr);
    /* บางรายงานมีคอลัมน์ยอดคงเหลือคอลัมน์เดียว ติดลบแปลว่าด้านเครดิต */
    if (debit < 0 && credit === 0) { credit = -debit; debit = 0; }
    else if (credit < 0 && debit === 0) { debit = -credit; credit = 0; }
    if (debit === 0 && credit === 0) return;
    if (/^(รวม|total|ยอดรวม)/i.test(name) || /^(รวม|total)/i.test(code)) {
      skipped.push({ line: headerRow + 2 + i, code, name, why: 'บรรทัดผลรวม ข้ามอัตโนมัติ' });
      return;
    }
    out.push({ code, name, debit, credit });
  });
  return { rows: out, skipped };
}
