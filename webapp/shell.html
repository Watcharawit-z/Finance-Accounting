<title>ดุลย์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF7; --panel:#FFFFFF; --side:#F3F1EB;
  --ink:#17191A; --ink-2:#3D4245; --muted:#6E7376;
  --rule:#DFDAD0; --rule-2:#EEEAE1;
  --accent:#1F4D3D; --accent-w:#EAF0EC;
  --neg:#9C3324; --warn:#8A5B12; --warn-w:#FBF3E2; --good:#1F4D3D;
  --shadow:0 1px 2px rgba(23,25,26,.05);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14100C; --panel:#191511; --side:#100D0A;
    --ink:#EDE7DC; --ink-2:#CFC7B8; --muted:#94897A;
    --rule:#332C23; --rule-2:#241E18;
    --accent:#7FBFA3; --accent-w:#1B2A22;
    --neg:#E08C79; --warn:#D6A855; --warn-w:#2A2213; --good:#7FBFA3;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#14100C; --panel:#191511; --side:#100D0A;
  --ink:#EDE7DC; --ink-2:#CFC7B8; --muted:#94897A;
  --rule:#332C23; --rule-2:#241E18;
  --accent:#7FBFA3; --accent-w:#1B2A22;
  --neg:#E08C79; --warn:#D6A855; --warn-w:#2A2213; --good:#7FBFA3;
  --shadow:none;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans Thai","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono,.num,input,select{font-variant-numeric:tabular-nums}
.grow{flex:1}
.dim{color:var(--muted)}
.neg{color:var(--neg)}
.ctr,.c{text-align:center}
th.r,td.r,.r{text-align:right}

/* ---------- แถบบน ---------- */
.top{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:14px;
  height:54px; padding:0 18px; background:var(--panel); border-bottom:1px solid var(--rule);
}
.brand{display:flex; align-items:baseline; gap:9px}
.mark{
  font-size:19px; font-weight:600; letter-spacing:.01em; color:var(--accent);
  border-left:3px solid var(--accent); padding-left:9px; line-height:1.1;
}
.brand-sub{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase}
.co{font-size:13px; color:var(--ink-2); padding-left:14px; border-left:1px solid var(--rule)}
.periodwrap{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted)}
.periodwrap select{
  font:inherit; font-size:13px; color:var(--ink); background:var(--panel);
  border:1px solid var(--rule); border-radius:2px; padding:5px 8px;
}
.icon-btn{
  display:none; background:none; border:1px solid var(--rule); border-radius:2px;
  color:var(--ink); font-size:15px; line-height:1; padding:7px 9px; cursor:pointer;
}

/* ---------- โครง ---------- */
.shell{display:flex; align-items:flex-start; min-height:calc(100vh - 54px)}
#nav{
  width:236px; flex:none; position:sticky; top:54px; align-self:flex-start;
  height:calc(100vh - 54px); overflow-y:auto; padding:14px 0 40px;
  background:var(--side); border-right:1px solid var(--rule);
}
.nav-g{
  font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); padding:16px 20px 6px;
}
.nav-i{
  display:flex; align-items:center; gap:8px; padding:6px 20px; font-size:13.5px;
  color:var(--ink-2); text-decoration:none; border-left:2px solid transparent;
}
.nav-i:hover{background:var(--panel); color:var(--ink)}
.nav-i.on{background:var(--panel); color:var(--ink); font-weight:600; border-left-color:var(--accent)}
.badge{
  margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:10.5px;
  background:var(--neg); color:var(--panel); padding:0 5px; border-radius:2px; line-height:16px;
}
#main{flex:1; min-width:0; padding:22px 26px 60px; max-width:1500px}

/* ---------- การ์ด ---------- */
.card{background:var(--panel); border:1px solid var(--rule); border-radius:3px; margin-bottom:20px; box-shadow:var(--shadow)}
.card-h{display:flex; align-items:flex-start; gap:12px; padding:14px 18px; border-bottom:1px solid var(--rule)}
.card-h h2{margin:0; font-size:15px; font-weight:600; letter-spacing:-.005em}
.card-sub{font-size:12px; color:var(--muted); margin-top:2px}
.card-f{padding:11px 18px; border-top:1px solid var(--rule-2); font-size:12px; color:var(--muted); background:var(--paper)}
.filters{display:flex; gap:10px; padding:11px 18px; border-bottom:1px solid var(--rule-2); background:var(--paper)}
.sub-h{
  display:flex; align-items:center; gap:10px; padding:14px 18px 8px;
  font-size:12px; font-weight:600; color:var(--ink-2); letter-spacing:.01em;
}
.note{margin:12px 18px; padding:9px 12px; border-left:2px solid var(--rule); background:var(--paper); font-size:12.5px; color:var(--muted)}
.note.warn{border-left-color:var(--warn); background:var(--warn-w); color:var(--warn)}
.prose{padding:16px 18px; max-width:66ch; font-size:13.5px; color:var(--ink-2)}
.prose p{margin:0 0 11px}
.split{display:grid; grid-template-columns:1.15fr 1fr; gap:20px; align-items:start}

/* ---------- ปุ่ม ---------- */
.btn{
  font:inherit; font-size:12.5px; color:var(--ink); background:var(--panel);
  border:1px solid var(--rule); border-radius:2px; padding:6px 11px; cursor:pointer; white-space:nowrap;
}
.btn+.btn{margin-left:7px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--panel)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.disabled{opacity:.4; cursor:not-allowed}
.chip{font:inherit; font-size:12px; padding:4px 10px; border:1px solid var(--rule); background:var(--panel); border-radius:2px; cursor:pointer}
.chip.on{background:var(--accent-w); border-color:var(--accent); color:var(--accent)}
.search{
  font:inherit; font-size:13px; padding:6px 10px; border:1px solid var(--rule); border-radius:2px;
  background:var(--panel); color:var(--ink); min-width:min(340px,100%); flex:1; max-width:420px;
}

/* ---------- ตาราง ---------- */
.scroll{overflow-x:auto}
table{width:100%; border-collapse:collapse}
th{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); text-align:left; white-space:nowrap;
  padding:9px 14px; border-bottom:1px solid var(--rule); background:var(--paper);
}
td{padding:8px 14px; font-size:13px; border-bottom:1px solid var(--rule-2); vertical-align:top}
td.num{text-align:right; font-family:"IBM Plex Mono",monospace; font-size:12.5px; white-space:nowrap}
td.mono{font-family:"IBM Plex Mono",monospace; font-size:12px; white-space:nowrap}
td.num.bad{color:var(--neg)} td.num.good{color:var(--good)}
tbody tr:last-child td{border-bottom:none}
tfoot td{border-top:1.5px solid var(--ink); border-bottom:none; font-weight:600; background:var(--paper)}
.row-link{cursor:pointer}
.row-link:hover td{background:var(--accent-w)}
.empty{padding:40px 18px; text-align:center; color:var(--muted); font-size:13px}
.st{
  display:inline-block; font-size:11px; padding:1px 7px; border:1px solid; border-radius:2px; white-space:nowrap;
}
.st.paid{color:var(--good); border-color:var(--good); background:var(--accent-w)}
.st.open{color:var(--ink-2); border-color:var(--rule)}
.st.wait{color:var(--warn); border-color:var(--warn); background:var(--warn-w)}
.st.late{color:var(--neg); border-color:var(--neg)}
.st.draft{color:var(--muted); border-color:var(--rule-2)}

/* ---------- ตัวเลขสรุป ---------- */
.kpis{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px;
  background:var(--rule); border:1px solid var(--rule); border-radius:3px; margin-bottom:20px; overflow:hidden;
}
.kpi{background:var(--panel); padding:14px 16px}
.kpi.clickable{cursor:pointer}
.kpi.clickable:hover{background:var(--accent-w)}
.kpi-l{font-size:11.5px; color:var(--muted)}
.kpi-v{font-family:"IBM Plex Mono",monospace; font-size:21px; font-weight:500; margin-top:5px; letter-spacing:-.02em}
.kpi-s{font-size:11.5px; color:var(--muted); margin-top:3px}
.kpi.good .kpi-v{color:var(--good)} .kpi.bad .kpi-v{color:var(--neg)} .kpi.warn .kpi-v{color:var(--warn)}

/* ---------- รายการตรวจ ---------- */
.todo,.checks{list-style:none; margin:0; padding:4px 0}
.todo li,.checks li{display:flex; align-items:center; gap:11px; padding:11px 18px; border-bottom:1px solid var(--rule-2); font-size:13px}
.todo li:last-child,.checks li:last-child{border-bottom:none}
.todo.big li{padding:14px 18px}
.dot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--muted)}
.dot.good{background:var(--good)} .dot.bad{background:var(--neg)} .dot.warn{background:var(--warn)}
.todo .dim{font-size:12px; margin-top:1px}

/* ---------- เอกสาร ---------- */
.docgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; padding:16px 18px; font-size:13px}
.docgrid .dim{font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px}
.totals{margin-left:auto; width:min(380px,100%); padding:12px 18px; font-size:13px}
.totals div{display:flex; justify-content:space-between; padding:4px 0}
.totals b{font-family:"IBM Plex Mono",monospace; font-weight:500}
.totals .gt{border-top:1px solid var(--rule); margin-top:4px; padding-top:8px; font-weight:600}
.totals .gt b{font-weight:600}
.reco{padding:14px 18px; font-size:13px; max-width:560px}
.reco div{display:flex; justify-content:space-between; gap:20px; padding:5px 0}
.reco b{font-family:"IBM Plex Mono",monospace; font-weight:500}
.reco .gt{border-top:1px solid var(--rule); margin-top:5px; padding-top:9px; font-weight:600}

/* ---------- งบการเงิน ---------- */
table.fs td{border-bottom:none; padding:5px 14px; font-size:13.5px}
table.fs td.num,table.fs td:last-child{text-align:right; font-family:"IBM Plex Mono",monospace; font-size:13px; white-space:nowrap}
table.fs td[colspan]{text-align:left; font-family:inherit}
table.fs td.ind{padding-left:32px; color:var(--ink-2)}
table.fs tr.fs-h td{padding-top:18px; font-weight:600; font-size:13px; border-bottom:1px solid var(--ink); padding-bottom:6px}
table.fs tr.fs-h2 td{padding-top:14px; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
table.fs tr.fs-s td{border-top:1px solid var(--rule); font-weight:600; padding-top:7px}
table.fs tr.fs-t td{border-top:1px solid var(--ink); border-bottom:3px double var(--ink); font-weight:600; padding:8px 14px}
table.fs tr.sp td{height:14px}
table.fs thead th{background:transparent}

/* ---------- อื่น ๆ ---------- */
.periods{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; padding:16px 18px}
.pchip{
  font:inherit; text-align:left; padding:9px 12px; border:1px solid var(--rule); background:var(--panel);
  border-radius:2px; cursor:pointer; font-size:13px; color:var(--ink);
}
.pchip span{display:block; font-size:11px; color:var(--muted); margin-top:2px}
.pchip.closed{background:var(--paper)}
.pchip.on{border-color:var(--accent); box-shadow:inset 2px 0 0 var(--accent)}
.bar{display:inline-block; width:70px; height:5px; background:var(--rule-2); vertical-align:middle; margin-right:7px}
.bar i{display:block; height:5px; background:var(--accent)}
.lines{margin-bottom:4px}
.lines th{padding:7px 8px}
.lines td{padding:4px 8px; border-bottom:none}
.lines input,.lines select{
  font:inherit; font-size:12.5px; width:100%; min-width:70px; padding:5px 7px;
  border:1px solid var(--rule); border-radius:2px; background:var(--panel); color:var(--ink);
}
.lines input.r{text-align:right; font-family:"IBM Plex Mono",monospace}

/* ---------- แจ้งเตือน ---------- */
.toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); z-index:80;
  max-width:min(560px,92vw); padding:12px 16px; border-radius:3px; font-size:13px;
  background:var(--ink); color:var(--paper); opacity:0; pointer-events:none; transition:opacity .16s,transform .16s;
}
.toast div{font-size:12px; opacity:.75; margin-top:3px}
.toast.show{opacity:1; transform:translate(-50%,0)}
.toast.err{background:var(--neg); color:var(--panel)}

/* ---------- กล่องโต้ตอบ ---------- */
#modal{position:fixed; inset:0; z-index:70; display:none; align-items:flex-start; justify-content:center;
  background:rgba(23,25,26,.42); padding:5vh 16px; overflow-y:auto}
#modal.show{display:flex}
.modal-box{background:var(--panel); border:1px solid var(--rule); border-radius:3px; width:min(760px,100%); box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-h{display:flex; align-items:flex-start; gap:12px; padding:15px 18px; border-bottom:1px solid var(--rule)}
.modal-h h3{margin:0; font-size:15px; font-weight:600}
.modal-h .icon-btn{display:block; border:none; font-size:14px; color:var(--muted)}
.modal-b{padding:4px 0 14px; max-height:64vh; overflow-y:auto}
.modal-f{display:flex; align-items:center; gap:10px; padding:12px 18px; border-top:1px solid var(--rule); background:var(--paper); font-size:12px}
.flds{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:13px; padding:16px 18px}
.fld-w.wide{grid-column:1/-1}
.fld-w label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px}
.fld-w input,.fld-w select{
  font:inherit; font-size:13px; width:100%; padding:7px 9px;
  border:1px solid var(--rule); border-radius:2px; background:var(--panel); color:var(--ink);
}
.fld-w input:focus,.fld-w select:focus,.lines input:focus,.lines select:focus,.search:focus{
  outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-w);
}
.fld-hint{font-size:11px; color:var(--muted); margin-top:4px}

/* ---------- จอเล็ก ---------- */
@media (max-width:900px){
  .icon-btn{display:block}
  .co{display:none}
  .split{grid-template-columns:1fr}
  #nav{
    position:fixed; top:54px; left:0; z-index:50; width:264px;
    transform:translateX(-100%); transition:transform .18s ease;
  }
  body.nav-open #nav{transform:none; box-shadow:0 8px 30px rgba(0,0,0,.2)}
  #main{padding:16px 14px 60px}
  .card-h{flex-wrap:wrap}
  .brand-sub{display:none}
}
@media (max-width:520px){
  .top{padding:0 12px; gap:10px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi-v{font-size:18px}
  .totals{width:100%}
}

/* ---------- พิมพ์ ---------- */
@media print{
  .top,#nav,.card-h .btn,.filters,#toast,#modal{display:none !important}
  body{background:#fff}
  #main{padding:0; max-width:none}
  .card{border:none; box-shadow:none; margin-bottom:12px; break-inside:avoid}
  .card-h{padding:0 0 8px; border-bottom:1px solid #000}
}
</style>

<header class="top">
  <button id="menuBtn" class="icon-btn" aria-label="เมนู">☰</button>
  <div class="brand"><span class="mark">ดุลย์</span><span class="brand-sub">Duly</span></div>
  <div class="co" id="coName"></div>
  <span class="grow"></span>
  <label class="periodwrap">งวดบัญชี <select id="periodSel" aria-label="เลือกงวดบัญชี"></select></label>
</header>
<div class="shell">
  <nav id="nav" aria-label="เมนูหลัก"></nav>
  <main id="main"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>

<script>
/*__SCRIPT__*/
</script>
